notes:
  - text: "O centro do produto: o time move o relato por dentro, e a etapa que o relator vê anda sozinha por fora — o motor de tradução leva a mudança, sem ninguém avisar nada à mão."
    anchor: UC07
    position: { x: 500, y: -200 }
  - text: Hoje cada conta tem uma pessoa só, que é dono e time ao mesmo tempo. Convidar outros membros está planejado em 11-account.
    anchor: Dono do projeto
    position: { x: 993, y: 772 }
  - text: O relator é um tipo de visitante — faz tudo o que o visitante faz, e mais o que é dele.
    anchor: Relator
    position: { x: -290, y: 440 }
