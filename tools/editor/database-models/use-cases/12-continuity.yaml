notes:
  - text: Nada aqui entra antes do que está planejado. É o que o produto pode vir a ser, registrado para não se perder.
    position: { x: 626, y: 285 }
  - text: "A decidir: link de validade curta quebra quando o time abre o card dias depois. As saídas são anexar o arquivo, link permanente com login, ou link permanente e não adivinhável — cada uma com um custo."
    anchor: UC01
    position: { x: 699, y: -25 }
  - text: "A decidir: quem vê a estimativa — quem relatou ou só o time."
    anchor: UC10
    position: { x: 820, y: 547 }
