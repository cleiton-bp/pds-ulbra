notes:
  - text: A secreta nunca aparece de novo. Se desse para vê-la outra vez no painel, ela deixaria de ser secreta — e um vazamento do banco entregaria as integrações de todos os clientes.
    anchor: UC08
    position: { x: 940, y: 190 }
  - text: Fora da lista, o relato é retido, e não recusado — é assim que o domínio novo aparece para o time. A lista pega a chave colada no site errado — não quem fala direto com a API; para isso, os limites por IP e por projeto.
    anchor: UC05
    position: { x: 912, y: 480 }
