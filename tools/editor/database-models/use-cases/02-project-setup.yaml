meta:
  title: Pôr o projeto no ar
  system: PDS — painel
  description: "Do primeiro acesso ao primeiro relato: o dono entra com Google, cria o projeto — que já nasce pronto para trabalhar, do jeito que o time trabalha —, pega a chave pública e cola a ferramenta no site. As regras de comportamento do projeto estão em 03-project-rules."
actors:
  - name: Dono do projeto
    description: Quem criou o projeto e responde por ele. Hoje é a única pessoa da conta.
    position: { x: -180, y: 366 }
  - name: Google
    kind: system
    description: Confirma quem está entrando no painel. O PDS não guarda senha nenhuma.
    position: { x: 940, y: 11 }
useCases:
  - id: UC01
    name: Entrar com Google
    description: O painel só tem entrada pelo Google. Não há senha, cadastro nem confirmação de e-mail.
    width: 230
    position: { x: 260, y: 0 }
    preconditions: Ter uma conta Google.
    mainFlow:
      - O dono abre o painel e escolhe entrar com Google.
      - O Google confirma quem é a pessoa.
      - Na primeira entrada, o sistema cria a conta dela, sem cadastro nenhum.
      - O painel abre na lista de projetos da conta.
    alternativeFlows:
      - title: 2a. A pessoa desiste ou o Google recusa
        steps:
          - O painel continua na tela de entrada, sem criar nada.
    postconditions: A pessoa está no painel e enxerga os projetos da própria conta e os de outras contas em que está no time.
  - id: UC02
    name: Criar projeto
    description: Uma conta tem quantos projetos quiser — um por site ou por produto. O projeto nasce de um modelo — Quadro simples, Suporte, Kanban ou Scrum —, que já traz as colunas, a jornada pública ligada a elas e os tipos de relato.
    width: 230
    position: { x: 260, y: 120 }
    preconditions: O dono está no painel.
    mainFlow:
      - Na lista de projetos, o dono escolhe criar um.
      - Dá um nome ao projeto.
      - "Escolhe como o time trabalha, entre quatro modelos, cada um com as colunas escritas: Quadro simples (A fazer, Fazendo, Feito), já marcado; Suporte (Novo, Em atendimento, Aguardando quem relatou, Resolvido); Kanban (Backlog, A fazer, Fazendo, Em revisão, Feito); ou Scrum (A fazer, Fazendo, Em revisão, Feito)."
      - O sistema cria, de uma vez, o projeto, a chave pública, as colunas do modelo, a jornada pública já ligada a elas, os tipos de relato do modelo — cada um já com o que pergunta e a coluna em que entra — e as prioridades de fábrica; no Scrum, também liga as sprints, de duas semanas, com pontos no card.
      - O painel abre o projeto na Instalação, com os três passos para o site começar a mandar relatos.
    alternativeFlows:
      - title: 2a. O nome fica em branco
        steps:
          - O sistema recusa e pede o nome.
      - title: 3a. O dono não mexe na escolha
        steps:
          - "O projeto nasce do Quadro simples, igual ao de sempre: A fazer em Recebido, Fazendo em Em desenvolvimento, Feito em Concluído, e os tipos Defeito, Melhoria e Dúvida, entrando na primeira coluna."
      - title: 3b. O dono escolhe Suporte
        steps:
          - "A jornada é de atendimento — Recebido, Em atendimento, Esperando você e Resolvido —, com Em atendimento aceitando a volta de quem respondeu, e os tipos são Problema, Dúvida e Pedido, todos entrando em Novo."
    postconditions: O projeto já aceita relato e já anda no quadro do jeito que o time trabalha — ninguém precisa abrir tela de configuração antes. O modelo só vale na criação; depois, cada coisa se muda na própria tela. A chave secreta não nasce aqui; só a pedido (UC08).
  - id: UC03
    name: Ver as chaves
    description: A pública identifica o projeto e pode aparecer no código da página. A secreta, para quem integra pelo servidor, nasce só a pedido e aparece uma vez só, na hora em que nasce — o sistema guarda apenas o resumo dela.
    width: 230
    position: { x: 260, y: 240 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre Chaves.
      - Vê a chave pública, com o botão de copiar, e o texto que explica para que serve cada uma.
      - Da secreta, se já foi gerada, vê só o começo, para reconhecer qual é.
  - id: UC04
    name: Instalar a ferramenta no site
    description: Copia o bloco do script, já com a chave pública, e cola na página. Nada é instalado no sistema do cliente.
    width: 230
    position: { x: 260, y: 360 }
    preconditions: O projeto existe e não está arquivado.
    mainFlow:
      - O dono abre Instalação — por onde o projeto abre para quem administra, enquanto o site não mandou nenhum relato.
      - Copia o bloco do script, que já leva a chave pública do projeto.
      - Cola o bloco nas páginas do site onde quer receber relatos.
      - O script desenha o botão na página, com a aparência do projeto; a ferramenta, num iframe do PDS, só é baixada quando alguém pede para abrir — ou pelo botão do próprio site (08-customization, UC07).
    alternativeFlows:
      - title: 4a. A página está num domínio bloqueado
        steps:
          - A ferramenta não abre ali — ver UC05.
      - title: 4b. A página está num domínio que ainda não foi permitido
        steps:
          - A ferramenta abre, e o relato chega — quem relatou recebe o protocolo como sempre.
          - O relato fica em "Aguardando liberação", fora do Trabalho, e o sino de quem administra pergunta se o domínio é dele — ver UC05.
    postconditions: Quem visita a página já consegue relatar. Depois do primeiro relato, a Instalação diz que o site está funcionando, e o projeto passa a abrir pelo Trabalho também para quem administra.
  - id: UC05
    name: Decidir de onde vêm os relatos
    description: "Os domínios cujo relato entra direto no Trabalho, os bloqueados, e os que esperam decisão em \"Aguardando liberação\" — com a opção de valer também para os subdomínios."
    width: 230
    position: { x: 260, y: 480 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O sino avisa que um domínio novo mandou relato, e o dono abre Domínios.
      - Em "Aguardando liberação", vê o domínio, quantos relatos esperam e o mais novo.
      - Permite o domínio — os relatos dele entram no topo do quadro — ou o bloqueia — eles saem de vez.
      - Na lista de autorizados, acrescenta um domínio de antemão, e marca se ele vale para os subdomínios; remove o que não usa mais.
    alternativeFlows:
      - title: 3a. Um domínio que já manda relatos não deveria
        steps:
          - Em "Domínios que mandaram relatos", o dono vê cada domínio com quantos relatos e o último, e bloqueia o que não é dele — ou o acrescenta à lista de bloqueados direto, valendo ou não para os subdomínios.
          - O bloqueio vale na hora, mesmo com a lista de autorizados vazia. Os cards que já tinham vindo de lá ficam marcados "Origem bloqueada" no Trabalho, e o time decide em lote se os mantém ou apaga de vez (05-team-work, UC25).
      - title: 3b. O domínio foi bloqueado por engano
        steps:
          - O dono o tira da lista de bloqueados; os relatos voltam a entrar, e a marca some dos cards que continuam lá.
    postconditions: O relato de um domínio autorizado entra direto no Trabalho; o de um bloqueado é recusado; o de um domínio fora das duas listas — inclusive com a lista vazia — chega e espera a decisão. O relato de teste do próprio painel nunca espera.
  - id: UC06
    name: Ajustar a ferramenta
    description: "Como a ferramenta aparece no site: se aparece, o botão, o canto, a cor, o tema e os textos — com a prévia ao lado. O botão fica na tela O botão; o tema, o título e as perguntas do formulário, em Formulário; a frase da confirmação, em Quem relata."
    width: 230
    position: { x: 260, y: 600 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre O botão.
      - Escolhe se a ferramenta aparece no site e se há um botão parado na página.
      - Escolhe o canto e a cor do botão, confere na prévia e publica.
      - Em Formulário, escolhe o tema e escreve o título do formulário. O texto dentro da caixa livre é de cada tipo, em Tipos de relato — ver 03-project-rules.
      - Ainda em Formulário, decide se quem relata escolhe o tipo, e qual dos tipos ativos do projeto vem pré-marcado — o mesmo com que todo relato entra quando a escolha está escondida. "O primeiro da lista", o padrão, acompanha a ordem de Tipos de relato.
      - E escolhe como a ferramenta pergunta o título — "em poucas palavras, o que aconteceu?" —, opcional, obrigatória ou escondida.
      - Em Quem relata, escreve a frase da confirmação. Cada tela tem a prévia ao lado e grava só o que é dela.
    alternativeFlows:
      - title: 7a. O dono sai de uma das telas sem publicar
        steps:
          - O painel pergunta antes de sair, e nada do que estava publicado muda.
    postconditions: A próxima vez que a ferramenta abrir no site, ela já vem do jeito novo, sem trocar o script.
  - id: UC07
    name: Renomear ou arquivar o projeto
    description: Arquivar faz o projeto parar de aceitar relatos; ele continua na lista, marcado como arquivado. Nada é apagado.
    width: 230
    position: { x: 260, y: 720 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre Projeto.
      - Troca o nome, ou escolhe arquivar e confirma.
    alternativeFlows:
      - title: 2a. O projeto já está arquivado
        steps:
          - O dono desarquiva, e o projeto volta a aceitar relatos sem trocar o script do site.
  - id: UC08
    name: Gerar a chave secreta
    description: O projeto nasce sem ela. Gerar dá a primeira; gerar de novo põe uma nova no lugar da antiga, que para de valer na hora.
    width: 230
    position: { x: 600, y: 240 }
    mainFlow:
      - Em Chaves, na integração avançada, o dono escolhe gerar a chave secreta e confirma.
      - O sistema gera a chave.
      - O painel mostra a chave, pela única vez, para o dono copiar, e avisa antes de ele sair da tela.
    alternativeFlows:
      - title: 2a. Já havia uma secreta
        steps:
          - O sistema revoga a anterior, que para de valer na hora, e a nova toma o lugar.
    postconditions: A chave anterior, se havia, não vale mais e aparece na lista das revogadas.
  - id: UC09
    name: Fazer um relato de teste
    description: Abre a ferramenta de verdade, dentro do painel, com a mesma chave pública do site — se o relato chega, chegou pelo caminho inteiro.
    width: 230
    position: { x: 600, y: 360 }
    mainFlow:
      - Na Instalação, o dono escolhe fazer um relato de teste.
      - O painel abre a ferramenta no mesmo iframe que o site usaria.
      - O dono envia um relato.
      - O relato aparece em Trabalho, como qualquer outro, e a Instalação passa a dizer que o site está funcionando.
