meta:
  title: A conta
  system: PDS — painel
  description: "Planejado. O que é da conta, e não de um projeto: chamar quem trabalha junto, e sair de vez — excluindo a conta com prazo de arrependimento, ou apagando os dados na hora. Hoje cada conta tem uma pessoa só, que é dono e time ao mesmo tempo."
actors:
  - name: Dono do projeto
    description: Quem criou a conta e os projetos dela.
    position: { x: 40, y: 60 }
  - name: Membro do time
    description: Quem entra pelo convite, para trabalhar os relatos.
    position: { x: 40, y: 210 }
  - name: Google
    kind: system
    description: Confirma quem entra, como no primeiro acesso.
    position: { x: 9, y: 478 }
useCases:
  - id: UC01
    name: Convidar um membro
    description: "Planejado. O passo seguinte ao painel separar Configuração de Operação: chamar outra pessoa para trabalhar os relatos na mesma conta."
    position: { x: 280, y: 40 }
    preconditions: O dono está no painel.
    mainFlow:
      - O dono abre Pessoas.
      - Informa o e-mail de quem quer convidar.
      - O sistema manda o convite.
    postconditions: O convite fica pendente até a pessoa aceitar.
  - id: UC02
    name: Aceitar o convite
    description: Planejado. Quem foi convidado entra com a conta Google e passa a ver os projetos da conta.
    position: { x: 299, y: 415 }
    preconditions: Há um convite pendente para a pessoa.
    mainFlow:
      - O convidado abre o convite.
      - Entra com Google.
      - Passa a ver os projetos da conta no painel.
  - id: UC03
    name: Excluir a conta
    description: Planejado. Apaga tudo de verdade, e não só marca como apagado — depois de um prazo de arrependimento, para dar chance de desfazer uma exclusão acidental.
    position: { x: 280, y: 170 }
    preconditions: O dono está no painel.
    mainFlow:
      - O dono pede a exclusão da conta.
      - O painel diz o que vai sumir e quando.
      - O dono confirma.
      - O sistema grava o prazo no próprio pedido.
      - Passado o prazo, apaga a conta, os projetos, os relatos e os arquivos, e guarda só a contagem anônima que a pesquisa usa.
    postconditions: "Nada que identifique alguém sobra: nome, e-mail, foto e o identificador do Google saem — é ele que deixaria a conta ser reencontrada num login futuro."
  - id: UC04
    name: Cancelar a exclusão
    description: Planejado. Entrar no painel dentro do prazo cancela a exclusão sozinho — é o desfazer que a pessoa procura primeiro.
    position: { x: 530, y: 170 }
    preconditions: A conta está no prazo de exclusão.
    mainFlow:
      - O dono entra no painel.
      - O sistema cancela a exclusão e avisa na tela.
  - id: UC05
    name: Apagar os meus dados
    description: "Planejado. O pedido de LGPD: apaga na hora, sem prazo de arrependimento. É outro caminho, e não a exclusão com espera."
    position: { x: 280, y: 300 }
    preconditions: O dono está no painel.
    mainFlow:
      - O dono pede para apagar os seus dados.
      - O painel explica que é imediato e sem volta.
      - O dono confirma.
      - O sistema apaga, na hora, o que identifica a pessoa.
