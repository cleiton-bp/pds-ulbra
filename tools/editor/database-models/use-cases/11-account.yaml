notes:
  - text: "O convite é por projeto, e não pela conta inteira. O papel é administrador — configura o projeto e decide quem entra — ou membro — trabalha nos relatos, e não vê a Configuração. O convite vai só por e-mail, e só vale aceito com o Google do mesmo endereço, confirmado. O link nunca é guardado: o banco tem só o hash dele. A mesma pessoa pode estar em projetos de várias contas."
    anchor: UC01
    position: { x: 500, y: -185 }
  - text: "O prazo de 24 horas está decidido; a proposta é de 7 a 30 dias, porque quem exclui numa sexta e percebe na segunda perde tudo. A decidir também: se a ferramenta continua aceitando relato durante o prazo."
    anchor: UC03
    position: { x: 785, y: -15 }
