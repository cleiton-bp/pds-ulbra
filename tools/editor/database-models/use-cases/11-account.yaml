notes:
  - text: "A decidir: o que o membro pode fazer — só Operação, ou também Configuração —, e se o convite vale para a conta inteira ou por projeto. O e-mail do convite depende dos avisos por e-mail, em 10-communication."
    anchor: UC01
    position: { x: 500, y: -185 }
  - text: "O prazo de 24 horas está decidido; a proposta é de 7 a 30 dias, porque quem exclui numa sexta e percebe na segunda perde tudo. A decidir também: se a ferramenta continua aceitando relato durante o prazo."
    anchor: UC03
    position: { x: 785, y: -15 }
