meta:
  title: A conta
  system: PDS — painel
  description: "Chamar quem trabalha junto — por projeto, como administrador ou como membro —, cuidar de quem está no time, escolher como cada um é avisado, e sair de vez, excluindo a conta com prazo de arrependimento, ou apagando os dados na hora. O convite, o time e o perfil já existem; a exclusão é Planejado."
actors:
  - name: Dono do projeto
    description: Quem criou a conta; manda em todos os projetos dela, e é administrador de cada um.
    position: { x: 40, y: 20 }
  - name: Administrador do projeto
    description: Configura um projeto e decide quem entra nele. Pode haver mais de um.
    position: { x: 40, y: 135 }
  - name: Membro do time
    description: Quem entra pelo convite, para trabalhar os relatos.
    position: { x: 40, y: 250 }
  - name: Google
    kind: system
    description: Confirma quem entra, como no primeiro acesso.
    position: { x: 9, y: 478 }
useCases:
  - id: UC01
    name: Convidar um membro
    description: "Chamar outra pessoa para trabalhar num projeto, como administradora ou como membro. O convite é por projeto, e não pela conta inteira, e só por e-mail: o link nunca aparece na tela."
    position: { x: 280, y: 40 }
    preconditions: Quem convida é administrador do projeto, e o servidor tem e-mail, fila e o endereço do painel configurados.
    mainFlow:
      - O administrador abre Membros no projeto.
      - Informa o e-mail de quem quer convidar e o papel.
      - O sistema grava o convite e põe o e-mail na fila, sem esperar o envio.
      - O e-mail sai com o link, e a tela passa a mostrar "enviado".
    alternativeFlows:
      - Se o e-mail não sai, a tela mostra que não saiu, o motivo vai para o log, e o administrador reenvia.
      - Se o endereço já tem convite aberto, convidar de novo reenvia o mesmo, com prazo novo e o papel novo.
    postconditions: O convite fica aberto até a pessoa aceitar, até vencer — 7 dias, ajustável no projeto — ou até ser cancelado. Reenviar troca o link, e o anterior deixa de valer.
  - id: UC02
    name: Aceitar o convite
    description: Quem foi convidado entra com o Google do e-mail convidado, confirmado pelo Google, e passa a ver o projeto, com o papel do convite.
    position: { x: 299, y: 415 }
    preconditions: Há um convite aberto para a pessoa, dentro do prazo.
    mainFlow:
      - O convidado abre o link que chegou por e-mail.
      - Entra com o Google do mesmo e-mail, se ainda não estava no painel.
      - Vê o projeto, quem convidou e o papel, e aceita.
      - Passa a ver o projeto no painel, agrupado pela conta dona.
    alternativeFlows:
      - Com outra conta Google, a página mostra só uma pista do endereço convidado, e nada do projeto, e oferece trocar de conta.
      - Vencido, cancelado ou trocado por um reenvio, o link não vale, e a página diz a quem pedir um novo.
  - id: UC06
    name: Cuidar do time
    description: Ver quem está no projeto, mudar o papel de alguém ou tirar alguém do time. Todo o time vê a lista; mudar é do administrador.
    position: { x: 530, y: 40 }
    preconditions: Quem muda é administrador do projeto.
    mainFlow:
      - O administrador abre Membros no projeto.
      - Muda o papel de alguém, ou tira a pessoa do time, confirmando.
      - O acesso muda na requisição seguinte da pessoa, sem esperar o login vencer.
    alternativeFlows:
      - title: 2a. A pessoa tirada do time está com a tela de Trabalho aberta
        steps:
          - A tela fecha na hora e volta para a lista de projetos, que diz de qual projeto ela saiu. Na tela dos outros, o nome dela sai da escolha de responsável.
    postconditions: O dono não muda de papel nem sai do time — manda em todos os projetos da conta. O que quem saiu escreveu nos relatos continua com o nome dela.
  - id: UC03
    name: Excluir a conta
    description: Planejado. Apaga tudo de verdade, e não só marca como apagado — depois de um prazo de arrependimento, para dar chance de desfazer uma exclusão acidental.
    position: { x: 280, y: 170 }
    preconditions: O dono está no painel.
    mainFlow:
      - O dono pede a exclusão da conta.
      - O painel diz o que vai sumir e quando.
      - O dono confirma.
      - O sistema grava o prazo no próprio pedido.
      - Passado o prazo, apaga a conta, os projetos, os relatos e os arquivos, e guarda só a contagem anônima que a pesquisa usa.
    postconditions: "Nada que identifique alguém sobra: nome, e-mail, foto e o identificador do Google saem — é ele que deixaria a conta ser reencontrada num login futuro."
  - id: UC04
    name: Cancelar a exclusão
    description: Planejado. Entrar no painel dentro do prazo cancela a exclusão sozinho — é o desfazer que a pessoa procura primeiro.
    position: { x: 530, y: 170 }
    preconditions: A conta está no prazo de exclusão.
    mainFlow:
      - O dono entra no painel.
      - O sistema cancela a exclusão e avisa na tela.
  - id: UC05
    name: Apagar os meus dados
    description: "Planejado. O pedido de LGPD: apaga na hora, sem prazo de arrependimento. É outro caminho, e não a exclusão com espera."
    position: { x: 280, y: 300 }
    preconditions: O dono está no painel.
    mainFlow:
      - O dono pede para apagar os seus dados.
      - O painel explica que é imediato e sem volta.
      - O dono confirma.
      - O sistema apaga, na hora, o que identifica a pessoa.
  - id: UC07
    name: Escolher como sou avisado
    description: "No Perfil, a pessoa escolhe um som para cada tipo de aviso do painel — quando a mencionam, quando a escolhem como responsável — e o volume. Vale em todos os projetos e em qualquer computador."
    position: { x: 530, y: 300 }
    preconditions: A pessoa está no painel.
    mainFlow:
      - A pessoa abre o Perfil, pelo menu dela ou por "Preferências de aviso", no sino.
      - O painel mostra o nome, o e-mail e a foto — que vêm do Google, só para ler —, a conta, e o som de cada tipo de aviso, com o volume.
      - A pessoa escolhe um som para cada tipo, ouve antes, ajusta o volume e salva.
    alternativeFlows:
      - title: 3a. Sem som
        steps:
          - O aviso daquele tipo chega só no sino.
      - title: 3b. Nunca escolheu
        steps:
          - Vale o de fábrica — Plim na menção, Sino na escolha como responsável —, no volume 70.
    postconditions: Os avisos ficam no painel; nenhum vai por e-mail.
