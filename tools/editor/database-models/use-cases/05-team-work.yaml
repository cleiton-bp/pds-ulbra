meta:
  title: O time trabalha o relato
  system: PDS — painel
  description: "O que o time faz com o relato que chegou: ler, comentar, pedir informação, mover entre as colunas e encerrar. E o trabalho que não veio de fora: o card do time, e arquivar. E o que o time dá a todo card: título, responsável, prioridade, etiquetas e prazo. E o quadro, onde o time arruma e arrasta os cards — e que, como a lista e o card aberto, muda sozinho quando outra pessoa do time mexe. E as subtarefas e os vínculos entre cards, com o relato duplicado acompanhando o original. E os filtros, as raias do quadro e as mudanças em lote, para muitos cards. E o backlog e as sprints, para o projeto que liga. E as menções e os avisos, no sino, com o som que cada pessoa escolhe. E o que o sistema faz sozinho em volta disso — levar a mudança para o lado de fora e encerrar o pedido sem resposta. A moderação está em 07-moderation."
actors:
  - name: Membro do time
    description: Trabalha os relatos pelo painel, com a conta Google. O dono do projeto também é um membro do time.
    position: { x: -180, y: 336 }
  - name: Armazenamento de arquivos
    kind: system
    description: Guarda as imagens e os arquivos (e os vídeos antigos), privado. Só entrega um arquivo por link assinado, de validade curta.
    position: { x: 980, y: 136 }
  - name: Agendador
    kind: system
    description: "A fila com mensagem atrasada que segura a espera e os prazos. Não decide nada ao agendar: quando a hora chega, olha o estado atual do relato e só então age."
    position: { x: 994, y: 541 }
useCases:
  - id: UC01
    name: Ver o trabalho
    description: A tela de Trabalho, com os relatos e os cards do time, em lista ou em quadro, a contagem por coluna, o filtro por coluna e a ordem que o membro escolhe — o que responde “o que ainda não tratei”. Os filtros e a busca estão no UC19.
    width: 220
    position: { x: 260, y: 0 }
    preconditions: O membro está no painel, dentro do projeto.
    mainFlow:
      - O membro abre o projeto, que abre no Trabalho — para todos; quem administra entra pela Instalação só enquanto o site não mandou nenhum relato.
      - Vê os cards numa tabela, do mais recente para o mais antigo — o tipo, o número (#42), o título (o do time, senão o de quem relatou, senão o começo do texto, entre aspas), a coluna, quem está com ele, a prioridade, as etiquetas, o prazo e quando chegou. O protocolo e a página de onde o relato veio ficam no card aberto.
      - Ordena pelo cabeçalho — o prazo mais perto, a prioridade mais alta, o responsável, a coluna, o número, o mais novo ou o atualizado há pouco.
      - Filtra por uma ou várias colunas, ou esconde o que terminou com "Em aberto".
      - Escolhe um card para abrir.
    alternativeFlows:
      - title: 2a. Nenhum relato ainda
        steps:
          - A tela diz que a fila está vazia e aponta a Instalação.
      - title: 2b. Muitos cards
        steps:
          - A lista vem de 50 em 50, a página seguinte chega sozinha perto do fim, e o cabeçalho da tabela fica preso ao rolar.
      - title: 1a. O membro troca de projeto pelo seletor do topo
        steps:
          - Cai na mesma tela do outro projeto; a tela de configuração de um projeto que ele não administra vira o Trabalho.
      - title: 3a. O membro escolhe o quadro
        steps:
          - Cada coluna do projeto vira uma coluna do quadro, com os cards na ordem que o time arrumou — ver UC18. O quadro ocupa a altura da janela, e cada coluna rola por dentro. A escolha fica lembrada no navegador.
          - A frente do card é um resumo — o título primeiro, até três etiquetas e o prazo; no pé, o tipo, o número, a prioridade, quantos comentários e anexos, e quem está com ele —, e o detalhe abre no clique.
          - A última coluna — quando há mais de uma — mostra só o que entrou nela nos últimos dias, e diz quantos ficaram na lista. "Mostrar mais" traz os seguintes de cada coluna.
  - id: UC02
    name: Ler o relato
    description: "Tudo o que chegou: texto, tipo, onde aconteceu, quando, os arquivos e o histórico — e se quem relatou aceitou responder dúvidas."
    width: 220
    position: { x: 260, y: 125 }
    preconditions: O relato é deste projeto.
    mainFlow:
      - O membro abre o relato.
      - Lê o texto, o tipo, o site e a página onde aconteceu, e a data.
      - Vê tudo o que já aconteceu com o relato, em ordem.
      - Vê em que etapa pública ele está, e se está liberado para o público.
      - Vê as reaberturas, cada uma com o motivo e o que veio anexado.
    alternativeFlows:
      - title: 1a. Outra pessoa do time mexe no relato enquanto ele está aberto
        steps:
          - A coluna, os campos, a conversa, os arquivos e o histórico se acertam sozinhos, sem recarregar e sem contar outra leitura. O que o membro está escrevendo continua onde estava.
          - Se ela salva a descrição que o membro está editando, a tela avisa quem salvou, e ele escolhe entre usar a versão nova e manter a dele — nenhuma das duas some em silêncio.
      - title: 1b. O membro passa ao card seguinte
        steps:
          - Card anterior e Próximo card — ou as teclas K e J — andam na ordem da tela de onde ele veio; Copiar link dá o endereço do card para mandar a um colega.
      - title: 1c. O membro fecha o card com texto escrito
        steps:
          - O Esc sai primeiro da edição em que ele está; fechar com texto ainda não salvo pergunta antes de descartar.
  - id: UC03
    name: Comentar
    description: Por dentro, para o time; ou para fora, para quem relatou ler na página de acompanhamento. Os dois ficam separados de forma visível.
    width: 220
    position: { x: 260, y: 250 }
    preconditions: O relato está aberto no painel.
    mainFlow:
      - O membro escolhe entre comentário interno e comentário público.
      - Escreve e envia — pelo botão ou por Ctrl+Enter.
      - O comentário entra no relato, com quem escreveu e quando.
    alternativeFlows:
      - title: 2a. O comentário é para quem relatou
        steps:
          - O envio espera cinco segundos, com Desfazer, que devolve o texto ao campo. Fechar o card no meio envia na hora.
      - title: 3a. O membro corrige ou apaga o próprio comentário interno
        steps:
          - Só quem escreveu corrige ou apaga. O corrigido fica marcado como editado, e as menções passam a ser as do texto novo; apagar pede confirmação, e o histórico continua dizendo que houve um comentário.
    postconditions: O comentário público aparece na página de acompanhamento, e não se corrige depois — já saiu da empresa. O interno, nunca.
  - id: UC04
    name: Pedir uma informação
    description: Quando falta contexto, o time pergunta pelo próprio relato, dizendo o que falta — e a vez passa para quem relatou, com prazo.
    width: 220
    position: { x: 260, y: 375 }
    preconditions: O projeto tem o pedido de informação ligado, e quem relatou aceitou responder dúvidas.
    mainFlow:
      - No relato aberto, em qualquer coluna, o membro escolhe Pedir informação.
      - Escreve o que falta.
      - O sistema grava a pergunta como comentário público e marca que a vez é de quem relatou.
      - O sistema calcula os dois prazos — o do aviso e o do encerramento —, e a pergunta aparece no card na hora.
    alternativeFlows:
      - title: 1a. Quem relatou não aceitou responder dúvidas
        steps:
          - O painel não deixa pedir, e diz por quê.
      - title: 4a. Quem relatou responde
        steps:
          - A vez volta para o time, e o prazo para de correr.
    postconditions: A página de acompanhamento mostra a pergunta e deixa quem relatou responder.
  - id: UC05
    name: Mover entre as colunas
    description: Leva o relato de uma coluna a outra. Cada movimento vira um evento que não se apaga — é dele que saem o histórico, a linha do tempo pública e as métricas.
    width: 220
    position: { x: 260, y: 500 }
    preconditions: O relato está aberto no painel, ou à vista no quadro, e não está arquivado.
    mainFlow:
      - O membro escolhe a coluna de destino — no card aberto, ou soltando o card em outra coluna do quadro (UC18).
      - O sistema grava o evento — de onde, para onde, quem e quando — e só depois atualiza o estado atual do relato.
      - O sistema leva a mudança para a etapa pública (UC09).
    alternativeFlows:
      - title: 1a. O destino é a última coluna ativa, e o projeto encerra por coluna
        steps:
          - O painel pede o desfecho e o motivo antes de mover — ver UC06.
      - title: 1b. O movimento foi um engano
        steps:
          - O membro move de volta. Dentro da espera do projeto, quem relatou nunca chega a ver o engano.
      - title: 1c. O relato está encerrado, na coluna que encerra, e vai para outra
        steps:
          - O painel pergunta antes, porque mover reabre o relato — "Reabrir o relato?". Cancelar deixa o card onde estava; confirmar move e reabre.
  - id: UC06
    name: Encerrar com motivo
    description: Diz como terminou — foi feito, não será feito, sem retorno ou já existia — e por quê. O motivo é obrigatório, e é o que quem relatou lê.
    width: 220
    position: { x: 260, y: 660 }
    preconditions: O relato está aberto no painel, ou é solto no quadro, e não está encerrado.
    mainFlow:
      - O membro escolhe Encerrar relato, em qualquer coluna, ou move o relato para a última coluna, num projeto que encerra por coluna.
      - Escolhe o desfecho.
      - Escreve o motivo.
      - O sistema grava o encerramento.
      - Passada a espera do projeto, o encerramento aparece na página de acompanhamento.
    alternativeFlows:
      - title: 1a. Encerrar fora da coluna que encerra, num projeto que encerra por coluna
        steps:
          - O diálogo avisa que o relato vai para a coluna que encerra, e o leva para ela ao confirmar.
      - title: 3a. O motivo fica em branco
        steps:
          - O sistema não encerra e pede o motivo.
      - title: 5a. O membro tira o relato da última coluna antes de quem relatou confirmar
        steps:
          - O painel pergunta antes. Confirmado, o encerramento é cancelado, e o histórico registra o cancelamento — que não é uma reabertura.
    postconditions: Quem relatou pode confirmar que resolveu, ou reabrir — ver 06-tracking.
  - id: UC07
    name: Ver os arquivos do relato
    description: O relato como quem relatou montou — a imagem logo abaixo do texto, no tamanho escolhido —, e os arquivos para baixar.
    width: 240
    position: { x: 600, y: 125 }
    mainFlow:
      - O membro abre o relato, e o sistema confere que ele pode ver aquele relato antes de gerar os links de leitura, de validade curta.
      - Cada imagem aparece no lugar de onde veio — embaixo do relato, da resposta ou da reabertura —, no tamanho e na ordem que quem relatou escolheu, com o nome original e o tamanho. Um clique abre em tamanho real, em outra aba.
      - Cada arquivo aparece como uma linha para baixar, com o nome original e o aviso de abrir só o que se esperava receber. Baixar nunca abre o arquivo na página.
      - Os vídeos antigos continuam tocando.
    alternativeFlows:
      - title: 2a. O link venceu
        steps:
          - O painel pede links novos antes de vencer, e de novo quando um arquivo falha — em vez de quebrar em silêncio.
      - title: 2b. Um arquivo não carregou
        steps:
          - O lugar dele diz que não carregou, com "Tentar de novo".
      - title: 2c. A fala ou a reabertura do arquivo não está na tela
        steps:
          - O arquivo aparece embaixo do relato, depois dos da criação, dizendo de onde veio — em vez de sumir.
  - id: UC08
    name: Encerrar sem retorno
    description: Quando o segundo prazo do pedido de informação vence sem resposta, o relato encerra sozinho como “sem retorno”.
    width: 240
    position: { x: 600, y: 375 }
    preconditions: Há um pedido de informação aberto, e a vez é de quem relatou.
    mainFlow:
      - Passado o primeiro prazo, a página de acompanhamento muda de tom e avisa que o relato vai encerrar.
      - No segundo prazo, o agendador chega e confere o relato.
      - Se a vez ainda é de quem relatou, o sistema encerra como “sem retorno”, com a origem marcada como sistema, e não como time.
    alternativeFlows:
      - title: 3a. Quem relatou respondeu antes
        steps:
          - A mensagem encontra o pedido já respondido e se descarta.
    postconditions: O relato encerrado assim continua reabrível — quem sumiu por 14 dias pode voltar no dia 30.
  - id: UC09
    name: Levar a mudança para a etapa pública
    description: "O motor de tradução lê o mapa e decide o que quem relatou vê: a etapa anda, fica onde está, ou o estado não tem etapa e o dono é avisado."
    width: 240
    position: { x: 600, y: 500 }
    mainFlow:
      - O sistema recebe o estado novo, o mapa do projeto e a etapa pública atual.
      - Decide a etapa pública — sem nunca voltar, a não ser para uma etapa que permite retorno.
      - Sem espera, a etapa pública muda na hora.
      - Com espera, o agendador volta no fim dela, olha o estado de agora e só então publica.
    alternativeFlows:
      - title: 2a. O estado não tem etapa no mapa
        steps:
          - A etapa pública fica onde estava, o evento é gravado como não mapeado, e o dono é avisado.
      - title: 2b. Os dois estados caem na mesma etapa
        steps:
          - A página de acompanhamento não muda — porque não deve.
      - title: 4a. O relato voltou antes do fim da espera
        steps:
          - O agendador encontra o estado novo e descarta a mudança antiga. Nada é cancelado, e nada vaza.
  - id: UC10
    name: Apagar a mídia vencida
    description: Adiado. Quando o prazo de guarda que o projeto escolheu vence, o arquivo sai do armazenamento.
    width: 230
    position: { x: 600, y: 660 }
    preconditions: O projeto definiu um prazo de guarda, e ele venceu para algum arquivo.
    mainFlow:
      - O agendador olha o arquivo no momento em que o prazo vence.
      - Confere o estado atual — o prazo pode ter mudado depois do agendamento.
      - Apaga o arquivo do armazenamento e registra.
  - id: UC11
    name: Criar o card do time
    description: O trabalho que não veio de fora. Título, descrição em Markdown, a coluna em que nasce e, se quiser, o responsável e a prioridade; ganha o número seguinte do projeto e nunca tem lado de fora.
    width: 220
    position: { x: 600, y: 0 }
    preconditions: O membro está na tela de Trabalho, e o projeto não está arquivado.
    mainFlow:
      - O membro escolhe Novo card, ou aperta a tecla c fora de um campo.
      - Escreve o título e, se quiser, a descrição — a barra escreve as marcas, e Visualizar mostra como fica.
      - Escolhe a coluna, ou fica com a primeira; e, se quiser, o responsável e a prioridade.
      - Cria — pelo botão, pelo Enter no título, ou por Ctrl+Enter de qualquer campo.
      - O sistema dá o próximo número do projeto e grava o card, já com o responsável e a prioridade; o aviso diz onde ele foi parar, com Abrir.
    alternativeFlows:
      - title: 2a. O título fica em branco
        steps:
          - O painel não cria, e pede o título.
      - title: 1a. O membro cria pela coluna, no quadro
        steps:
          - Escolhe Criar, logo abaixo do cabeçalho de uma coluna que recebe card, e um campo abre ali.
          - Escreve o título e dá Enter; o card nasce na coluna, logo abaixo do campo, e o campo continua aberto para o próximo. Esc fecha.
          - Mais detalhes abre o formulário inteiro, já com a coluna e o título.
      - title: 3a. As sprints estão ligadas
        steps:
          - O formulário diz onde o card entra — o backlog, de saída, ou uma sprint; o campo da coluna do quadro cria na sprint em andamento.
      - title: 5a. Os filtros ligados não deixam o card aparecer
        steps:
          - A lista é relida, e o aviso diz que o card foi criado mas não aparece ali por causa dos filtros.
      - title: 5b. O card é movido para a última coluna
        steps:
          - Não há desfecho nem motivo a pedir — ninguém de fora vai ler —, e a etapa pública não se mexe.
    postconditions: O card aparece no topo da coluna dele, e não aparece em lugar nenhum do lado de fora. Quem foi escolhido como responsável é avisado no sino.
  - id: UC12
    name: Arquivar
    description: Tira o card da tela de Trabalho. O card do time sempre; o relato só com a regra do ciclo ligada, e o relato aberto encerra junto, com o motivo que quem relatou lê.
    width: 220
    position: { x: 600, y: 820 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe arquivar.
      - Num relato aberto, escolhe o desfecho e escreve o motivo; no card do time ou no relato já encerrado, só confirma.
      - O sistema arquiva — e encerra junto o relato aberto.
      - O card sai da tela de Trabalho e aparece em Arquivados, para ler, comentar ou desarquivar.
    alternativeFlows:
      - title: 1a. O projeto não arquiva relato
        steps:
          - O painel não oferece arquivar o relato; o caminho continua sendo encerrar.
      - title: 4a. Quem relatou reabre, ou responde a uma pergunta que estava aberta
        steps:
          - O relato volta sozinho para a tela de Trabalho. No histórico, o desarquivar aparece sem nome de ninguém do time, junto da reabertura ou da resposta de quem relatou.
    postconditions: Quem relatou lê o motivo pelo link, e pode reabrir ou finalizar, com a nota.
  - id: UC13
    name: Dar título ao relato
    description: O time reescreve o título que o relato traz, para reconhecer o card de cara. O que quem relatou escreveu fica guardado, e é o único título que volta para ela.
    width: 220
    position: { x: 260, y: 1000 }
    preconditions: O relato está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe reescrever o título.
      - Escreve o título do time, numa linha.
      - O sistema guarda o título do time ao lado do que quem relatou escreveu.
      - O card passa a mostrar o título do time, com o de quem relatou logo embaixo.
    alternativeFlows:
      - title: 2a. O membro quer voltar ao título de quem relatou
        steps:
          - Escolhe voltar ao de quem relatou, e o card volta a mostrá-lo.
    postconditions: Quem relatou continua vendo só o título que escreveu, no acompanhamento e na lista pessoal.
  - id: UC14
    name: Escolher o responsável
    description: Diz quem do time está com o card — um só, para nunca ficar a dúvida.
    width: 220
    position: { x: 260, y: 1160 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe alguém do time como responsável, ou ninguém. O campo mostra a escolha na hora, enquanto grava.
      - O sistema guarda e conta a mudança no histórico.
    alternativeFlows:
      - title: 2a. A gravação falha
        steps:
          - O campo volta ao que vale e diz, embaixo dele, o que não deu.
      - title: 1a. O responsável saiu do time
        steps:
          - O card continua com ele, como registro, marcado como fora do time — e só alguém do time pode ser escolhido no lugar.
    postconditions: A linha do card na tela de Trabalho mostra quem está com ele.
  - id: UC15
    name: Priorizar o card
    description: Diz o quanto o card importa, com as prioridades do projeto. O card nasce sem prioridade.
    width: 220
    position: { x: 600, y: 1000 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe uma das prioridades do projeto, ou nenhuma.
      - O sistema guarda e conta a mudança no histórico, com o nome da prioridade.
    alternativeFlows:
      - title: 1a. A prioridade do card foi desativada
        steps:
          - Ela continua no card, marcada, e não é oferecida para outro.
    postconditions: A linha do card mostra a prioridade, na cor dela e com o nome escrito.
  - id: UC16
    name: Etiquetar o card
    description: Põe e tira etiquetas do projeto no card. A etiqueta que falta, o próprio membro cria.
    width: 220
    position: { x: 260, y: 1320 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escreve o nome de uma etiqueta, ou o começo dele.
      - As etiquetas do projeto que batem aparecem, com a primeira destacada — a de nome igual, depois a que começa igual —; as setas andam, e Enter põe a destacada.
      - O sistema põe a etiqueta no card e conta no histórico.
    alternativeFlows:
      - title: 2a. A etiqueta não existe
        steps:
          - O membro escolhe Criar, o último da lista — ou dá Enter, quando não há nenhuma parecida —, e ela entra no card já criada, com uma cor da paleta.
      - title: 2b. O membro tira uma etiqueta
        steps:
          - A etiqueta sai do card, e o histórico conta.
    postconditions: O card leva até dez etiquetas; a linha da lista mostra a primeira e quantas mais há, e a frente no quadro, até três.
  - id: UC17
    name: Dar prazo ao card
    description: Diz para quando o card precisa estar pronto — só a data.
    width: 220
    position: { x: 600, y: 1160 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe a data do prazo, ou tira o prazo.
      - O sistema guarda e conta a mudança no histórico.
    postconditions: A linha do card, o quadro e o card aberto mostram o prazo com o destaque — vermelho quando venceu, amarelo quando está perto, sempre com as palavras; o card que terminou fica só com a data.
  - id: UC18
    name: Arrumar o quadro
    description: Muda o card de lugar no quadro, arrastando com o mouse, o toque ou o teclado — dentro da coluna, na ordem que o time inteiro vê, ou para outra coluna.
    width: 220
    position: { x: 600, y: 1320 }
    preconditions: O membro está na tela de Trabalho, no quadro, e o card não está arquivado.
    mainFlow:
      - O membro pega um card — o mouse depois de andar um pouco, o toque depois de segurar perto de meio segundo, o teclado com espaço, depois de chegar ao card pelas setas.
      - Solta o card entre dois outros, na mesma coluna.
      - O sistema guarda o lugar novo, e todo o time passa a ver o card ali.
    alternativeFlows:
      - title: 2a. O membro solta o card em outra coluna
        steps:
          - O card muda de coluna (UC05), já no lugar em que foi solto.
      - title: 2b. É um relato aberto, solto na coluna que encerra
        steps:
          - O painel pede o desfecho e o motivo antes de mover — ver UC06. Desistir devolve o card ao lugar.
      - title: 2c. O card é solto fora das colunas que recebem
        steps:
          - No cabeçalho da página, em "Sem coluna" ou na coluna desativada ninguém solta card. O card volta ao lugar, e nada muda.
      - title: 2e. É um relato encerrado, tirado da coluna que encerra
        steps:
          - O painel pergunta antes de reabrir. Cancelar, ou Esc, devolve o card ao lugar exato.
      - title: 2f. O sistema recusa, ou a rede cai
        steps:
          - O card volta, e o aviso diz para onde — e, sem conexão, que basta arrastar de novo quando a internet voltar.
      - title: 2d. Outra pessoa do time muda o quadro enquanto ele está aberto
        steps:
          - O card movido, criado ou editado por ela aparece na tela sem recarregar, aceso por um instante — e, se o membro estiver arrastando, a tela espera ele soltar. O card com o foco que ela move leva o foco junto.
      - title: 3a. O card de cima, ou o próprio card, já saiu da coluna
        steps:
          - Outra pessoa o moveu ou arquivou. O sistema recusa o lugar, porque ele já não existe; o painel diz que foi outra pessoa, lê o quadro de novo e mostra o card onde ele está.
      - title: 3b. Outra pessoa solta na mesma coluna ao mesmo tempo
        steps:
          - Um espera o outro, e cada card ganha um lugar só dele.
    postconditions: "O que chega a uma coluna sem ser arrastado — o relato novo, o card novo, o movido pelo card aberto, o reaberto por quem relatou (mude de coluna ou não) e o que ela tira do arquivo ao responder — entra no topo."
  - id: UC20
    name: Quebrar o card em subtarefas
    description: "O membro quebra um relato ou um card do time em partes menores: cada subtarefa é um card do time filho dele, com coluna e responsável próprios, e o pai mostra quantas terminaram. Um nível só."
    width: 220
    position: { x: 260, y: 1480 }
    preconditions: O card está aberto e fora do arquivo, e não é subtarefa.
    mainFlow:
      - O membro escreve o que precisa ser feito no campo "Criar subtarefa" do card aberto.
      - O sistema cria a subtarefa na primeira coluna, sem responsável, com o próximo número do projeto.
      - A subtarefa aparece no quadro e na lista, com o pai indicado, e o pai passa a mostrar o progresso.
    alternativeFlows:
      - title: 3a. A subtarefa chega à última coluna
        steps:
          - Ela conta como feita, e o progresso do pai anda — na tela de quem tem o pai aberto também, ao vivo.
      - title: 3b. O pai é arquivado
        steps:
          - As subtarefas vão junto para o arquivo; desarquivar o pai traz de volta as que foram com ele.
      - title: 3c. O membro marca pelo círculo
        steps:
          - Na lista do pai, o círculo leva a subtarefa para a última coluna ativa; Reabrir a devolve para a primeira.
    postconditions: Mover a subtarefa nunca mexe na etapa pública — quem relatou só vê o relato andar quando o relato anda.
  - id: UC19
    name: Filtrar e buscar os cards
    description: "Recorta a tela de Trabalho — na lista e no quadro, com os mesmos filtros — por responsável, etiqueta, prioridade, tipo, vencidos e em aberto, e busca pelo título, pelo texto, pelo número ou pelo protocolo, sem diferenciar maiúscula nem acento. Na lista, também pela coluna e pela sprint."
    width: 220
    position: { x: 600, y: 1480 }
    preconditions: O membro está na tela de Trabalho.
    mainFlow:
      - O membro digita na busca, ou liga um atalho — "Meus cards", "Vencidos", "Em aberto" —, ou marca opções nos menus de responsável, etiqueta, prioridade e tipo; na lista, também de coluna e de sprint.
      - A lista e cada coluna do quadro passam a mostrar só os cards que passam nos filtros, e o total de cada coluna acompanha — no quadro, quantos passam de quantos há.
      - O filtro ligado diz no próprio controle qual valor está valendo, e "Limpar filtros" volta a tudo.
    alternativeFlows:
      - title: 1a. Nenhum card passa nos filtros
        steps:
          - A tela diz que nada passa nos filtros, e não que o projeto está vazio; "Limpar filtros" fica ao lado.
      - title: 1b. Vencidos
        steps:
          - Entram só os cards com prazo antes de hoje que ainda não terminaram — o relato encerrado e o card na última coluna não entram, e o prazo deles não fica vermelho.
      - title: 1c. Em aberto
        steps:
          - Saem os que terminaram, pela mesma regra; fica o trabalho que falta.
      - title: 1d. Sem as subtarefas
        steps:
          - No menu de tipo, desmarcar Subtarefas deixa só os cards de primeiro nível.
      - title: 1e. A sprint concluída
        steps:
          - Escolhida no filtro de sprint da lista, mostra o que ela entregou.
    postconditions: Os filtros ficam lembrados enquanto a aba estiver aberta, só naquele projeto. A ordem da tabela também, à parte — limpar os filtros não a desfaz.
  - id: UC21
    name: Vincular cards
    description: "Liga dois cards do projeto: um bloqueia o outro, os dois estão relacionados, ou um é duplicado do outro — e o relato duplicado passa a acompanhar o original até o desfecho."
    width: 220
    position: { x: 260, y: 1640 }
    preconditions: O card está aberto e fora do arquivo.
    mainFlow:
      - O membro escolhe o tipo do vínculo e acha o outro card pela busca, pelo número ou pelo título.
      - O sistema grava o vínculo nos dois cards, cada um visto do seu lado, e a história de cada um conta.
      - O card bloqueado passa a mostrar, no quadro e na lista, por quem está bloqueado — até o bloqueador terminar.
    alternativeFlows:
      - title: 1a. Duplicado de
        steps:
          - O painel diz o que vai acontecer e pede confirmação antes de marcar.
          - O duplicado vai para o arquivo. Se é relato, quem o escreveu passa a ver a etapa do original, e quando o original encerra recebe o mesmo desfecho e o mesmo motivo.
          - Os duplicados do duplicado passam para o original.
      - title: 1b. O original volta
        steps:
          - O time tira o original da coluna que encerra, ou quem relatou o original reabre — o encerramento que os duplicados receberam sai, e eles esperam o próximo.
      - title: 1c. Quem relatou o duplicado reabre ou responde
        steps:
          - O card volta ao quadro, e o vínculo vira "relacionado a".
      - title: 2a. Desfazer
        steps:
          - O vínculo some dos dois cards; o duplicado volta do arquivo, com as subtarefas que foram com ele.
    postconditions: Bloquear só marca — mover continua livre. Nada do vínculo aparece para quem relatou além da etapa e do encerramento, que seguem o original.
  - id: UC22
    name: Mencionar e ser avisado
    description: "O membro chama alguém do time com @ no comentário entre o time, ou o escolhe como responsável; a pessoa é avisada no sino do painel, com o som que ela escolheu para aquele tipo de aviso."
    width: 220
    position: { x: 600, y: 1640 }
    preconditions: O card está aberto.
    mainFlow:
      - O membro digita @ na caixa "Entre o time" e escolhe alguém na lista do time.
      - O sistema grava o comentário com a menção e põe um aviso no sino de quem foi mencionado.
      - A pessoa vê o número no sino, abre o aviso — com o começo do comentário — e cai no card, rolado até a menção; o aviso fica lido.
    alternativeFlows:
      - title: 1a. Escolhido como responsável
        steps:
          - O aviso vai para o sino da pessoa, com o som da escolha como responsável.
      - title: 2a. A pessoa está na tela de Trabalho
        steps:
          - O sino dela muda na hora, pelo tempo real, e toca o som que ela escolheu no Perfil para o tipo — ou nenhum, se escolheu "Sem som". Nas outras telas, em até um minuto.
      - title: 1b. A pessoa mencionou a si mesma, ou se escolheu
        steps:
          - Ninguém é avisado do que fez.
      - title: 3a. A pessoa saiu do time
        steps:
          - Os avisos daquele projeto somem do sino dela.
      - title: 3b. Muitos avisos
        steps:
          - O sino abre nos não lidos, junta os parecidos seguidos numa linha só, e traz os mais antigos até o fim.
      - title: 2b. O comentário é corrigido ou apagado
        steps:
          - Quem entrou na correção é avisado, e o aviso de quem saiu some; apagado, os avisos dele saem do sino.
    postconditions: Os avisos ficam no painel, sem e-mail. Nada disso aparece para quem relatou — a caixa dele nem oferece a lista do @.
  - id: UC23
    name: Planejar e trabalhar em sprints
    description: "Com as sprints ligadas na tela Sprints, o time planeja no Backlog o que entra em cada sprint, estima em pontos, inicia uma — e o quadro passa a mostrar só ela — e, ao concluir, escolhe para onde vai o que não terminou."
    width: 220
    position: { x: 260, y: 1800 }
    preconditions: O administrador ligou "Trabalhar em sprints" na tela Sprints — ver 03-project-rules.
    mainFlow:
      - O membro abre a aba Backlog e cria uma sprint; ela nasce planejada, com o próximo número e a duração padrão do projeto, logo depois da última.
      - O membro leva cards do backlog para a sprint — arrastando, pelo teclado ou pelo menu do card, que avisa para onde o card foi e oferece Desfazer — e estima cada um em pontos ali mesmo, na linha, onde também vê a prioridade e o prazo.
      - O membro inicia a sprint, que começa hoje e dura o padrão do projeto — podendo acertar o nome, o objetivo e as datas, ou voltar às planejadas; o quadro passa a mostrar só os cards dela, com a barra da sprint em cima.
      - O time trabalha no quadro; a barra mostra quantos cards e quantos pontos já terminaram, e quanto falta para o fim.
      - O membro conclui a sprint e escolhe para onde vai o que não terminou — a próxima planejada já vem escolhida.
    alternativeFlows:
      - title: 2a. Subtarefa
        steps:
          - A subtarefa vai com o pai, e não leva pontos.
      - title: 3a. Já há uma sprint em andamento
        steps:
          - O sistema recusa; uma de cada vez.
      - title: 5a. Para onde vai o que não terminou
        steps:
          - Para o backlog, para uma sprint planejada ou para uma sprint nova, criada na hora — sempre no fim da lista, com a história do card contando.
      - title: 5b. Apagar uma sprint planejada
        steps:
          - Os cards dela voltam para o fim do backlog, e o número não volta.
      - title: 5c. Seguir para a próxima
        steps:
          - O aviso de concluída oferece iniciar a sprint que recebeu os cards, já começando hoje.
      - title: 2b. Achar um card no backlog
        steps:
          - A busca, pelo título ou pelo número, e "Meus cards" escondem o que não bate, sem mudar a ordem.
      - title: 1a. As sprints são desligadas
        steps:
          - O Backlog sai da tela e o quadro volta a mostrar tudo; nada é apagado, e religar devolve como estava.
    postconditions: A sprint concluída guarda o que terminou nela. Nada da sprint aparece para quem relatou.
  - id: UC24
    name: Agrupar o quadro em raias
    description: "O membro divide o quadro em raias por responsável ou por prioridade, e passa um card para outra pessoa — ou outra prioridade — arrastando para a raia dela."
    width: 220
    position: { x: 600, y: 1960 }
    preconditions: O quadro está aberto.
    mainFlow:
      - O membro escolhe "Raias por responsável" (ou "por prioridade") na barra do quadro.
      - O sistema mostra uma raia por pessoa com card, em ordem alfabética, depois uma raia compacta para cada pessoa do time sem card, e "Sem responsável" por último, com as colunas de sempre em cada uma.
      - O membro arrasta um card para a raia de outra pessoa; o sistema passa o card para ela, e a pessoa é avisada no sino.
    alternativeFlows:
      - title: 3a. Na diagonal
        steps:
          - O card muda de coluna e de responsável no mesmo movimento.
      - title: 3b. Para "Sem responsável"
        steps:
          - O card fica sem responsável.
      - title: 3c. O sistema recusa o campo
        steps:
          - O card fica na coluna em que foi solto e volta para a raia de antes, com o motivo na tela.
    postconditions: A escolha das raias fica lembrada neste navegador, por projeto. Cada pessoa do time vê o quadro como preferir.
  - id: UC25
    name: Mudar vários cards de uma vez
    description: "Na lista, o membro marca vários cards e, de uma vez, os move de coluna, escolhe o responsável ou a prioridade, adiciona ou remove uma etiqueta, ou os leva para uma sprint — e desfaz, se errou."
    width: 220
    position: { x: 260, y: 1960 }
    preconditions: A lista da tela de Trabalho está aberta.
    mainFlow:
      - O membro marca os cards — um a um, um trecho com Shift, os da página, ou todos os que passam nos filtros.
      - O sistema mostra a barra do lote com quantos estão marcados.
      - O membro escolhe a mudança; o sistema aplica card por card, com as regras de sempre, e diz quantos mudaram.
    alternativeFlows:
      - title: 3a. Alguns não mudam
        steps:
          - O sistema lista os que não mudaram, com o porquê; os outros ficam mudados.
      - title: 3b. Para a coluna que encerra
        steps:
          - O sistema pede o desfecho e o motivo uma vez, e os relatos abertos encerram todos com eles.
      - title: 3c. Subtarefas para uma sprint
        steps:
          - Ficam de fora: a subtarefa vai com o pai.
      - title: 3d. O membro desfaz
        steps:
          - Por dez segundos, o aviso oferece Desfazer, que devolve cada card ao valor de antes, card por card. O movido para a coluna que encerra não volta — ela já perguntou antes.
    postconditions: Trocar o filtro, a coluna, a vista ou o projeto desmarca tudo.
