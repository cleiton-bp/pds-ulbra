meta:
  title: O time trabalha o relato
  system: PDS — painel
  description: "O que o time faz com o relato que chegou: ler, comentar, pedir informação, mover entre os estados e encerrar. E o trabalho que não veio de fora: o card do time, e arquivar. E o que o time dá a todo card: título, responsável, prioridade, etiquetas e prazo. E o quadro, onde o time arruma e arrasta os cards — e que, como a lista e o card aberto, muda sozinho quando outra pessoa do time mexe. E o que o sistema faz sozinho em volta disso — levar a mudança para o lado de fora e encerrar o pedido sem resposta. A moderação está em 07-moderation."
actors:
  - name: Membro do time
    description: Trabalha os relatos pelo painel, com a conta Google. O dono do projeto também é um membro do time.
    position: { x: -180, y: 336 }
  - name: Armazenamento de arquivos
    kind: system
    description: Guarda as imagens e os arquivos (e os vídeos antigos), privado. Só entrega um arquivo por link assinado, de validade curta.
    position: { x: 980, y: 136 }
  - name: Agendador
    kind: system
    description: "A fila com mensagem atrasada que segura a espera e os prazos. Não decide nada ao agendar: quando a hora chega, olha o estado atual do relato e só então age."
    position: { x: 994, y: 541 }
useCases:
  - id: UC01
    name: Ver o trabalho
    description: A tela de Trabalho, com os relatos e os cards do time, em lista ou em quadro, a contagem por coluna e o filtro por estado — o que responde “o que ainda não tratei”.
    width: 220
    position: { x: 260, y: 0 }
    preconditions: O membro está no painel, dentro do projeto.
    mainFlow:
      - O membro abre Trabalho.
      - Vê os cards numa tabela, do mais recente para o mais antigo — o tipo, o número (#42), o título (o do time, senão o de quem relatou, senão o começo do texto), a coluna, quem está com ele, a prioridade, as etiquetas, o prazo e quando chegou. O protocolo e a página de onde o relato veio ficam no card aberto.
      - Filtra por coluna, para ver só um estado.
      - Escolhe um relato para abrir.
    alternativeFlows:
      - title: 2a. Nenhum relato ainda
        steps:
          - A tela diz que a fila está vazia e aponta a Instalação.
      - title: 3a. O membro escolhe o quadro
        steps:
          - Cada estado vira uma coluna, com os cards na ordem que o time arrumou — ver UC18. A escolha fica lembrada no navegador.
          - A frente do card é um resumo — o título primeiro, até três etiquetas e o prazo; no pé, o tipo, o número, a prioridade, quantos comentários e anexos, e quem está com ele —, e o detalhe abre no clique.
          - A última coluna — quando há mais de uma — mostra só o que entrou nela nos últimos dias, e diz quantos ficaram na lista. "Mostrar mais" traz os seguintes de cada coluna.
  - id: UC02
    name: Ler o relato
    description: "Tudo o que chegou: texto, tipo, onde aconteceu, quando, os arquivos e o histórico — e se quem relatou aceitou responder dúvidas."
    width: 220
    position: { x: 260, y: 125 }
    preconditions: O relato é deste projeto.
    mainFlow:
      - O membro abre o relato.
      - Lê o texto, o tipo, o site e a página onde aconteceu, e a data.
      - Vê tudo o que já aconteceu com o relato, em ordem.
      - Vê em que etapa pública ele está, e se está liberado para o público.
      - Vê as reaberturas, cada uma com o motivo e o que veio anexado.
    alternativeFlows:
      - title: 1a. Outra pessoa do time mexe no relato enquanto ele está aberto
        steps:
          - A coluna, os campos, a conversa, os arquivos e o histórico se acertam sozinhos, sem recarregar e sem contar outra leitura. O que o membro está escrevendo continua onde estava.
  - id: UC03
    name: Comentar
    description: Por dentro, para o time; ou para fora, para quem relatou ler na página de acompanhamento. Os dois ficam separados de forma visível.
    width: 220
    position: { x: 260, y: 250 }
    preconditions: O relato está aberto no painel.
    mainFlow:
      - O membro escolhe entre comentário interno e comentário público.
      - Escreve e envia.
      - O comentário entra no relato, com quem escreveu e quando.
    postconditions: O comentário público aparece na página de acompanhamento. O interno, nunca.
  - id: UC04
    name: Pedir uma informação
    description: Quando falta contexto, o time pergunta pelo próprio relato, dizendo o que falta — e a vez passa para quem relatou, com prazo.
    width: 220
    position: { x: 260, y: 375 }
    preconditions: O projeto tem o pedido de informação ligado, e quem relatou aceitou responder dúvidas.
    mainFlow:
      - No relato aberto, o membro escolhe pedir uma informação.
      - Escreve o que falta.
      - O sistema grava a pergunta como comentário público e marca que a vez é de quem relatou.
      - O sistema calcula os dois prazos — o do aviso e o do encerramento.
    alternativeFlows:
      - title: 1a. Quem relatou não aceitou responder dúvidas
        steps:
          - O painel não deixa pedir, e diz por quê.
      - title: 4a. Quem relatou responde
        steps:
          - A vez volta para o time, e o prazo para de correr.
    postconditions: A página de acompanhamento mostra a pergunta e deixa quem relatou responder.
  - id: UC05
    name: Mover entre os estados
    description: Leva o relato de uma coluna a outra. Cada movimento vira um evento que não se apaga — é dele que saem o histórico, a linha do tempo pública e as métricas.
    width: 220
    position: { x: 260, y: 500 }
    preconditions: O relato está aberto no painel, ou à vista no quadro, e não está arquivado.
    mainFlow:
      - O membro escolhe o estado de destino — no card aberto, ou soltando o card em outra coluna do quadro (UC18).
      - O sistema grava o evento — de onde, para onde, quem e quando — e só depois atualiza o estado atual do relato.
      - O sistema leva a mudança para a etapa pública (UC09).
    alternativeFlows:
      - title: 1a. O destino é a última coluna ativa, e o projeto encerra por coluna
        steps:
          - O painel pede o desfecho e o motivo antes de mover — ver UC06.
      - title: 1b. O movimento foi um engano
        steps:
          - O membro move de volta. Dentro da espera do projeto, quem relatou nunca chega a ver o engano.
  - id: UC06
    name: Encerrar com motivo
    description: Diz como terminou — foi feito, não será feito, sem retorno ou já existia — e por quê. O motivo é obrigatório, e é o que quem relatou lê.
    width: 220
    position: { x: 260, y: 660 }
    preconditions: O relato está aberto no painel, ou é solto no quadro, e não está encerrado.
    mainFlow:
      - O membro escolhe encerrar — pelo botão, ou movendo para a última coluna, conforme o projeto.
      - Escolhe o desfecho.
      - Escreve o motivo.
      - O sistema grava o encerramento.
      - Passada a espera do projeto, o encerramento aparece na página de acompanhamento.
    alternativeFlows:
      - title: 3a. O motivo fica em branco
        steps:
          - O sistema não encerra e pede o motivo.
      - title: 5a. O membro tira o relato da última coluna antes de quem relatou confirmar
        steps:
          - O encerramento é cancelado, e o histórico registra o cancelamento — que não é uma reabertura.
    postconditions: Quem relatou pode confirmar que resolveu, ou reabrir — ver 06-tracking.
  - id: UC07
    name: Ver os arquivos do relato
    description: O relato como quem relatou montou — a imagem logo abaixo do texto, no tamanho escolhido —, e os arquivos para baixar.
    width: 240
    position: { x: 600, y: 125 }
    mainFlow:
      - O membro abre o relato, e o sistema confere que ele pode ver aquele relato antes de gerar os links de leitura, de validade curta.
      - Cada imagem aparece no lugar de onde veio — embaixo do relato, da resposta ou da reabertura —, no tamanho e na ordem que quem relatou escolheu, com o nome original e o tamanho. Um clique abre em tamanho real, em outra aba.
      - Cada arquivo aparece como uma linha para baixar, com o nome original e o aviso de abrir só o que se esperava receber. Baixar nunca abre o arquivo na página.
      - Os vídeos antigos continuam tocando.
    alternativeFlows:
      - title: 2a. O link venceu
        steps:
          - O painel pede links novos antes de vencer, e de novo quando um arquivo falha — em vez de quebrar em silêncio.
      - title: 2b. Um arquivo não carregou
        steps:
          - O lugar dele diz que não carregou, com "Tentar de novo".
      - title: 2c. A fala ou a reabertura do arquivo não está na tela
        steps:
          - O arquivo aparece embaixo do relato, depois dos da criação, dizendo de onde veio — em vez de sumir.
  - id: UC08
    name: Encerrar sem retorno
    description: Quando o segundo prazo do pedido de informação vence sem resposta, o relato encerra sozinho como “sem retorno”.
    width: 240
    position: { x: 600, y: 375 }
    preconditions: Há um pedido de informação aberto, e a vez é de quem relatou.
    mainFlow:
      - Passado o primeiro prazo, a página de acompanhamento muda de tom e avisa que o relato vai encerrar.
      - No segundo prazo, o agendador chega e confere o relato.
      - Se a vez ainda é de quem relatou, o sistema encerra como “sem retorno”, com a origem marcada como sistema, e não como time.
    alternativeFlows:
      - title: 3a. Quem relatou respondeu antes
        steps:
          - A mensagem encontra o pedido já respondido e se descarta.
    postconditions: O relato encerrado assim continua reabrível — quem sumiu por 14 dias pode voltar no dia 30.
  - id: UC09
    name: Levar a mudança para a etapa pública
    description: "O motor de tradução lê o mapa e decide o que quem relatou vê: a etapa anda, fica onde está, ou o estado não tem etapa e o dono é avisado."
    width: 240
    position: { x: 600, y: 500 }
    mainFlow:
      - O sistema recebe o estado novo, o mapa do projeto e a etapa pública atual.
      - Decide a etapa pública — sem nunca voltar, a não ser para uma etapa que permite retorno.
      - Sem espera, a etapa pública muda na hora.
      - Com espera, o agendador volta no fim dela, olha o estado de agora e só então publica.
    alternativeFlows:
      - title: 2a. O estado não tem etapa no mapa
        steps:
          - A etapa pública fica onde estava, o evento é gravado como não mapeado, e o dono é avisado.
      - title: 2b. Os dois estados caem na mesma etapa
        steps:
          - A página de acompanhamento não muda — porque não deve.
      - title: 4a. O relato voltou antes do fim da espera
        steps:
          - O agendador encontra o estado novo e descarta a mudança antiga. Nada é cancelado, e nada vaza.
  - id: UC10
    name: Apagar a mídia vencida
    description: Adiado. Quando o prazo de guarda que o projeto escolheu vence, o arquivo sai do armazenamento.
    width: 230
    position: { x: 600, y: 660 }
    preconditions: O projeto definiu um prazo de guarda, e ele venceu para algum arquivo.
    mainFlow:
      - O agendador olha o arquivo no momento em que o prazo vence.
      - Confere o estado atual — o prazo pode ter mudado depois do agendamento.
      - Apaga o arquivo do armazenamento e registra.
  - id: UC11
    name: Criar o card do time
    description: O trabalho que não veio de fora. Título, descrição em Markdown e a coluna em que nasce; ganha o número seguinte do projeto e nunca tem lado de fora.
    width: 220
    position: { x: 600, y: 0 }
    preconditions: O membro está na tela de Trabalho, e o projeto não está arquivado.
    mainFlow:
      - O membro escolhe Novo card.
      - Escreve o título e, se quiser, a descrição — a barra escreve as marcas, e Visualizar mostra como fica.
      - Escolhe a coluna, ou fica com a primeira.
      - O sistema dá o próximo número do projeto e grava o card.
    alternativeFlows:
      - title: 2a. O título fica em branco
        steps:
          - O painel não cria, e pede o título.
      - title: 1a. O membro cria pela coluna, no quadro
        steps:
          - Escolhe Criar, no pé de uma coluna que recebe card, e o formulário abre com ela já escolhida.
      - title: 4a. O card é movido para a última coluna
        steps:
          - Não há desfecho nem motivo a pedir — ninguém de fora vai ler —, e a etapa pública não se mexe.
    postconditions: O card aparece no topo da tela de Trabalho, e não aparece em lugar nenhum do lado de fora.
  - id: UC12
    name: Arquivar
    description: Tira o card da tela de Trabalho. O card do time sempre; o relato só com a regra do ciclo ligada, e o relato aberto encerra junto, com o motivo que quem relatou lê.
    width: 220
    position: { x: 600, y: 820 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe arquivar.
      - Num relato aberto, escolhe o desfecho e escreve o motivo; no card do time ou no relato já encerrado, só confirma.
      - O sistema arquiva — e encerra junto o relato aberto.
      - O card sai da tela de Trabalho e aparece em Arquivados, para ler, comentar ou desarquivar.
    alternativeFlows:
      - title: 1a. O projeto não arquiva relato
        steps:
          - O painel não oferece arquivar o relato; o caminho continua sendo encerrar.
      - title: 4a. Quem relatou reabre, ou responde a uma pergunta que estava aberta
        steps:
          - O relato volta sozinho para a tela de Trabalho. No histórico, o desarquivar aparece sem nome de ninguém do time, junto da reabertura ou da resposta de quem relatou.
    postconditions: Quem relatou lê o motivo pelo link, e pode reabrir ou finalizar, com a nota.
  - id: UC13
    name: Dar título ao relato
    description: O time reescreve o título que o relato traz, para reconhecer o card de cara. O que quem relatou escreveu fica guardado, e é o único título que volta para ela.
    width: 220
    position: { x: 260, y: 1000 }
    preconditions: O relato está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe reescrever o título.
      - Escreve o título do time, numa linha.
      - O sistema guarda o título do time ao lado do que quem relatou escreveu.
      - O card passa a mostrar o título do time, com o de quem relatou logo embaixo.
    alternativeFlows:
      - title: 2a. O membro quer voltar ao título de quem relatou
        steps:
          - Escolhe voltar ao de quem relatou, e o card volta a mostrá-lo.
    postconditions: Quem relatou continua vendo só o título que escreveu, no acompanhamento e na lista pessoal.
  - id: UC14
    name: Escolher o responsável
    description: Diz quem do time está com o card — um só, para nunca ficar a dúvida.
    width: 220
    position: { x: 260, y: 1160 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe alguém do time como responsável, ou ninguém.
      - O sistema guarda e conta a mudança no histórico.
    alternativeFlows:
      - title: 1a. O responsável saiu do time
        steps:
          - O card continua com ele, como registro, marcado como fora do time — e só alguém do time pode ser escolhido no lugar.
    postconditions: A linha do card na tela de Trabalho mostra quem está com ele.
  - id: UC15
    name: Priorizar o card
    description: Diz o quanto o card importa, com as prioridades do projeto. O card nasce sem prioridade.
    width: 220
    position: { x: 600, y: 1000 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe uma das prioridades do projeto, ou nenhuma.
      - O sistema guarda e conta a mudança no histórico, com o nome da prioridade.
    alternativeFlows:
      - title: 1a. A prioridade do card foi aposentada
        steps:
          - Ela continua no card, marcada, e não é oferecida para outro.
    postconditions: A linha do card mostra a prioridade, na cor dela e com o nome escrito.
  - id: UC16
    name: Etiquetar o card
    description: Põe e tira etiquetas do projeto no card. A etiqueta que falta, o próprio membro cria.
    width: 220
    position: { x: 260, y: 1320 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escreve o nome de uma etiqueta.
      - Escolhe uma das etiquetas do projeto que aparecem.
      - O sistema põe a etiqueta no card e conta no histórico.
    alternativeFlows:
      - title: 2a. A etiqueta não existe
        steps:
          - O membro escolhe criá-la, e ela entra no card já criada, com uma cor da paleta.
      - title: 2b. O membro tira uma etiqueta
        steps:
          - A etiqueta sai do card, e o histórico conta.
    postconditions: O card leva até dez etiquetas; a linha da lista mostra a primeira e quantas mais há, e a frente no quadro, até três.
  - id: UC17
    name: Dar prazo ao card
    description: Diz para quando o card precisa estar pronto — só a data.
    width: 220
    position: { x: 600, y: 1160 }
    preconditions: O card está aberto no painel, e não está arquivado.
    mainFlow:
      - O membro escolhe a data do prazo, ou tira o prazo.
      - O sistema guarda e conta a mudança no histórico.
    postconditions: A linha do card e o quadro mostram o prazo com o destaque — vermelho quando venceu, amarelo quando está perto, sempre com as palavras.
  - id: UC18
    name: Arrumar o quadro
    description: Muda o card de lugar no quadro, arrastando com o mouse, o toque ou o teclado — dentro da coluna, na ordem que o time inteiro vê, ou para outra coluna.
    width: 220
    position: { x: 600, y: 1320 }
    preconditions: O membro está na tela de Trabalho, no quadro, e o card não está arquivado.
    mainFlow:
      - O membro pega um card — o mouse depois de andar um pouco, o toque depois de segurar um instante, o teclado com espaço.
      - Solta o card entre dois outros, na mesma coluna.
      - O sistema guarda o lugar novo, e todo o time passa a ver o card ali.
    alternativeFlows:
      - title: 2a. O membro solta o card em outra coluna
        steps:
          - O card muda de estado (UC05), já no lugar em que foi solto.
      - title: 2b. É um relato aberto, solto na coluna que encerra
        steps:
          - O painel pede o desfecho e o motivo antes de mover — ver UC06. Desistir devolve o card ao lugar.
      - title: 2c. O card é solto fora das colunas que recebem
        steps:
          - No cabeçalho da página, em "Sem coluna" ou na coluna aposentada ninguém solta card. O card volta ao lugar, e nada muda.
      - title: 2d. Outra pessoa do time muda o quadro enquanto ele está aberto
        steps:
          - O card movido, criado ou editado por ela aparece na tela sem recarregar, aceso por um instante — e, se o membro estiver arrastando, a tela espera ele soltar. O card com o foco que ela move leva o foco junto.
      - title: 3a. O card de cima, ou o próprio card, já saiu da coluna
        steps:
          - Outra pessoa o moveu ou arquivou. O sistema recusa o lugar, porque ele já não existe; o painel diz que foi outra pessoa, lê o quadro de novo e mostra o card onde ele está.
      - title: 3b. Outra pessoa solta na mesma coluna ao mesmo tempo
        steps:
          - Um espera o outro, e cada card ganha um lugar só dele.
    postconditions: "O que chega a uma coluna sem ser arrastado — o relato novo, o card novo, o movido pelo card aberto, o reaberto por quem relatou (mude de coluna ou não) e o que ela tira do arquivo ao responder — entra no topo."
