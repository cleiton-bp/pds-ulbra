notes:
  - text: "Comentário interno e comentário público são campos separados, e não uma marcação: o interno não tem caminho nenhum até a página pública."
    anchor: UC03
    position: { x: 1124, y: 251 }
  - text: A espera é a janela para desfazer. Quem move por engano move de volta, e a pessoa lá fora nunca vê o vaivém.
    anchor: UC06
    position: { x: 287, y: 858 }
  - text: Arquivar nunca deixa quem relatou sem retorno. O relato aberto só sai da tela com um motivo — e volta sozinho se a pessoa escrever de novo.
    anchor: UC12
    position: { x: 900, y: 860 }
  - text: Tudo o que o time dá ao card é interno. Quem relatou continua vendo o que escreveu — e só o próprio título.
    anchor: UC13
    position: { x: -180, y: 900 }
  - text: Arrumar o quadro não conta no histórico. A ordem é do time inteiro, mas a história do card é o que mudou nele — e não o lugar dele na fila.
    anchor: UC18
    position: { x: 900, y: 1320 }
  - text: Três relatos do mesmo problema, um trabalho só, e três pessoas com retorno. O duplicado segue o original, mas a resposta de cada pessoa — confirmar, avaliar, reabrir — continua sendo dela.
    anchor: UC21
    position: { x: 900, y: 1640 }
  - text: A sprint é um recorte do backlog, e não outro lugar. O card continua o mesmo — o número, a coluna, a história —; a sprint só diz quando o time quer fazê-lo.
    anchor: UC23
    position: { x: 600, y: 1800 }
