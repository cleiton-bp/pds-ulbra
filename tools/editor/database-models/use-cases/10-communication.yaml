notes:
  - text: "Publicar na fila dentro da transação seria escrever em dois lugares que podem discordar. A fila lê o que já foi gravado: a tabela de eventos nasce no momento certo, e o evento de mudança de etapa já é o gatilho."
    anchor: UC05
    position: { x: 840, y: 40 }
  - text: "Em aberto: quando a identidade vem do sistema do cliente e não há e-mail, como avisar quem relatou. Depende da identidade herdada."
    anchor: UC01
    position: { x: 498, y: -281 }
