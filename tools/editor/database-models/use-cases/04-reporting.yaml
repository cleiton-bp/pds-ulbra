meta:
  title: O relato entra
  system: PDS — ferramenta de relato
  description: "O que quem relata faz dentro da ferramenta, na página onde o problema apareceu: escolher o tipo e responder ao que ele pergunta, anexar imagens e arquivos, capturar uma área da página, marcar a imagem e reencontrar os próprios relatos. O que acontece depois de enviar está em 05-team-work e 06-tracking."
actors:
  - name: Relator
    description: Quem encontrou o problema. Está fora da empresa, não tem conta e não instala nada.
    position: { x: 40, y: 306 }
  - name: Armazenamento de arquivos
    kind: system
    description: Guarda as imagens e os arquivos (e os vídeos antigos), privado. Os bytes vão direto da ferramenta para ele, sem passar pela API, e nada é servido sem um link assinado de validade curta.
    position: { x: 950, y: 151 }
  - name: Sistema do cliente
    kind: system
    description: O servidor do site do cliente. Na identidade herdada, é ele que diz quem é a pessoa, assinando o crachá com a chave privada dele — o projeto guarda só a pública.
    position: { x: 950, y: 640 }
useCases:
  - id: UC01
    name: Abrir relato
    description: Quem encontrou o problema escolhe o tipo, responde ao que ele pergunta e recebe um protocolo e um link para acompanhar.
    width: 220
    position: { x: 260, y: 140 }
    preconditions: A ferramenta está no site, o projeto não está arquivado, e a página não está num domínio que o projeto bloqueou.
    mainFlow:
      - O relator abre a ferramenta pelo botão, na página onde encontrou o problema.
      - Escolhe o tipo, entre os do projeto, quando o projeto deixa escolher; senão, o relato entra com o tipo pré-marcado.
      - Responde, em poucas palavras, o que aconteceu — a resposta vira o título do card para o time, e é o título que o relator vê depois.
      - Responde às perguntas do tipo — cada uma num campo de uma linha, todas opcionais — e/ou escreve na caixa livre, que traz dentro o texto do tipo.
      - Marca se aceita responder dúvidas do time; a caixa já vem como o projeto definiu.
      - Envia o relato.
      - O sistema grava o relato, com as respostas e as perguntas como estavam, o texto inteiro e a rota da página — só o caminho, sem a parte depois do “?” —, na coluna de entrada do tipo dele, ou na primeira coluna ativa, e pendente de moderação.
      - A ferramenta mostra o protocolo e o link de acompanhamento.
    alternativeFlows:
      - title: 1a. O projeto é público
        steps:
          - Antes de o relator escrever, a ferramenta avisa que o relato poderá ser lido por outras pessoas depois de o time liberar.
          - Segue no passo 2.
      - title: 3a. O projeto torna a pergunta obrigatória
        steps:
          - A ferramenta não envia sem o título.
      - title: 3b. O projeto esconde a pergunta
        steps:
          - A ferramenta não pergunta; no painel, o card mostra o começo do texto no lugar do título.
          - Segue no passo 4.
      - title: 4a. Nada preenchido
        steps:
          - Sem nenhuma resposta e sem texto na caixa, a ferramenta não envia, e pede ao menos uma resposta — ou o texto. A pergunta pulada não vai para o relato.
          - O relator volta ao passo 4.
      - title: 6a. O tipo mudou ou foi desativado depois de a ferramenta abrir
        steps:
          - O sistema recusa o relato, e nada é gravado. A ferramenta diz o que fazer — fechar e abrir de novo, quando as perguntas do tipo mudaram; escolher outro tipo, quando ele foi desativado —, porque casar cada resposta com a pergunta errada estragaria o relato sem ninguém ver.
      - title: 6b. O relator passou de um limite do projeto
        steps:
          - A ferramenta mostra “Conferindo…” por um ou dois segundos — o navegador resolve uma conta que o sistema pede — e envia sozinha. Nada muda para quem relata além da espera.
      - title: 6c. O relator mandou outro relato há poucos segundos, ou passou do dobro de um limite
        steps:
          - O sistema recusa, e nada é gravado. A ferramenta diz quanto esperar — alguns segundos, no intervalo mínimo; o fim da pausa, no dobro — e mantém o que foi escrito.
          - No dobro, quem administra o projeto recebe um aviso no sino, uma vez por pausa.
      - title: 7b. A página está num domínio que o projeto ainda não autorizou
        steps:
          - O sistema recebe o relato do mesmo jeito — o relator ganha o protocolo e o link de acompanhamento —, mas o retém fora do Trabalho, em “Aguardando liberação”, até o time permitir o domínio (02-project-setup, UC05).
          - Se o time bloquear o domínio, o relato retido é apagado de vez, e o link de acompanhamento deixa de abrir.
      - title: 7a. O projeto identifica por código pessoal
        steps:
          - O sistema liga o relato ao código guardado neste navegador — ou sorteia um código novo, se não houver nenhum.
          - A confirmação mostra o código, para o relator guardar.
    postconditions: O relato está no painel do time — quando o tipo pergunta, com cada resposta debaixo da sua pergunta; vindo de um domínio ainda não autorizado, em “Aguardando liberação” —, e quem relatou já o vê na primeira etapa pública.
  - id: UC02
    name: Anexar imagens e arquivos
    description: Escolhe imagens — ou cola um print — e, quando o projeto aceita, arquivos. A imagem fica logo abaixo do texto, no tamanho que o relator escolhe; o arquivo, numa lista embaixo dela. Dá para remover antes de enviar.
    width: 230
    position: { x: 600, y: 140 }
    preconditions: O projeto aceita anexo, e a categoria — imagem ou arquivo — está ligada.
    mainFlow:
      - O relator escolhe imagens (PNG, JPEG ou WebP) ou cola um print; ou escolhe um arquivo dos formatos que o projeto marcou, reconhecido pela extensão.
      - A imagem aparece logo abaixo do texto, no tamanho escolhido — um terço, metade, três quartos ou a linha inteira —, na ordem em que o relator monta. O arquivo aparece numa linha com o tipo e o tamanho.
      - Ao enviar o relato, o texto é gravado primeiro, e a ferramenta pede ao sistema permissão para cada arquivo.
      - O sistema confere, em cada categoria, quantidade e tamanho contra os limites do projeto, e devolve um endereço de envio de validade curta.
      - A ferramenta manda o arquivo direto ao armazenamento, mostrando o progresso.
      - O sistema confere os primeiros bytes do arquivo e o prende ao relato, com o tamanho de exibição e a posição.
    alternativeFlows:
      - title: 1a. Não cabe mais nada daquela categoria
        steps:
          - O botão daquela categoria desliga, e a ferramenta diz o limite.
      - title: 4a. O arquivo passa de um limite do projeto, ou não é do tipo que diz ser
        steps:
          - O arquivo fica como "não enviado", com o motivo, e sem "Tentar de novo" — mandar de novo levaria a mesma resposta.
      - title: 5a. O envio do arquivo falha
        steps:
          - O relato continua valendo, com o texto inteiro — o texto é a parte valiosa.
          - O relator pode tentar de novo, e a tentativa volta ao mesmo lugar na montagem; ou desistir daquele arquivo.
    postconditions: "O arquivo pertence ao relato e só é servido por link assinado, a quem pode ver aquele relato. A imagem aparece como o relator montou; o arquivo é sempre baixado, e nunca aberto na página."
  - id: UC03
    name: Capturar uma área da página
    description: A ferramenta some, e o relator arrasta sobre a página onde o problema apareceu. A área vira imagem ali mesmo — sem o navegador perguntar nada —, e o editor abre com ela.
    width: 230
    position: { x: 600, y: 300 }
    preconditions: O projeto liga a captura e aceita imagem, e a página deixa o carregador capturar.
    mainFlow:
      - O relator escolhe capturar.
      - A ferramenta some, e o carregador — o script do PDS na página do cliente — mostra a página por inteiro para o relator arrastar.
      - O relator arrasta sobre a área que importa, ou escolhe a tela inteira.
      - O carregador redesenha a área como imagem, no formato mais leve que o navegador sabe gravar. A própria ferramenta nunca aparece na imagem.
      - A ferramenta volta, e o editor abre com a imagem, como em UC08.
      - A imagem segue como em UC02.
    alternativeFlows:
      - title: 1a. A página não deixa capturar
        steps:
          - O botão de capturar não aparece, e anexar continua funcionando — sem mensagem de erro técnico.
      - title: 3a. O relator desiste
        steps:
          - Esc ou "Cancelar" volta à ferramenta, e nada é anexado.
    postconditions: A captura não esconde nada sozinha — senha, cartão ou o que mais estiver na área. Quem esconde é o relator, no editor.
  - id: UC08
    name: Marcar a imagem
    description: Antes de enviar, o relator aponta o que importa e esconde o que não quer mostrar — na captura e em qualquer imagem da lista.
    width: 220
    position: { x: 260, y: 300 }
    preconditions: A imagem está na lista, ainda não enviada.
    mainFlow:
      - O editor abre sozinho depois da captura; as outras imagens abrem pelo "Editar".
      - O relator marca com seta, retângulo, elipse, desenho livre, marca-texto, texto e marcadores numerados, em cores; e desfoca, oculta ou recorta.
      - Desfaz e refaz o que quiser.
      - Adiciona, e a imagem marcada toma o lugar da original na lista.
    alternativeFlows:
      - title: 4a. O relator descarta
        steps:
          - A imagem continua como estava.
    postconditions: O que foi ocultado não existe no arquivo enviado nem na miniatura. A original fica só no navegador, para reabrir com as marcas editáveis.
  - id: UC04
    name: Informar o nome
    description: Sempre opcional, e interno por padrão. O nome só aparece para o público se o projeto for público identificado e o relator marcar que quer assinar.
    width: 230
    position: { x: 600, y: 0 }
    preconditions: O projeto pergunta o nome.
    mainFlow:
      - O relator escreve o nome no campo.
      - Em projeto público identificado, marca se quer assinar o relato — a caixa nasce desmarcada.
    postconditions: O time vê o nome no painel. O público só vê se as duas condições valerem juntas.
  - id: UC05
    name: Ver os meus relatos
    description: Dentro da própria ferramenta, a lista de tudo o que foi relatado com o mesmo código pessoal. Cada item abre a página de acompanhamento numa janela nova.
    width: 220
    position: { x: 260, y: 460 }
    preconditions: O projeto identifica quem relata por código pessoal, e este navegador tem um código guardado.
    mainFlow:
      - O relator abre “os meus relatos” na ferramenta.
      - O sistema devolve os relatos daquele código.
      - O relator escolhe um, e a página de acompanhamento abre numa janela nova.
    alternativeFlows:
      - title: 2a. O código tem mais de 50 relatos
        steps:
          - A lista mostra 50 e avisa que há mais — sem dizer quantos.
    postconditions: "Pela lista, o relator só lê — o relato e o que veio anexado: confirmar, reabrir, responder e anexar continuam pedindo o link do relato."
  - id: UC06
    name: Reencontrar os relatos pelo código
    description: Em outro navegador ou aparelho, digita o código que guardou, e a lista volta.
    width: 230
    position: { x: 600, y: 460 }
    mainFlow:
      - O relator digita o código na lista.
      - O sistema devolve os relatos daquele código.
      - A ferramenta guarda o código neste navegador.
    alternativeFlows:
      - title: 2a. O código está errado
        steps:
          - A lista vem vazia, igual à de um código sem relato — o sistema nunca diz se um código existe.
  - id: UC07
    name: Relatar já identificado pelo site
    description: "Quando o site do cliente tem login, a identidade vem de lá: o servidor dele assina um crachá curto e o põe no script da ferramenta, e quem relata não digita código nenhum — e vê os próprios relatos na lista, sem guardar nada."
    width: 230
    position: { x: 260, y: 620 }
    preconditions: O projeto usa a identidade do sistema do cliente, com a chave pública dele colada em Quem relata, e a pessoa está na conta no site — o servidor do cliente pôs o crachá no script da ferramenta.
    mainFlow:
      - Ao montar a página, o servidor do cliente assina quem é a pessoa num crachá curto — dedicado a relatar, com validade de poucos minutos (até o teto do projeto, 15 de fábrica) e nunca o login dela — e o coloca no script da ferramenta, ao lado da chave do projeto.
      - O relator abre a ferramenta. O carregador lê o crachá da página a cada abertura e o entrega ao quadro, sem passá-lo pela URL.
      - O relator relata como em UC01, sem digitar código nenhum; quando o projeto pergunta o nome, o campo já vem com o nome que o crachá sugere, e a pessoa troca se quiser.
      - A ferramenta envia o crachá junto do relato. O sistema confere a assinatura com a chave pública do projeto — sem chamar o sistema do cliente — e liga o relato à pessoa; a linha dela nasce no primeiro relato, e dela fica só um hash.
      - A confirmação diz que o relato ficou ligado à pessoa, e que ele aparece em “Ver os meus relatos” sempre que ela estiver na conta neste site.
      - "“Ver os meus relatos” aparece sem pedir código, e a lista carrega sozinha, com o teto e o “há mais” de UC05."
      - O relator escolhe um, e a página de acompanhamento abre numa janela nova, com o crachá no fragmento do endereço — que o navegador não manda ao servidor. Pela lista ela só lê, o relato e o que veio anexado; confirmar, reabrir, responder e anexar continuam pedindo o link do relato.
    alternativeFlows:
      - title: 1a. A pessoa não está na conta, e o projeto não exige o crachá
        steps:
          - O script fica sem o crachá, e o relato entra como protocolo, sem identidade. A confirmação avisa que não deu para reconhecer a pessoa pelo site e que o link é a única forma de voltar; “Ver os meus relatos” não aparece.
      - title: 1b. A pessoa não está na conta, e o projeto exige o crachá
        steps:
          - Antes de a pessoa escrever, no lugar do formulário, a ferramenta pede para entrar na conta neste site e abrir o formulário de novo. Direto na rota, o sistema recusa o relato — “Entre na sua conta para relatar.” — e nada é gravado.
      - title: 4a. O crachá venceu ou não confere
        steps:
          - Assinatura errada, crachá vencido ou de outro projeto, validade maior que a que o projeto permite — o sistema não reconhece a pessoa, e nunca diz qual foi o engano.
          - Sem a exigência, o relato entra como protocolo, como em 1a. Com ela, o sistema recusa — “Identidade nao reconhecida. Recarregue a pagina e tente de novo.” — e nada é gravado.
      - title: 4b. O projeto não usa a identidade do sistema do cliente
        steps:
          - "O crachá é ignorado, e não recusado como o código pessoal é: o atributo pode ter ficado na página depois de o projeto trocar de modo, e recusar derrubaria todo relato daquele site por uma configuração antiga. O relato entra como o modo do projeto manda."
      - title: 6a. O crachá não confere na lista
        steps:
          - A lista vem vazia, igual à de quem nunca relatou — o sistema nunca diz se o projeto usa o modo nem se a pessoa existe.
    postconditions: "O relato está ligado à pessoa do site, e o sistema guarda dela só um hash — nem nome, nem e-mail, nem o identificador do sistema do cliente. Com identidade, existe “o meu relato”: a lista pessoal mostra os relatos dessa pessoa, sem ela guardar nada."
