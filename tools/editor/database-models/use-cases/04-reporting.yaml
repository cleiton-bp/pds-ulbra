  - from: Relator
    to: UC07
    kind: association
  - from: Sistema do cliente
    to: UC07
    kind: association
notes:
  - text: A ferramenta roda num iframe do PDS. A página do cliente carrega só o script e o botão, e não enxerga o que o relator escreve.
    anchor: UC01
    position: { x: -77, y: 5 }
  - text: Perder o código custa a lista, não os relatos — cada um continua alcançável pelo próprio link.
    anchor: UC06
    position: { x: 950, y: 470 }
  - text: "Adiado por decisão: a assinatura pedia HMAC com a chave secreta, e o banco guarda só o hash dela. A saída é assimétrica, e o desenho dela já está feito. A decidir: o que guardar da identidade — id, nome, e-mail."
    anchor: UC07
    position: { x: 438, y: 784 }
