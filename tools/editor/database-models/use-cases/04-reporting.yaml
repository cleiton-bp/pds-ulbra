notes:
  - text: A ferramenta roda num iframe do PDS. A página do cliente carrega só o script e o botão, e não enxerga o que o relator escreve. É o script — o carregador — que faz a captura da área, porque só ele está na página.
    anchor: UC01
    position: { x: -77, y: 5 }
  - text: Perder o código custa a lista, não os relatos — cada um continua alcançável pelo próprio link.
    anchor: UC06
    position: { x: 950, y: 470 }
  - text: "Assimétrica de propósito: o cliente guarda a chave privada, e o projeto só a pública — a API confere a assinatura, nunca chama o sistema dele, e um vazamento do nosso banco não permite forjar identidade nenhuma. Assinar com a chave secreta do projeto era inviável, porque o banco guarda só o hash dela. Da pessoa fica só o hash do identificador, com um sal do projeto: nem nome, nem e-mail."
    anchor: UC07
    position: { x: 438, y: 784 }
