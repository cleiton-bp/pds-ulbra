meta:
  title: O relato entra
  system: PDS — ferramenta de relato
  description: "O que quem relata faz dentro da ferramenta, na página onde o problema apareceu: escrever, anexar, capturar a tela e reencontrar os próprios relatos. O que acontece depois de enviar está em 05-team-work e 06-tracking."
actors:
  - name: Relator
    description: Quem encontrou o problema. Está fora da empresa, não tem conta e não instala nada.
    position: { x: 40, y: 306 }
  - name: Armazenamento de arquivos
    kind: system
    description: Guarda os prints e os vídeos, privado. Os bytes vão direto da ferramenta para ele, sem passar pela API, e nada é servido sem um link assinado de validade curta.
    position: { x: 950, y: 151 }
  - name: Sistema do cliente
    kind: system
    description: O servidor do site do cliente. Na identidade herdada, é ele que diz quem é a pessoa, assinando com a chave secreta.
    position: { x: 950, y: 640 }
useCases:
  - id: UC01
    name: Abrir relato
    description: Quem encontrou o problema descreve o que aconteceu e recebe um protocolo e um link para acompanhar.
    width: 220
    position: { x: 260, y: 140 }
    preconditions: A ferramenta está no site, o projeto não está arquivado, e a página está num domínio que o projeto permite — ou a lista de domínios está vazia.
    mainFlow:
      - O relator abre a ferramenta pelo botão, na página onde encontrou o problema.
      - Escolhe o tipo — defeito, melhoria ou dúvida —, quando o projeto deixa escolher.
      - Descreve o que aconteceu.
      - Marca se aceita responder dúvidas do time; a caixa já vem como o projeto definiu.
      - Envia o relato.
      - O sistema grava o relato com a rota da página — só o caminho, sem a parte depois do “?” —, no estado de entrada do tipo dele, e pendente de moderação.
      - A ferramenta mostra o protocolo e o link de acompanhamento.
    alternativeFlows:
      - title: 1a. O projeto é público
        steps:
          - Antes de o relator escrever, a ferramenta avisa que o relato poderá ser lido por outras pessoas depois de o time liberar.
          - Segue no passo 2.
      - title: 3a. A descrição fica em branco
        steps:
          - A ferramenta não envia e pede a descrição.
          - O relator volta ao passo 3.
      - title: 6a. O projeto identifica por código pessoal
        steps:
          - O sistema liga o relato ao código guardado neste navegador — ou sorteia um código novo, se não houver nenhum.
          - A confirmação mostra o código, para o relator guardar.
    postconditions: O relato está no painel do time, e quem relatou já o vê na primeira etapa pública.
  - id: UC02
    name: Anexar print ou vídeo
    description: Escolhe um arquivo ou cola um print da área de transferência, vê a miniatura e pode remover antes de enviar.
    width: 230
    position: { x: 600, y: 140 }
    preconditions: O projeto aceita anexo, e o tipo do arquivo está entre os que ele aceita.
    mainFlow:
      - O relator escolhe um arquivo ou cola um print.
      - A ferramenta mostra a miniatura, feita no próprio navegador.
      - Ao enviar o relato, a ferramenta pede ao sistema permissão para cada arquivo.
      - O sistema confere quantidade, tipo e tamanho contra os limites do projeto e devolve um endereço de envio de validade curta.
      - A ferramenta manda o arquivo direto ao armazenamento, mostrando o progresso.
      - O sistema confere os primeiros bytes do arquivo e o prende ao relato.
    alternativeFlows:
      - title: 4a. O arquivo passa de um limite do projeto
        steps:
          - O sistema recusa aquele arquivo e diz qual limite.
      - title: 5a. O envio do arquivo falha
        steps:
          - O relato continua valendo, com o texto inteiro — o texto é a parte valiosa.
          - O relator pode tentar de novo, e a tentativa começa com permissão nova.
    postconditions: O arquivo pertence ao relato e só é servido por link assinado, a quem pode ver aquele relato.
  - id: UC03
    name: Capturar a tela
    description: O navegador pergunta qual tela, janela ou aba mostrar. Dali sai um print, que o relator recorta, ou um vídeo curto.
    width: 230
    position: { x: 600, y: 300 }
    preconditions: O projeto liga a captura, e o navegador permite — no iPhone e no iPad não existe.
    mainFlow:
      - O relator escolhe capturar a tela.
      - O navegador pergunta o que compartilhar, e o relator escolhe.
      - Para um print, a ferramenta congela o quadro e o relator recorta o pedaço que importa.
      - Para um vídeo, a ferramenta grava até a duração máxima do projeto, em qualidade baixa de propósito.
      - A captura vira um anexo, e segue como em UC02.
    alternativeFlows:
      - title: 1a. O navegador ou o site não deixam capturar
        steps:
          - O botão de capturar não aparece, e anexar arquivo continua funcionando — sem mensagem de erro técnico.
      - title: 2a. O relator desiste na pergunta do navegador
        steps:
          - Nada é anexado, e o relato continua como estava.
  - id: UC04
    name: Informar o nome
    description: Sempre opcional, e interno por padrão. O nome só aparece para o público se o projeto for público identificado e o relator marcar que quer assinar.
    width: 230
    position: { x: 600, y: 0 }
    preconditions: O projeto pergunta o nome.
    mainFlow:
      - O relator escreve o nome no campo.
      - Em projeto público identificado, marca se quer assinar o relato — a caixa nasce desmarcada.
    postconditions: O time vê o nome no painel. O público só vê se as duas condições valerem juntas.
  - id: UC05
    name: Ver os meus relatos
    description: Dentro da própria ferramenta, a lista de tudo o que foi relatado com o mesmo código pessoal. Cada item abre a página de acompanhamento numa janela nova.
    width: 220
    position: { x: 260, y: 460 }
    preconditions: O projeto identifica quem relata por código pessoal, e este navegador tem um código guardado.
    mainFlow:
      - O relator abre “os meus relatos” na ferramenta.
      - O sistema devolve os relatos daquele código.
      - O relator escolhe um, e a página de acompanhamento abre numa janela nova.
    alternativeFlows:
      - title: 2a. O código tem mais de 50 relatos
        steps:
          - A lista mostra 50 e avisa que há mais — sem dizer quantos.
    postconditions: "Pela lista, o relator só lê: confirmar, reabrir e responder continuam pedindo o link do relato."
  - id: UC06
    name: Reencontrar os relatos pelo código
    description: Em outro navegador ou aparelho, digita o código que guardou, e a lista volta.
    width: 230
    position: { x: 600, y: 460 }
    mainFlow:
      - O relator digita o código na lista.
      - O sistema devolve os relatos daquele código.
      - A ferramenta guarda o código neste navegador.
    alternativeFlows:
      - title: 2a. O código está errado
        steps:
          - A lista vem vazia, igual à de um código sem relato — o sistema nunca diz se um código existe.
  - id: UC07
    name: Relatar já identificado pelo site
    description: "Adiado. Quando o site do cliente tem login, a identidade vem de lá: quem relata não digita nome nem guarda código, e vê os próprios relatos na lista."
    width: 230
    position: { x: 260, y: 620 }
    preconditions: O projeto usa identidade herdada, e a pessoa está logada no site do cliente.
    mainFlow:
      - O relator abre a ferramenta no site do cliente.
      - O sistema do cliente entrega a identidade da pessoa, assinada.
      - O PDS confere a assinatura e liga o relato a essa identidade.
      - O relator relata como sempre.
    alternativeFlows:
      - title: 3a. A assinatura não confere
        steps:
          - A identidade é recusada. Aceitar um identificador vindo do navegador deixaria qualquer pessoa se passar por outra e ver relatos alheios.
    postconditions: "Com identidade, existe “o meu relato”: a lista pessoal mostra os relatos dessa pessoa."
links:
  - from: Relator
    to: UC01
    kind: association
  - from: UC02
    to: UC01
    kind: extend
