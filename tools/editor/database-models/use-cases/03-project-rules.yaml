notes:
  - text: "De cima para baixo é a ordem em que faz sentido configurar: sem colunas e etapas não há o que ligar, e o ciclo usa os dois. Mas nada aqui é obrigatório: o projeto novo já nasce com as três colunas, o andamento e o mapa entre eles."
    position: { x: 590, y: 10 }
  - text: O motor não anda para trás sozinho. Regressão interna não vira regressão pública, a não ser para uma etapa que permite retorno — e o retrocesso continua gravado por dentro.
    anchor: UC03
    position: { x: 590, y: 225 }
  - text: Com código pessoal, quem relata ganha um código sorteado que reencontra todos os seus relatos. Perder o código custa a lista, não os relatos.
    anchor: UC05
    position: { x: 590, y: 490 }
  - text: "A decidir, junto com a retenção: o prazo, o teto e a cobrança. Por enquanto, nada é apagado por prazo — apagar um print no meio de um relato aberto seria a falha mais constrangedora possível."
    anchor: UC07
    position: { x: 590, y: 760 }
