meta:
  title: O relator acompanha
  system: PDS — página de acompanhamento
  description: "O que quem relatou faz depois de enviar: acompanhar a jornada pelo link, responder quando o time pergunta, e, no fim, confirmar que resolveu ou reabrir. Tudo aqui acontece dentro do acompanhamento, por isso as outras ações estendem o UC01."
actors:
  - name: Relator
    description: Quem relatou. Não tem conta — é o link recebido ao relatar que prova que o relato é dele.
    position: { x: 40, y: 156 }
  - name: Armazenamento de arquivos
    kind: system
    description: Guarda os arquivos da resposta e da reabertura, privado, como os do relato. Serve pelo link e pelo código pessoal, sempre por endereço assinado de validade curta.
    position: { x: 1270, y: 11 }
useCases:
  - id: UC01
    name: Acompanhar o relato
    description: Pelo link, vê por onde o relato passou, em que etapa está e o que vem depois — como quem acompanha uma entrega.
    width: 220
    position: { x: 260, y: 150 }
    preconditions: Quem relatou tem o link do relato.
    mainFlow:
      - O relator abre o link que recebeu ao relatar.
      - A página mostra o que ele escreveu, com o título que ele mesmo deu — nunca o título que o time deu ao card.
      - A página mostra a jornada — as etapas por onde já passou, a de agora e as que vêm depois, cada uma com a sua frase.
      - Mostra a conversa com o time e o que o próprio relator anexou, cada coisa no seu lugar — embaixo do relato, da resposta ou da reabertura que a trouxe. A imagem aparece no tamanho que ele escolheu; o arquivo só baixa, com um nome genérico; os vídeos antigos continuam tocando.
      - Se o relato foi encerrado, mostra como terminou e por quê.
    alternativeFlows:
      - title: 1a. O relator chega pela lista pessoal, e não pelo link
        steps:
          - "A página abre só para leitura, com as imagens e os arquivos de cada envio: confirmar, reabrir, responder e anexar pedem o link."
      - title: 1b. O link não é de relato nenhum
        steps:
          - A página diz que não encontrou o relato, sem mostrar nada dele.
  - id: UC02
    name: Responder ao time
    description: Quando o time pede uma informação, responde pelo próprio relato. A página deixa claro de quem é a vez.
    width: 230
    position: { x: 600, y: 0 }
    preconditions: Há um pedido de informação aberto, e o relator chegou pelo link.
    mainFlow:
      - A página mostra a pergunta do time e avisa que a vez é de quem relatou, com o prazo.
      - O relator escreve a resposta.
      - Envia.
      - A resposta entra na conversa do relato, e a vez volta para o time.
    alternativeFlows:
      - title: 1a. O primeiro prazo já passou
        steps:
          - A página muda de tom e avisa que o relato vai encerrar se não houver resposta.
      - title: 1b. O segundo prazo passou sem resposta
        steps:
          - O relato já está encerrado como “sem retorno” — e ainda pode ser reaberto (UC06).
    postconditions: O prazo para de correr.
  - id: UC03
    name: Anexar à resposta
    description: "Imagens e arquivos junto da resposta — é ali que o print mais serve: o time olhou, não entendeu, e pede a tela."
    width: 230
    position: { x: 940, y: 0 }
    preconditions: O projeto deixa anexar respondendo ao time.
    mainFlow:
      - O relator escolhe imagens ou cola um print — e escolhe arquivos, quando o projeto aceita —, junto da resposta. Marca a imagem pelo "Editar", como na ferramenta.
      - A resposta é gravada primeiro, e os arquivos passam pelas mesmas regras do anexo do relato — permissão, envio direto ao armazenamento e conferência dos bytes —, com a cota da resposta.
      - Os arquivos ficam presos à resposta, e aparecem logo abaixo dela.
    alternativeFlows:
      - title: 1a. O relator quer capturar a tela
        steps:
          - Esta página não captura — ela não é o site onde o problema aconteceu. O print vem colado ou escolhido.
    postconditions: A resposta vale mesmo se um arquivo não subir; o que falhou fica com "Tentar de novo", e o que o projeto recusa diz o motivo.
  - id: UC04
    name: Confirmar que resolveu
    description: "O “entregue” do delivery: quem relatou diz que o problema foi mesmo resolvido."
    width: 230
    position: { x: 600, y: 150 }
    preconditions: O time encerrou o relato, o encerramento já aparece para quem relatou, e o relator chegou pelo link.
    mainFlow:
      - A página mostra como terminou e o motivo.
      - O relator escolhe confirmar.
      - O sistema grava a confirmação.
    postconditions: O relato está fechado dos dois lados. Não dá mais para reabrir.
  - id: UC05
    name: Dar nota ao atendimento
    description: De 1 a 5, sobre como foi o tratamento. “Prefiro não responder” fica fora da escala, e é diferente de nunca ter respondido.
    width: 230
    position: { x: 940, y: 150 }
    preconditions: O projeto pede nota.
    mainFlow:
      - Ao confirmar, a página pede a nota — em estrelas ou em número, como o projeto escolheu.
      - O relator dá a nota, ou escolhe “prefiro não responder”.
      - O sistema grava a nota junto da confirmação.
    alternativeFlows:
      - title: 2a. A nota não é obrigatória, e o relator não responde
        steps:
          - A confirmação vale sem nota, e fica registrado que não houve resposta.
    postconditions: Respondeu, recusou ou não respondeu — três estados, separados na contagem.
  - id: UC06
    name: Reabrir o relato
    description: Quem relatou diz que não resolveu. O relato volta para a fila do time, na coluna que o projeto escolheu.
    width: 230
    position: { x: 600, y: 300 }
    preconditions: O relato foi encerrado e ainda não foi confirmado, o projeto permite reabrir, e o relator chegou pelo link.
    mainFlow:
      - O relator escolhe reabrir.
      - Escreve por que está reabrindo, quando o projeto pede o comentário.
      - O sistema devolve o relato para a coluna que o projeto configurou e grava a reabertura.
      - A jornada pública volta junto, conforme o mapa daquela coluna.
    alternativeFlows:
      - title: 2a. O projeto pede o comentário, e ele fica em branco
        steps:
          - A página não reabre e pede o motivo.
    postconditions: O relato está de novo na fila do time, com o comentário de quem reabriu e o que veio anexado. Quem reabre não dá nota.
  - id: UC07
    name: Anexar à reabertura
    description: "O print do que ainda está acontecendo, junto da reabertura: é a prova de que o problema voltou."
    width: 230
    position: { x: 940, y: 300 }
    preconditions: O projeto deixa anexar ao reabrir — chave própria, e não a da resposta.
    mainFlow:
      - O relator escolhe imagens ou cola um print — e escolhe arquivos, quando o projeto aceita —, junto do motivo.
      - A reabertura é gravada primeiro, e os arquivos seguem as regras do anexo, com a cota da reabertura.
      - Os arquivos ficam presos à reabertura, e aparecem junto do motivo dela, na página e no painel.
    postconditions: A reabertura vale mesmo se um arquivo não subir.
links:
  - from: Relator
    to: UC01
    kind: association
  - from: UC02
    to: UC01
    kind: extend
    note: quando o time pediu uma informação e a vez é de quem relatou
  - from: UC03
    to: UC02
    kind: extend
    note: quando o projeto deixa anexar respondendo
  - from: Armazenamento de arquivos
    to: UC03
    kind: association
  - from: UC04
    to: UC01
    kind: extend
    note: quando o time encerrou e o relato ainda não foi confirmado
  - from: UC05
    to: UC04
    kind: extend
    note: quando o projeto pede nota
  - from: UC06
    to: UC01
    kind: extend
    note: quando o time encerrou, o projeto permite reabrir, e o relato ainda não foi confirmado
  - from: UC07
    to: UC06
    kind: extend
    note: quando o projeto deixa anexar ao reabrir
  - from: Armazenamento de arquivos
    to: UC07
    kind: association
notes:
  - text: A página mostra só o que foi montado campo a campo para o lado de fora. Comentário interno, estado interno e nome de quem trabalhou nunca atravessam.
    anchor: UC01
    position: { x: 250, y: 290 }
  - text: "Concluído e confirmado são momentos diferentes: o time diz que acabou, quem relatou diz que resolveu. Depois de confirmar não dá mais para reabrir — o problema que volta é outro relato."
    anchor: UC04
    position: { x: 768, y: 479 }
  - text: O time pergunta com prazo. Passado o primeiro, a página avisa que vai encerrar; passado o segundo, encerra como “sem retorno” — e continua reabrível.
    anchor: UC02
    position: { x: 560, y: -210 }
