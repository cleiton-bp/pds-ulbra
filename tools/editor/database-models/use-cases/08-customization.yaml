notes:
  - text: "Os modelos — Quadro simples, Suporte, Kanban e Scrum — nascem de um princípio: tudo customizável, com padrão pronto, para ninguém encarar uma tela em branco."
    anchor: UC01
    position: { x: 798, y: -280 }
  - text: "As três condições das variáveis: um padrão para cada uma — escrito no próprio texto, {{primeiroNome|pessoa}}, ou o de fábrica, que nunca quebra a frase —, uma lista fixa sempre mostrada como texto, e o primeiro nome no lugar do nome completo."
    anchor: UC05
    position: { x: 810, y: 144 }
  - text: "A decidir: a ferramenta roda num iframe de outro domínio e não enxerga o console nem as requisições do site. Quem pode capturar é o carregador, que roda na página do cliente."
    anchor: UC06
    position: { x: 813, y: -44 }
  - text: "Quem desenha o botão é o carregador, isolado do site, lendo só a aparência do projeto (pequena, em cache de 5 minutos); a ferramenta inteira vem no clique. Com o botão do site, nem a aparência é lida."
    anchor: UC07
    position: { x: 775, y: 333 }
  - text: "A robustez não é ação de ninguém — por isso não vira caso de uso. Já existe: os limites de relato por pessoa, IP, domínio e projeto, com o desafio invisível e a pausa, configuráveis em Domínios. Ficam planejados o bloqueio no navegador de onde a ferramenta pode abrir, e o carregador servido com versão imutável e conferência de integridade."
    position: { x: 731, y: -530 }
