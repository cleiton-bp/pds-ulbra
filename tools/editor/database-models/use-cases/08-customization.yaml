notes:
  - text: "Os modelos — suporte simples, kanban, scrum — são proposta. O que está decidido é o princípio: tudo customizável, com padrão pronto, para ninguém encarar uma tela em branco."
    anchor: UC01
    position: { x: 798, y: -280 }
  - text: "A decidir: as três condições das variáveis — um valor padrão para cada uma, uma lista fixa e sempre escapada, e preferir o primeiro nome ao nome completo."
    anchor: UC05
    position: { x: 810, y: 144 }
  - text: "A decidir: a ferramenta roda num iframe de outro domínio e não enxerga o console nem as requisições do site. Quem pode capturar é o carregador, que roda na página do cliente."
    anchor: UC06
    position: { x: 813, y: -44 }
  - text: "A decidir: quem desenha o botão. Se for o cliente, nada é baixado até o clique; se for o carregador, ele precisa ler a configuração a partir da página do cliente."
    anchor: UC07
    position: { x: 775, y: 333 }
  - text: "A robustez também está planejada, e não é ação de ninguém — por isso não vira caso de uso: o limite de envio por visitante — que depende de a API ler o IP de quem chama —, o bloqueio no navegador de onde a ferramenta pode abrir, e o carregador servido com versão imutável e conferência de integridade."
    position: { x: 731, y: -530 }
