meta:
  title: Customização
  system: PDS — painel e ferramenta
  description: "O que deixa dois projetos com cara, textos e jornadas diferentes: os modelos de configuração, os textos com variáveis, o que o relato captura sozinho e como a ferramenta abre no site. Tudo nasce com padrão de fábrica — projeto que não mexe continua funcionando como hoje. Os tipos de relato e o que cada um pergunta já funcionam: estão em 03-project-rules e 04-reporting. Os modelos de configuração (UC01), os textos com variáveis (UC05) e a abertura pelo site (UC07 e UC08) também já funcionam; o que ainda é Planejado está marcado em cada caso de uso."
actors:
  - name: Dono do projeto
    description: Quem decide como o projeto se comporta — e, aqui, também como ele se apresenta para quem relata.
    position: { x: 67, y: -140 }
  - name: Visitante do site
    description: Qualquer pessoa na página do cliente. Só baixa a ferramenta quem pedir para abrir — pelo botão dela ou pelo do site.
    position: { x: 99, y: 485 }
useCases:
  - id: UC01
    name: Começar por um modelo de configuração
    description: Em vez de um padrão único de fábrica, o projeto novo nasce do modelo que diz como o time trabalha — Quadro simples, Suporte, Kanban ou Scrum —, que já traz as colunas, o andamento público, o mapa entre eles e os tipos de relato; no Scrum, também as sprints.
    position: { x: 302, y: -289 }
    preconditions: O dono está criando um projeto (02-project-setup, UC02).
    mainFlow:
      - Ao criar o projeto, depois do nome, o dono escolhe como o time trabalha — cada modelo com uma linha e as colunas escritas.
      - "O sistema cria as colunas, o andamento público, o mapa e os tipos de relato daquele modelo: Suporte traz a etapa em que a vez é de quem relatou e os tipos Problema, Dúvida e Pedido; Kanban, o Backlog como entrada e a revisão antes do Feito; Scrum, a revisão e as sprints de duas semanas, com pontos."
      - Tudo continua editável depois, nas telas de sempre.
    alternativeFlows:
      - title: 1a. O dono não mexe na escolha
        steps:
          - O projeto nasce do Quadro simples, que vem marcado — o padrão de fábrica de sempre, com as três colunas já ligadas ao andamento público e os tipos Defeito, Melhoria e Dúvida.
      - title: 1b. O projeto já existe
        steps:
          - Não há como aplicar um modelo depois. Cada coisa se muda na própria tela — colunas, etapas públicas, tipos de relato, sprints.
    postconditions: O projeto anda do jeito que o time trabalha sem ninguém abrir as telas de regras. O modelo escolhido fica registrado no evento da criação, para a análise, e o projeto não guarda de qual modelo veio.
  - id: UC05
    name: Personalizar os textos
    description: "Todos os textos que quem relata lê são do projeto, com o de fábrica igual ao de antes. A confirmação e o topo do acompanhamento aceitam variáveis para soar humano — “Olá, {{primeiroNome}}”, “Seu relato {{protocolo}} está em {{etapa}}”."
    position: { x: 313, y: 138 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre Formulário, para os textos do formulário, ou Quem relata, para a confirmação e o topo do acompanhamento.
      - Escolhe um texto e reescreve; na confirmação e no topo do acompanhamento, põe as variáveis com um clique, onde está o cursor.
      - Confere na prévia, com valores de exemplo, e na linha "sem nome" o que entra quando a variável não tem valor — o padrão escrito depois da barra, ou o de fábrica.
      - Publica. Variável fora desses dois textos, ou que não existe, é recusada com o motivo.
    postconditions: A ferramenta e a página de acompanhamento mostram os textos do projeto, e o valor de cada variável aparece sempre como texto — nunca como código.
  - id: UC06
    name: Escolher o que o relato captura sozinho
    description: Planejado. Hoje o relato leva só a rota. Aqui o dono liga, se quiser, os erros recentes do console e as requisições que falharam — o que mais derruba o “não reproduz”.
    position: { x: 326, y: 37 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre Capturas.
      - Liga ou desliga cada captura.
      - Decide se a rota leva a parte depois do “?”, que por padrão é descartada.
      - Salva.
    postconditions: "O relato chega com o contexto ligado, mascarado: token e dado de cliente não passam."
  - id: UC07
    name: Escolher como a ferramenta abre
    description: Pelo botão da ferramenta, que o carregador desenha com a aparência do projeto, ou por um botão ou tela do próprio site. Nos dois, a ferramenta só é baixada quando alguém pede para abrir.
    position: { x: 266, y: 236 }
    preconditions: O dono está no painel, dentro do projeto.
    mainFlow:
      - O dono abre Instalação.
      - Copia o trecho de sempre — o botão da ferramenta aparece no canto, com a aparência escolhida em O botão.
      - Cola no site.
    alternativeFlows:
      - title: 7a. O site já tem um botão
        steps:
          - "Em Usar o seu próprio botão, o dono copia o trecho com data-button=\"none\": o botão da ferramenta não aparece, e nada dela é baixado até alguém pedir."
          - Liga o botão do site com o atributo data-pds-open, ou abre de qualquer tela com Pds.open().
      - title: 7b. Algumas páginas não devem ter o botão
        steps:
          - Em O botão, nas páginas escondidas, o dono lista as páginas onde o botão não aparece — o caminho exato ou o começo terminado em *. Vale também quando o site troca de página sem recarregar.
    postconditions: Quem só visita o site e nunca pede não baixa a ferramenta — só o carregador e a aparência do botão, ou, com o botão do site, só o carregador.
  - id: UC08
    name: Abrir a ferramenta pelo site
    description: O visitante usa o botão da ferramenta, ou o botão ou a tela do próprio site, e só então a ferramenta carrega.
    position: { x: 401, y: 512 }
    preconditions: A ferramenta está instalada no site, e o domínio não está bloqueado.
    mainFlow:
      - O visitante clica no botão — o da ferramenta ou o do site.
      - O botão mostra “Abrindo…” enquanto a ferramenta carrega — com o botão da ferramenta, o carregamento já começa quando o mouse passa por cima.
      - A ferramenta abre direto no formulário, e o relato leva a página em que o visitante está.
    alternativeFlows:
      - title: 8a. A ferramenta não carrega
        steps:
          - Passado o tempo de espera, o botão diz que não deu para abrir, e o visitante tenta de novo.
      - title: 8b. O domínio foi bloqueado
        steps:
          - O botão ainda pode aparecer por alguns minutos, mas abrir e enviar são recusados na hora.
    postconditions: O visitante relata sem o site ter pago pela ferramenta nas visitas em que ninguém pediu.
