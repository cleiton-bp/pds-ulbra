meta:
  title: Etapa 2 — O relato entra
  description: O relato vindo de fora, o contexto que veio junto com ele, os domínios de onde ele pode ser aberto e o primeiro evento gravado, montados sobre as tabelas que já existiam, que aparecem aqui sem alteração porque é nelas que as novas penduram.
entities:
  - name: base_columns
    label: Colunas padrão
    description: Não é tabela, é o conjunto de colunas que toda tabela do sistema repete, desenhado aqui uma vez para não precisar explicar em cada uma delas.
    inherited: true
    position: { x: 27, y: 190 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: created_at
        type: datetime
        note: quando o registro foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o registro vale, preenchido no lugar de apagar
  - name: accounts
    label: Contas
    description: Existe para ser a fronteira de isolamento, é a única garantia de que o dado de um cliente não aparece para outro, e por isso toda tabela do sistema pendura nela.
    inherited: true
    position: { x: 1160, y: 228 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: name
        type: text
        required: true
        note: nome da conta, exibido no painel
      - name: created_at
        type: datetime
        note: quando a conta foi criada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a conta vale, preenchido no lugar de apagar
      - name: purge_at
        type: datetime
        note: data em que a exclusão vira definitiva, gravada no pedido para sobreviver a mudança de política
      - name: anonymized_at
        type: datetime
        note: quando a identificação foi removida, e a partir daí nenhuma linha da conta guarda dado pessoal
  - name: users
    label: Usuários
    description: Existe porque alguém precisa entrar no painel e ser reconhecido entre uma visita e outra, e fica separada de accounts porque quem é dono da conta não é necessariamente quem opera, então no dia em que a conta tiver dois operadores nada muda de estrutura.
    inherited: true
    position: { x: 387, y: 400 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: account_id
        type: long
        fk: true
        required: true
        note: conta a que este usuário pertence
      - name: google_subject
        type: text
        required: true
        unique: true
        note: o sub do Google, identificador estável, é por ele que o login reconhece a pessoa
      - name: email
        type: text
        note: pode mudar no Google, guardado para contato, não serve como identidade
      - name: name
        type: text
        note: nome vindo do Google
      - name: avatar_url
        type: text
        note: foto vinda do Google, opcional
      - name: created_at
        type: datetime
        note: quando o usuário foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o usuário vale, preenchido no lugar de apagar
      - name: last_login_at
        type: datetime
        note: último acesso, em UTC
  - name: projects
    label: Projetos
    description: Existe para ser a unidade que o cliente configura e a que identifica de onde veio cada relato, porque sem ela um cliente com dois sistemas teria configuração e relatos misturados num monte só, e usar o mesmo projeto em mais de um sistema continua permitido.
    inherited: true
    position: { x: 1160, y: 507 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador usado na URL do painel
      - name: account_id
        type: long
        fk: true
        required: true
        note: conta dona do projeto
      - name: name
        type: text
        required: true
        note: nome do projeto, único dentro da conta entre os que não foram apagados
      - name: status
        type: enum
        required: true
        note: active | archived, arquivado continua visível, só para de aceitar coisa nova
      - name: created_at
        type: datetime
        note: quando o projeto foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o projeto vale, preenchido no lugar de apagar
  - name: project_keys
    label: Chaves do projeto
    description: Existe para ligar o sistema do cliente ao nosso, e é tabela separada em vez de duas colunas em projects porque chave precisa ser rotacionada e revogada, e guardar quando cada uma valeu é o que permite investigar um incidente depois.
    inherited: true
    position: { x: 18, y: 982 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da chave
      - name: type
        type: enum
        required: true
        note: public | secret, define se o valor é guardado em claro ou como hash
      - name: value
        type: text
        note: só para a pública, pode ser lida à vontade, por isso fica em claro
      - name: hash
        type: text
        note: só para a secreta, o valor original nunca é guardado
      - name: prefix
        type: text
        note: primeiros caracteres, para identificar a chave na lista sem revelá-la
      - name: created_at
        type: datetime
        note: quando a chave foi gerada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a linha vale, preenchido no lugar de apagar
      - name: revoked_at
        type: datetime
        note: nulo enquanto válida, preenchido ao regenerar, em UTC
      - name: last_used_at
        type: datetime
        note: último uso, em UTC, ajuda a saber se dá para revogar sem quebrar nada
  - name: project_origins
    label: Domínios autorizados
    description: Existe para dizer de quais endereços um relato pode ser aberto, porque a chave pública viaja no site do cliente e qualquer um consegue lê-la, então sem essa lista a chave sozinha vira convite para relato vindo de qualquer lugar.
    position: { x: 1906, y: 500 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto que autoriza este domínio
      - name: domain
        type: text
        required: true
        note: domínio autorizado, guardado sem esquema e sem barra final, comparado em minúsculo, único dentro do projeto
      - name: allows_subdomains
        type: bool
        required: true
        note: quando verdadeiro vale para app.site.com e loja.site.com sem precisar de uma linha para cada
      - name: created_at
        type: datetime
        note: quando o domínio foi autorizado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a autorização vale, preenchido no lugar de apagar
  - name: reports
    label: Relatos
    description: Existe para guardar o que a pessoa de fora escreveu, e é a primeira tabela do sistema que nasce de alguém sem conta e sem sessão, por isso ela carrega o próprio account_id, o protocolo que a pessoa lê e o token que abre o acompanhamento.
    position: { x: 1237, y: 893 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador usado na URL do painel
      - name: account_id
        type: long
        fk: true
        required: true
        note: conta dona do relato, repetido de propósito em vez de chegar pelo projeto
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto de onde o relato veio, resolvido pela chave pública da requisição
      - name: tracking_code
        type: text
        required: true
        unique: true
        note: o protocolo que a pessoa lê e repete, alfabeto sem 0, O, 1 e I, colisão tratada na geração
      - name: access_token_hash
        type: text
        required: true
        note: hash do token que vai no link de acompanhamento, o valor original só existe na URL entregue
      - name: type
        type: enum
        required: true
        note: bug | improvement | question, lista fixa por enquanto, configurável pelo cliente mais adiante
      - name: text
        type: text
        required: true
        note: o relato como a pessoa escreveu, com tamanho limitado no servidor
      - name: route
        type: text
        note: só o caminho da página de onde o relato foi aberto, sem query e sem fragmento
      - name: origin
        type: text
        note: domínio da página que embutiu o widget, apurado pelo iframe, guardado como veio mesmo fora da lista
      - name: created_at
        type: datetime
        note: quando o relato entrou, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o relato vale, preenchido no lugar de apagar
  - name: report_contexts
    label: Contexto do relato
    description: Existe para guardar o que veio junto com o relato sem virar coluna nova a cada captura, e é tabela separada em vez de campo dentro de reports porque o que se vai querer saber amanhã ainda não está decidido hoje.
    position: { x: 2409, y: 716 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: report_id
        type: long
        fk: true
        required: true
        note: relato a que este dado pertence
      - name: key
        type: text
        required: true
        note: nome do dado em inglês e snake_case, como user_agent ou viewport_width, único dentro do relato
      - name: value
        type: text
        note: o valor como chegou, sempre texto, a interpretação fica com quem lê
      - name: created_at
        type: datetime
        note: quando foi gravado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o dado vale, preenchido no lugar de apagar
  - name: events
    label: Eventos
    description: Existe para responder a pergunta de pesquisa do trabalho, e por isso é a única tabela do sistema que só cresce, nunca é alterada e nunca é apagada, nem quando a conta que o originou é excluída e anonimizada.
    position: { x: 1857, y: 1223 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece na API
      - name: account_id
        type: long
        fk: true
        note: conta de origem, continua apontando para ela depois de anonimizada, e é anulável só para o dia em que a linha da conta precisar ser apagada de verdade
      - name: project_id
        type: long
        fk: true
        note: projeto de origem, anulável porque o projeto é apagado de verdade quando a conta é excluída e o evento fica
      - name: report_id
        type: long
        fk: true
        note: relato a que o evento se refere, nulo quando o evento não nasce de um relato
      - name: type
        type: enum
        required: true
        note: report_created | report_viewed por enquanto, e a lista cresce conforme o produto anda
      - name: source
        type: enum
        required: true
        note: widget | panel | api | public_page, de onde a ação partiu
      - name: payload
        type: json
        note: o resto do evento em chave e valor, para tipo novo entrar sem migração
      - name: occurred_at
        type: datetime
        required: true
        note: quando aconteceu, em UTC, é esta a data que a análise usa
      - name: created_at
        type: datetime
        note: quando a linha foi gravada, em UTC, diferente de occurred_at quando houve retentativa
relations:
  - from: accounts
    fromField: id
    to: users
    toField: account_id
    kind: one-to-many
    note: "Todo usuário pertence a uma conta, e é por esta ligação que o isolamento funciona: a sessão diz quem é o usuário, o usuário diz qual é a conta, e a conta filtra todo o resto, então hoje é um por conta mas a cardinalidade já nasce 1:N."
  - from: accounts
    fromField: id
    to: projects
    toField: account_id
    kind: one-to-many
    note: "Uma conta tem vários projetos, normalmente um por sistema, e projeto nunca é órfão: remover a conta leva os projetos junto, porque fora dela não há a quem pertencer."
  - from: projects
    fromField: id
    to: project_keys
    toField: project_id
    kind: one-to-many
    note: Um projeto tem uma chave pública e uma secreta válidas por vez, mais o histórico das revogadas, e é 1:N justamente por causa do histórico, porque se fossem duas colunas em projects regenerar apagaria o rastro da chave anterior.
  - from: projects
    fromField: id
    to: project_origins
    toField: project_id
    kind: one-to-many
    note: Um projeto autoriza vários domínios, porque o mesmo sistema costuma viver em produção, em homologação e no domínio antigo que ainda redireciona, e cobrar uma chave para cada um empurraria o cliente a reaproveitar a mesma em todos.
  - from: accounts
    fromField: id
    to: reports
    toField: account_id
    kind: one-to-many
    note: A conta aparece direto no relato em vez de ser alcançada pelo projeto, porque esta é a tabela que mais cresce e a que o painel lista o tempo todo, então o filtro de isolamento vira comparação de coluna em vez de join.
  - from: projects
    fromField: id
    to: reports
    toField: project_id
    kind: one-to-many
    note: O relato nasce de um projeto e quem diz qual é a chave pública da requisição, então esta ligação é o próprio resultado da validação de entrada, e projeto arquivado para de aceitar relato novo sem perder os antigos.
  - from: reports
    fromField: id
    to: report_contexts
    toField: report_id
    kind: one-to-many
    note: Cada relato traz de zero a muitos pares de contexto, e é 1:N justamente para o formulário mandar um dado a mais amanhã sem alterar reports nem rodar migração.
  - from: accounts
    fromField: id
    to: events
    toField: account_id
    kind: one-to-many
    note: O evento guarda a conta para a análise separar por cliente, e a ligação sobrevive à exclusão porque a conta não é apagada, é anonimizada, então o evento continua pendurado nela sem identificar mais ninguém.
  - from: projects
    fromField: id
    to: events
    toField: project_id
    kind: one-to-many
    note: Mesmo caso do anterior, um nível abaixo, porque a comparação que interessa à pesquisa é entre projetos com acompanhamento e projetos sem.
  - from: reports
    fromField: id
    to: events
    toField: report_id
    kind: one-to-many
    note: Um relato acumula vários eventos ao longo da vida, criado agora e visualizado muitas vezes depois, e é essa contagem que responde se dar visibilidade reduz o contato repetido.
notes:
  - text: |-
      Toda tabela repete as colunas padrão

      Não vira tabela no banco. É id, created_at, updated_at e deleted_at, e tabela nova começa por elas.
    anchor: base_columns
    position: { x: -402, y: 194 }
    width: 320
    inherited: true
  - text: |-
      Apagar é preencher deleted_at

      Toda consulta filtra deleted_at nulo, e índice único ignora o apagado, senão o nome do projeto excluído segue ocupando o lugar.

      Soft delete não é exclusão, LGPD exige apagar ou anonimizar.
    anchor: base_columns
    anchorField: deleted_at
    position: { x: 349, y: 158 }
    width: 340
    inherited: true
  - text: |-
      Por que separar accounts de users já agora

      Hoje é uma pessoa por conta. No dia em que ela convidar um colega, sem isso vira migração geral.
    anchor: accounts
    position: { x: 1090, y: 11 }
    width: 320
    inherited: true
  - text: |-
      O e-mail não identifica, o google_subject sim

      O e-mail da conta Google muda, o sub não. Usar e-mail como chave duplica conta, ou entrega a conta a quem herdou o endereço.
    anchor: users
    anchorField: google_subject
    position: { x: -223, y: 389 }
    width: 320
    inherited: true
  - text: |-
      As duas chaves, dois jeitos de guardar

      A pública aparece no site do cliente -> em claro está certo.

      A secreta é exibida uma vez e fica só o hash. Se o painel mostra de novo, não é secreta.
    anchor: project_keys
    anchorField: hash
    position: { x: 345, y: 1209 }
    width: 340
    inherited: true
  - text: |-
      Regenerar não sobrescreve

      Revogar preenche revoked_at e cria linha nova, e é o histórico de quando cada chave valeu que permite investigar um incidente.

      revoked_at não é deleted_at, a revogada continua existindo.
    anchor: project_keys
    anchorField: revoked_at
    position: { x: 63, y: 1397 }
    width: 340
    inherited: true
  - text: |-
      Isolamento

      Toda consulta filtra por account_id na camada de acesso -> não em cada chamada.

      Se depender de lembrar, um dia alguém esquece, e esquecer aqui é vazar dado de outro cliente.
    anchor: accounts
    position: { x: 1511, y: 12 }
    width: 320
    inherited: true
  - text: |-
      Excluir é anonimizar, não apagar a linha

      accounts e users perdem a identificação e ficam de âncora do histórico, e limpar o google_subject é o que impede reencontrar a conta depois.

      Projeto, chaves, domínios e relatos somem de verdade, sobra contagem e tempo.
    anchor: accounts
    anchorField: anonymized_at
    position: { x: 1541, y: 169 }
    width: 340
    inherited: true
  - text: |-
      Excluir a conta tem prazo de arrependimento

      Planejado para depois, no perfil, apagando tudo de verdade 24h depois do pedido.

      O prazo mora em purge_at, não em deleted_at mais 24h, para a política mudar sem mexer no que já foi prometido. Entrar no painel dentro do prazo deve cancelar sozinho.
    anchor: accounts
    anchorField: deleted_at
    position: { x: 724, y: 81 }
    width: 340
    inherited: true
  - text: |-
      A secreta não usa hash de senha

      bcrypt é lento de propósito, feito para senha digitada, e esta chave é conferida a cada requisição.

      Ela já nasce longa e aleatória, então hash rápido resolve.
    anchor: project_keys
    anchorField: hash
    position: { x: -398, y: 1075 }
    width: 340
    inherited: true
  - text: |-
      O índice que mais vai doer

      Toda requisição do cliente começa procurando o projeto pela chave pública, então value precisa de índice desde o começo.

      É a consulta mais quente, e cresce com relatos, não com clientes.
    anchor: project_keys
    anchorField: value
    position: { x: 288, y: 814 }
    width: 340
    inherited: true
  - text: |-
      email não é único de propósito

      Duas contas Google podem acabar com o mesmo endereço, e quem manda é o google_subject.

      A ausência do índice único é escolha, não esquecimento.
    anchor: users
    anchorField: email
    position: { x: -235, y: 564 }
    width: 340
    inherited: true
  - text: |-
      value e hash nunca vêm juntos

      A pública preenche value e deixa hash nulo, a secreta faz o contrário, e uma trava no banco garante.

      Sem ela, um erro grava a secreta em claro e a tela continua igual.
    anchor: project_keys
    anchorField: type
    position: { x: -389, y: 789 }
    width: 340
    inherited: true
  - text: |-
      O que este arquivo acrescenta

      Já existiam, sem alteração, contas, usuários, projetos e chaves.

      Novo, os domínios autorizados, o relato, o contexto e o evento.

      Fora daqui, item de trabalho, estado interno e etapa pública, que vêm depois em arquivo próprio.
    position: { x: -687, y: 484 }
    width: 340
  - text: |-
      Origem é dica, não prova

      O iframe é do nosso domínio, então quem diz de onde o relato saiu é a página hospedeira, pelo postMessage, e na API isso chega auto-declarado.

      Quem barra de verdade é o frame-ancestors montado desta lista, que impede o widget de abrir fora dela.
    anchor: project_origins
    anchorField: domain
    position: { x: 1998, y: 153 }
    width: 340
  - text: |-
      Por que o relato repete a conta

      O relato é o que mais cresce e o painel filtra por conta o tempo todo, então account_id próprio troca um join por comparação de coluna.

      A chave não precisa, ela já devolve o projeto.
    anchor: reports
    anchorField: account_id
    position: { x: 1980, y: 875 }
    width: 340
  - text: |-
      A rota entra sem a query

      ?token=, ?cpf= e ?email= são comuns em rota de sistema interno, então guardar a URL inteira é vazar dado.

      Query e fragmento saem antes de a linha existir, não depois.
    anchor: reports
    anchorField: route
    position: { x: 1224, y: 1275 }
    width: 340
  - text: |-
      O relato nasce sem estado

      Não existe coluna de situação aqui, de propósito, o estado interno e a etapa pública entram depois.

      O relator vê Recebido sempre, e isso é texto fixo da tela.
    anchor: reports
    position: { x: 753, y: 1171 }
    width: 340
  - text: |-
      Contato não entra agora

      Pede tipo e texto, nada mais, porque ainda não há para onde mandar aviso, e guardar dado pessoal antes do uso é obrigação sem contrapartida.

      Quando entrar, vai em coluna própria e com consentimento, nunca no contexto.
    anchor: reports
    anchorField: text
    position: { x: 759, y: 1425 }
    width: 360
  - text: |-
      O protocolo identifica, o token dá acesso

      O protocolo é curto e a pessoa repete no telefone, então é adivinhável. Por isso o link leva um token longo e aleatório, guardado só como hash.

      Protocolo sozinho não abre nada.
    anchor: reports
    anchorField: access_token_hash
    position: { x: 771, y: 920 }
    width: 340
  - text: |-
      Contexto é tabela, payload de evento é json

      O contexto é filtrado por chave e valor, e coluna aceita índice, que é como se separa defeito de navegador de defeito do sistema.

      O payload é escrito uma vez e lido em bloco, nunca campo a campo. Dedup por rota sai de reports.route.
    anchor: report_contexts
    position: { x: 2712, y: 721 }
    width: 340
  - text: |-
      Os índices que este modelo exige

      tracking_code único, porque é por ele que a pessoa procura o relato.

      access_token_hash, porque a página pública acha pelo hash, nunca pelo id.

      project_id com created_at, porque o painel é sempre um projeto, do mais novo ao mais velho.
    anchor: reports
    anchorField: tracking_code
    position: { x: 770, y: 671 }
    width: 340
  - text: |-
      O evento só cresce

      Única tabela sem updated_at e sem deleted_at, evento gravado não se corrige, se contradiz com outro depois.

      E gravar evento não pode derrubar o relato, a falha vai para o log e a vida segue.
    anchor: events
    position: { x: 1929, y: 1570 }
    width: 340
  - text: |-
      O evento sobrevive à exclusão da conta

      As ligações com projeto e com relato são anuláveis de propósito, único lugar do modelo onde isso acontece. A conta não, ela é anonimizada e continua ali.

      Apagar o evento junto apagaria a base da pesquisa.
    anchor: events
    anchorField: project_id
    position: { x: 2158, y: 1234 }
    width: 340
  - text: |-
      Quem finalmente preenche last_used_at

      A coluna nasceu junto com a chave, sem ninguém escrever nela. Quem passa a preencher é a validação da chave pública.

      A cada requisição é escrita demais, uma vez por hora por chave já responde.
    anchor: project_keys
    anchorField: last_used_at
    position: { x: -390, y: 1283 }
    width: 340
  - text: |-
      O que pode entrar no payload

      Id interno, número, duração e enum, por tipo de evento.

      Não entra texto de pessoa, nem cópia do relato, da rota ou do contexto, e em report_viewed não entra quem viu, sem IP nem user_agent.

      Única tabela sem deleted_at, dado pessoal aqui não sai mais.
    anchor: events
    anchorField: payload
    position: { x: 1467, y: 1555 }
    width: 340
