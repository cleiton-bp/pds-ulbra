        type: datetime
        note: quando o registro foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o registro vale, preenchido no lugar de apagar
  - name: accounts
