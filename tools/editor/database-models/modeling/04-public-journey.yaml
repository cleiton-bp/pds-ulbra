meta:
  title: O relator acompanha
  description: A jornada que quem relatou vê, o que liga cada estado interno a um passo dela, e o registro de quando essa jornada andou. Montado sobre o que já existe, que aparece aqui sem alteração — menos projects e reports, que ganham uma coluna cada, e events, que ganha dois tipos.
entities:
  - name: base_columns
    label: Colunas padrão
    description: Não é tabela, é o conjunto de colunas que toda tabela do sistema repete, desenhado aqui uma vez para não precisar explicar em cada uma delas.
