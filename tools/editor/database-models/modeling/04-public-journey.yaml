    description: A tabela que não pode ser cortada. Existe porque os estados precisam ser criados pelo cliente, como colunas de Trello — se fossem fixos, definidos por nós, o motor de tradução viraria mapear os nossos estados nas nossas próprias etapas públicas, e o trabalho perderia justamente o peso técnico que o README aponta.
