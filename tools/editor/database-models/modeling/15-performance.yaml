meta:
  title: Desempenho — a busca e os eventos
  description: "Duas mudanças que nasceram de medir o sistema sob carga, e que não mudam o que ele faz. reports ganha searchable_text, o card como a busca o compara — o título do time, o de quem relatou, o texto e a descrição, sem acento e em minúsculas —, numa coluna gerada pelo banco: a busca só compara, em vez de refazer a conta de cada card a cada busca. E events perde as duas chaves estrangeiras, a da conta e a do projeto: as colunas e os índices da pesquisa ficam, e cada evento gravado deixa de travar a linha da conta e a do projeto, as mais disputadas do banco. Montado sobre o que já existe, que aparece sem alteração, menos reports e events."
entities:
  - name: base_columns
    label: Colunas padrão
    description: Não é tabela, é o conjunto de colunas que toda tabela do sistema repete, desenhado aqui uma vez para não precisar explicar em cada uma delas.
    inherited: true
    position: { x: 556, y: 162 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: created_at
        type: datetime
        note: quando o registro foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o registro vale, preenchido no lugar de apagar
  - name: accounts
    label: Contas
    description: "Dona dos dados: todo projeto pertence a uma conta. Não é a fronteira de isolamento: quem enxerga o quê é decidido por projeto — o dono enxerga todos os projetos da conta, e o time só os projetos em que entrou."
    inherited: true
    position: { x: 1160, y: 228 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: name
        type: text
        required: true
        note: nome da conta, exibido no painel
      - name: created_at
        type: datetime
        note: quando a conta foi criada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a conta vale, preenchido no lugar de apagar
      - name: purge_at
        type: datetime
        note: data em que a exclusão vira definitiva, gravada no pedido para sobreviver a mudança de política
      - name: anonymized_at
        type: datetime
        note: quando a identificação foi removida, e a partir daí nenhuma linha da conta guarda dado pessoal
  - name: users
    label: Usuários
    description: "Existe porque alguém precisa entrar no painel e ser reconhecido entre uma visita e outra, e é referenciada por quem move card, por quem comenta e por quem convida. A mesma pessoa pode trabalhar em projetos de várias contas: account_id é a conta própria dela, e os projetos das outras chegam por project_members. E guarda o volume do som dos avisos do painel."
    inherited: true
    position: { x: 387, y: 400 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: account_id
        type: long
        fk: true
        required: true
        note: "a conta própria: nasce no primeiro acesso, e a pessoa é dona dela; os projetos de outras contas chegam por project_members"
      - name: google_subject
        type: text
        required: true
        unique: true
        note: o sub do Google, identificador estável, é por ele que o login reconhece a pessoa
      - name: email
        type: text
        required: true
        note: e-mail vindo do Google, usado para exibir e para contato
      - name: email_verified
        type: bool
        required: true
        note: se o Google confirmou, no último login, que a pessoa é dona do e-mail. Aceitar convite exige; começa falso e se acerta no próximo login
      - name: name
        type: text
        note: nome vindo do Google, exibido no painel
      - name: avatar_url
        type: text
        note: foto vinda do Google, opcional, e nunca pedida a quem entra
      - name: last_login_at
        type: datetime
        note: último acesso, em UTC
      - name: notification_volume
        type: int
        required: true
        note: o volume do som dos avisos no painel, de 0 a 100 (trava no banco); 70 de fábrica, também para quem já existia. O som de cada tipo de aviso fica em user_notification_sounds
      - name: created_at
        type: datetime
        note: quando o usuário entrou pela primeira vez, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o usuário vale, preenchido no lugar de apagar
  - name: projects
    label: Projetos
    description: Existe porque uma conta acompanha mais de um sistema, e cada um precisa da própria chave, dos próprios domínios, da própria fila de estados e da própria lista de relatos.
    inherited: true
    position: { x: 1160, y: 507 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: account_id
        type: long
        fk: true
        required: true
        note: "conta dona do projeto: quem é dono dela manda no projeto sem linha em project_members, e o resto do time chega por lá"
      - name: name
        type: text
        required: true
        note: nome do projeto, único dentro da conta entre os não apagados
      - name: status
        type: enum
        required: true
        note: active | archived, arquivar para de aceitar relato novo sem perder o que já entrou
      - name: created_at
        type: datetime
        note: quando o projeto foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: mapping_version
        type: int
        required: true
        note: a versão do mapeamento que vale agora, zero enquanto o cliente nunca ligou nada, e mora aqui em vez de ser o maior valor da tabela de mapeamento porque desfazer todos os mapeamentos grava uma versão sem nenhuma linha
      - name: last_card_number
        type: int
        required: true
        note: o último número de card dado no projeto; somado e lido num comando só, que serializa quem cria ao mesmo tempo, e por isso mora aqui em vez de ser o maior número de reports
      - name: board_top_rank
        type: long
        required: true
        note: o topo do quadro, o lugar do último card posto no topo de uma coluna — o que chega sem ser arrastado, ou o que foi solto no topo. Só desce, num comando só, no mesmo desenho do número (que sobe); o card que chega fica acima de tudo sem ninguém ler a coluna
      - name: last_sprint_number
        type: int
        required: true
        note: o último número de sprint dado no projeto, somado e lido num comando só, como o do card; a sprint apagada não devolve o número
      - name: deleted_at
        type: datetime
        note: nulo enquanto o projeto vale, preenchido no lugar de apagar
  - name: project_keys
    label: Chaves do projeto
    description: Existe para separar quem só aponta o projeto de quem prova ser o servidor do cliente, e guarda o histórico das revogadas porque saber quando cada chave valeu é o que permite investigar um incidente depois.
    inherited: true
    position: { x: 18, y: 982 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da chave
      - name: type
        type: enum
        required: true
        note: public | secret, a pública identifica o projeto, a secreta autentica uma integração
      - name: value
        type: text
        note: só a pública fica em claro, porque ela viaja no HTML do site do cliente e precisa ser lida
      - name: hash
        type: text
        note: só a secreta, e é tudo o que sobra dela, porque o valor completo existe uma única vez na resposta que a criou
      - name: prefix
        type: text
        required: true
        note: o começo do valor, para a tela mostrar qual chave é sem revelar o resto
      - name: revoked_at
        type: datetime
        note: nulo enquanto a chave vale, preenchido ao regenerar, e a linha fica como histórico
      - name: last_used_at
        type: datetime
        note: último uso, em UTC, e é o que diz se dá para revogar uma chave sem quebrar nada
      - name: created_at
        type: datetime
        note: quando a chave foi gerada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a chave vale, preenchido no lugar de apagar
  - name: project_origins
    label: Domínios autorizados
    description: "Sentido novo — os domínios cujo relato entra direto no Trabalho. Fora da lista, o relato não é recusado: é recebido e fica retido até o time permitir o domínio (uma linha nova aqui, que libera os retidos dele) ou bloqueá-lo. A lista vazia não autoriza ninguém, então todo domínio novo passa uma vez pela pergunta; para nenhum projeto mudar de comportamento, a migração pôs aqui cada domínio que já tinha mandado relato (até cinquenta)."
    inherited: true
    position: { x: 1906, y: 500 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto que autoriza este endereço
      - name: domain
        type: text
        required: true
        note: minúsculo, sem esquema e sem barra final, com a porta quando informada, único no projeto entre os não apagados
      - name: allows_subdomains
        type: bool
        required: true
        note: quando verdadeiro vale também para app. e loja. na frente, e nasce desligado porque autorizar demais é o erro que não aparece
      - name: created_at
        type: datetime
        note: quando o endereço foi autorizado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
