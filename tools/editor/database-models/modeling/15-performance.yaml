  - name: project_states
    label: Estados do projeto
    description: A tabela que não pode ser cortada. Existe porque os estados precisam ser criados pelo cliente, como as colunas de um quadro Kanban — se fossem fixos, definidos por nós, o motor de tradução viraria mapear os nossos estados nas nossas próprias etapas públicas, e o trabalho perderia justamente o peso técnico que o README aponta.
    inherited: true
    position: { x: 560, y: 700 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono do estado, porque a fila de trabalho é de cada sistema e não da conta
      - name: name
        type: text
        required: true
        note: o nome que o time deu, como Análise ou Corrigindo, único no projeto entre os não apagados, e renomear não reescreve o passado porque o evento guarda o nome que valia na época
      - name: position
        type: int
        required: true
        note: a ordem na tela, escolhida pelo cliente, e é coluna em vez de ordem alfabética porque fila de trabalho tem sequência
      - name: deactivated_at
        type: datetime
        note: nulo enquanto o estado aceita card novo, preenchido para desativá-lo sem apagar, porque card antigo continua apontando para ele e o histórico precisa continuar legível
      - name: created_at
        type: datetime
        note: quando o estado foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o estado vale, preenchido no lugar de apagar
  - name: reports
    label: Relatos e cards
    description: Nesta modelagem ganha searchable_text, o card como a busca o compara, numa coluna que o banco calcula a cada gravação. Guarda blocked_origin_kept_at, a decisão do time de manter o relato vindo de um domínio bloqueado, e origin na forma em que as listas comparam. Aponta para o tipo do projeto (report_type_id) e guarda as respostas às perguntas do tipo (answers); o texto continua sendo o relato inteiro, montado das respostas quando o tipo pergunta. Guarda todo card do trabalho do time — o relato, que chegou de fora, e o card do time, que nasceu no painel (kind) —, com o número curto do projeto, o título de quem relatou e o do time, o responsável, a prioridade, o prazo, o lugar no quadro e o pai, quando o card é subtarefa. Protocolo, token, tipo, texto e respostas ficam nulos no card do time, e duas travas no banco separam os dois.
    position: { x: 1237, y: 893 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador usado na URL do painel
      - name: kind
        type: enum
        required: true
        note: report | team. O relato veio de fora, pela ferramenta; o card do time nasceu no painel e nunca tem lado de fora
      - name: number
        type: int
        required: true
        note: o número curto do card no projeto (#42), interno, separado do protocolo. Único por projeto, inclusive entre os apagados; vem de projects.last_card_number, pode pular e nunca repete
      - name: title
        type: text
        note: o título do time, uma linha. Obrigatório no card do time; no relato, o que o time reescreveu, nulo até alguém reescrever. Interno
      - name: reporter_title
        type: text
        note: o título que a pessoa escreveu na ferramenta, respondendo "em poucas palavras, o que aconteceu?". Nunca muda, e é o único título que volta para ela. Nulo quando ela não respondeu, e sempre no card do time
      - name: description
        type: text
        note: a descrição do card do time, em Markdown, desenhada pelo painel sem HTML. Sempre nula no relato, cujo texto é de quem relatou
      - name: archived_at
        type: datetime
        note: quando o card saiu da tela de Trabalho; arquivado se lê e se comenta, e mover ou editar pedem desarquivar
      - name: created_by_user_id
        type: long
        fk: true
        note: quem do time criou o card. Nulo no relato, porque quem escreveu não tem usuário aqui
      - name: assignee_user_id
        type: long
        fk: true
        note: quem do time está com o card, um só. Quem sai do time continua aqui como registro, e o painel o marca como fora do time
      - name: priority_id
        type: long
        fk: true
        note: a prioridade do projeto que o time escolheu. Nula é sem prioridade, e é como o card nasce — a não ser que quem cria o card do time já escolha uma (a subtarefa, nunca)
      - name: due_date
        type: date
        note: o prazo, só a data, sem hora. Nulo é sem prazo
      - name: parent_report_id
        type: long
        fk: true
        note: o card de que este é subtarefa; nulo no card que não é. Só o card do time é subtarefa, e ninguém é pai de si mesmo (duas travas no banco); um nível só, e o pai do mesmo projeto, o serviço confere. Arquivar o pai leva as subtarefas, com o mesmo instante em archived_at
      - name: sprint_id
        type: long
        fk: true
        note: a sprint do card; nula é o backlog. A subtarefa acompanha o pai (o serviço confere). Interno
