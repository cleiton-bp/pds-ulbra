      - name: tracking_code_can_act
        type: bool
        required: true
        note: "se o código pessoal sozinho confirma e reabre, ou se essas ações exigem o link; ler é inofensivo, reabrir mexe na fila do time. Gravado e, por enquanto, ignorado: confirmar, reabrir e responder só aceitam o link"
      - name: satisfaction_enabled
        type: bool
        required: true
        note: se a nota e pedida ao confirmar
      - name: satisfaction_style
