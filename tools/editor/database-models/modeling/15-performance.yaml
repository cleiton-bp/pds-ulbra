  - name: project_cycle_settings
    label: Regras do ciclo
    description: "Como o ciclo fecha neste projeto: quando encerra, quanto espera antes de quem relatou ver, se dá para reabrir e como, e o que a pessoa responde no fim. E, no quadro, quantos dias a última coluna mostra e quando o prazo fica em destaque. Uma linha por projeto, criada só quando alguém salva — os padrões vivem no código, e projeto sem linha é projeto que nunca precisou mudar nada."
