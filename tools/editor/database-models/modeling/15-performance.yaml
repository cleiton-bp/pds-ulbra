relations:
  - from: reports
    fromField: id
    to: report_info_requests
    toField: report_id
    kind: one-to-many
    note: Um relato pode ser devolvido mais de uma vez, e cada devolução tem prazo próprio. A pergunta em si não mora aqui — mora num comentário público, porque a conversa acontece pelo próprio relato.
  - from: users
    fromField: id
    to: report_info_requests
    toField: asked_by_user_id
    kind: one-to-many
    note: "Obrigatório, ao contrário de closed_by_user_id: o sistema encerra sozinho no fim do prazo, mas nunca pergunta nada por conta própria."
  - from: accounts
    fromField: id
    to: users
    toField: account_id
    kind: one-to-many
    note: Cada pessoa tem uma conta própria, que nasce no primeiro acesso, e é dona dela. É por aqui que o dono manda em todos os projetos da conta; os projetos de outras contas chegam por project_members, e não por esta ligação.
  - from: accounts
    fromField: id
    to: projects
    toField: account_id
    kind: one-to-many
    note: Uma conta tem vários projetos, normalmente um por sistema, e projeto nunca é órfão.
  - from: projects
    fromField: id
    to: project_keys
    toField: project_id
    kind: one-to-many
    note: Um projeto tem uma chave pública válida — que nasce com ele — e, quando a integração pede, uma secreta válida por vez, mais o histórico das revogadas. A secreta não nasce com o projeto.
  - from: projects
    fromField: id
    to: project_origins
    toField: project_id
    kind: one-to-many
    note: Um projeto autoriza vários domínios, porque o mesmo sistema vive em produção, em homologação e no domínio antigo que ainda redireciona.
  - from: projects
    fromField: id
    to: project_blocked_origins
    toField: project_id
    kind: one-to-many
    note: Um projeto bloqueia vários domínios, um por linha, até cem — passar disso é sinal de que o caminho é fechar com a lista de autorizados.
  - from: users
    fromField: id
    to: project_blocked_origins
    toField: blocked_by_user_id
    kind: one-to-many
    note: Quem bloqueou. Anulável, e não obrigatório como quem convida, porque o bloqueio sobrevive à pessoa.
  - from: projects
    fromField: id
    to: project_widget_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no máximo uma configuração de ferramenta, e projeto sem linha responde com os padrões — que moram em C#, e não como valor padrão de coluna, para existirem num lugar só.
  - from: projects
    fromField: id
    to: project_states
    toField: project_id
    kind: one-to-many
    note: Um projeto tem a própria fila de estados, e não a da conta, porque times diferentes dentro da mesma empresa trabalham sistemas diferentes de formas diferentes.
  - from: project_states
    fromField: id
    to: reports
    toField: project_state_id
    kind: one-to-many
    note: Vários cards param no mesmo estado, e esta é a ligação que a lista do painel filtra e conta. Estado desativado continua apontado por cards antigos, e é por isso que desativar não é apagar.
  - from: accounts
    fromField: id
    to: reports
    toField: account_id
    kind: one-to-many
    note: A conta aparece direto no relato em vez de ser alcançada pelo projeto, porque esta é a tabela que mais cresce e a que o painel lista o tempo todo.
  - from: projects
    fromField: id
    to: reports
    toField: project_id
    kind: one-to-many
    note: O relato nasce de um projeto, e quem diz qual é a chave pública da requisição; o card do time, da rota do painel.
  - from: users
    fromField: id
    to: reports
    toField: created_by_user_id
    kind: one-to-many
    note: Quem do time criou o card do time. O relato não tem, porque quem escreveu não tem usuário aqui.
  - from: reports
    fromField: id
    to: report_contexts
    toField: report_id
    kind: one-to-many
    note: Cada relato traz de zero a muitos pares de contexto, para o formulário mandar um dado a mais amanhã sem alterar reports.
  - from: reports
    fromField: id
    to: report_internal_comments
    toField: report_id
    kind: one-to-many
    note: O time comenta quantas vezes precisar, e nada aqui tem caminho para a camada pública — não há rota, consulta nem campo que leve esta tabela para fora.
  - from: reports
    fromField: id
    to: report_public_comments
    toField: report_id
    kind: one-to-many
    note: O que o time escolhe dizer ao relator, escrito numa tabela própria, e promover um interno a público não é editar um campo — é escrever de novo, de propósito.
  - from: users
    fromField: id
    to: report_internal_comments
    toField: user_id
    kind: one-to-many
    note: Comentário interno sem autor não serve para decidir nada depois, então o autor é obrigatório.
  - from: users
    fromField: id
    to: report_public_comments
    toField: user_id
    kind: one-to-many
    note: O autor fica gravado do lado de dentro mesmo que a camada pública escolha não mostrar o nome de ninguém — e passa a ser nulo quando quem escreveu foi o relator, que não tem usuário aqui. É o mesmo desenho de closed_by_user_id, onde nulo quer dizer que foi o sistema.
  - from: users
    fromField: id
    to: events
    toField: user_id
    kind: one-to-many
    note: Nulo quando a ação veio de fora — o relato criado pelo widget e a visualização feita por quem relatou não têm usuário do time por trás.
  - from: reports
    fromField: id
    to: events
    toField: report_id
    kind: one-to-many
    note: Um relato acumula vários eventos ao longo da vida, e a partir daqui também um por mudança de estado e um por comentário.
  - from: projects
    fromField: id
    to: project_public_stages
    toField: project_id
    kind: one-to-many
    note: Um projeto desenha a própria jornada pública, entre três e sete etapas — abaixo de três ela não conta uma história, acima de sete volta a ser o organograma interno com palavras mais bonitas.
  - from: projects
    fromField: id
    to: project_status_mappings
    toField: project_id
    kind: one-to-many
    note: O mapa é do projeto, e cada gravação dele cria uma versão inteira nova em vez de alterar as linhas que já existem.
  - from: project_states
    fromField: id
    to: project_status_mappings
    toField: project_state_id
    kind: one-to-many
    note: Um estado interno aparece uma vez por versão do mapa. Estado sem linha nenhuma é estado não mapeado — a ausência é a resposta, e não uma linha apontando para nada.
  - from: project_public_stages
    fromField: id
    to: project_status_mappings
    toField: project_public_stage_id
    kind: one-to-many
    note: "Vários estados internos caem na mesma etapa pública, e é o caminho normal: o time precisa de granularidade que quem está de fora não precisa."
  - from: project_public_stages
    fromField: id
    to: reports
    toField: project_public_stage_id
    kind: one-to-many
    note: "O passo em que o relato aparece para quem o escreveu. É cache: a verdade é a sequência de eventos de mudança de etapa pública."
  - from: reports
    fromField: id
    to: report_closures
    toField: report_id
    kind: one-to-many
    note: "Um relato pode ser encerrado mais de uma vez, porque entre um encerramento e outro ele pode ter sido reaberto. Guardar só o último apagaria a história que a métrica quer contar: quantas vezes o time achou que tinha acabado antes de acabar de verdade."
  - from: users
    fromField: id
    to: report_closures
    toField: closed_by_user_id
    kind: one-to-many
    note: Quem do time encerrou. Fica nulo quando quem encerrou foi o próprio sistema, no fim do prazo do pedido de informação — e essa diferença importa, porque encerramento automático é o único que ninguém leu antes de acontecer.
  - from: projects
    fromField: id
    to: project_cycle_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no máximo uma configuração de ciclo, e projeto sem linha responde com os padrões — que moram em C#, e não como valor padrão de coluna, para existirem num lugar só. Mesmo desenho da configuração da ferramenta.
  - from: project_states
    fromField: id
    to: project_cycle_settings
    toField: reopen_state_id
    kind: one-to-many
    note: A coluna para onde o relato reaberto volta. É escolha do cliente, e a sugestão escrita na tela é apontar para uma coluna diferente da de entrada, para o time separar o que voltou do que chegou agora.
  - from: projects
    fromField: id
    to: project_identity_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no máximo uma configuração de identidade, e projeto sem linha responde com os padrões — que moram em C#, e não como valor padrão de coluna. Mesmo desenho da configuração da ferramenta e das regras do ciclo.
  - from: projects
    fromField: id
    to: project_report_limits
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no máximo uma linha de limites, e projeto sem linha usa os de fábrica — que moram em C#, com os tetos, e não como valor padrão de coluna.
  - from: projects
    fromField: id
    to: reporter_codes
    toField: project_id
    kind: one-to-many
    note: O código não atravessa projetos, e isso é proposital — o mesmo texto em dois projetos são duas pessoas diferentes, e aceitar um código de fora transformaria o código numa credencial universal que ninguém escolheu criar.
  - from: reporter_codes
    fromField: id
    to: reports
    toField: reporter_code_id
    kind: one-to-many
    note: "É o que junta os relatos da mesma pessoa sem login nenhum. A ligação é opcional, e precisa ser: relato do modo protocolo, e relato anterior ao modo existir, não têm código nenhum e continuam abrindo pelo link de sempre."
  - from: users
    fromField: id
    to: reports
    toField: moderated_by_user_id
    kind: one-to-many
    note: "Quem do time decidiu se o relato vira público. Ao contrário de closed_by_user_id, aqui ninguém decide sozinho: não existe moderação automática, e a coluna só fica nula enquanto ninguém olhou."
  - from: projects
    fromField: id
    to: project_media_settings
    toField: project_id
    kind: one-to-one
    note: Uma configuração por projeto, criada só quando alguém salva. Projeto sem linha lê os padrões do código, e se comporta igual a quem salvou os padrões.
  - from: project_media_settings
    fromField: id
    to: project_media_kinds
    toField: project_media_settings_id
    kind: one-to-many
    note: Um tipo de mídia por linha. É o que permite acrescentar áudio sem migração, e o que deixa cada tipo ter limites próprios sem inventar coluna para cada combinação.
  - from: reports
    fromField: id
    to: report_attachments
    toField: report_id
    kind: one-to-many
    note: "O relato carrega os anexos de três envios: a criação, cada resposta ao pedido de informação e cada reabertura. O limite vale em cada envio e por categoria — imagem e arquivo, cada um com quantidade e tamanho. O teto é do projeto, dentro do teto do sistema, porque quem paga a conta de guardar escolhe quanto quer guardar."
  - from: report_public_comments
    fromField: id
    to: report_attachments
    toField: public_comment_id
    kind: one-to-many
    note: O anexo que veio numa resposta ao pedido de informação aponta também para o comentário. Continua apontando para o relato, então achar o dono nunca depende de passar por aqui.
  - from: report_closures
    fromField: id
    to: report_attachments
    toField: reopened_closure_id
    kind: one-to-many
    note: "O anexo que veio numa reabertura aponta para o fechamento que quem relatou reabriu — e não para um comentário: reabrir não escreve na conversa, e o motivo pode ficar em branco. Com a coluna, a cota da reabertura é um filtro, e a tela sabe onde mostrar o arquivo sem adivinhar pela data."
  - from: projects
    fromField: id
    to: project_members
    toField: project_id
    kind: one-to-many
    note: O time de cada projeto. O dono da conta não aparece aqui.
  - from: users
    fromField: id
    to: project_members
    toField: user_id
    kind: one-to-many
    note: A mesma pessoa em projetos de várias contas — é isto que o painel agrupa pela conta dona.
  - from: projects
    fromField: id
    to: project_invitations
    toField: project_id
    kind: one-to-many
    note: Um projeto tem os convites que já fecharam e, no máximo, um aberto por endereço.
  - from: users
    fromField: id
    to: project_invitations
    toField: invited_by_user_id
    kind: one-to-many
    note: Quem convidou — ou quem reenviou por último, porque é o nome que vai no e-mail que está valendo.
  - from: users
    fromField: id
    to: project_invitations
    toField: accepted_by_user_id
    kind: one-to-many
    note: Quem aceitou. É a mesma pessoa que ganha a linha em project_members, no mesmo gesto.
  - from: projects
    fromField: id
    to: project_team_settings
    toField: project_id
    kind: one-to-one
    note: Uma configuração do time por projeto, e só se alguém salvou; sem ela, valem os padrões.
  - from: users
    fromField: id
    to: reports
    toField: assignee_user_id
    kind: one-to-many
    note: Uma pessoa está com vários cards, e cada card com uma só. Quem sai do time continua ligado aos cards que eram dele, como registro.
  - from: reports
    fromField: id
    to: reports
    toField: parent_report_id
    kind: one-to-many
    note: Um card tem várias subtarefas, e a subtarefa tem um pai só. Um nível — subtarefa não tem subtarefa —, e só o card do time é subtarefa.
  - from: reports
    fromField: id
    to: card_links
    toField: from_report_id
    kind: one-to-many
    note: O card de origem do vínculo. Restrict, como o pai — card não se apaga, e o vínculo não some debaixo dele.
  - from: reports
    fromField: id
    to: card_links
    toField: to_report_id
    kind: one-to-many
    note: O card de destino. Um original tem vários duplicados; um card é bloqueado por vários.
  - from: projects
    fromField: id
    to: card_links
    toField: project_id
    kind: one-to-many
    note: Os dois cards são do mesmo projeto, e o vínculo também.
  - from: projects
    fromField: id
    to: sprints
    toField: project_id
    kind: one-to-many
    note: Uma em andamento por vez, e quantas planejadas o time quiser.
  - from: sprints
    fromField: id
    to: reports
    toField: sprint_id
    kind: one-to-many
    note: Os cards da sprint. Restrict — a sprint apagada devolve os cards ao backlog antes; a concluída guarda o que terminou nela.
  - from: users
    fromField: id
    to: user_notification_sounds
    toField: user_id
    kind: one-to-many
    note: Um som por tipo de aviso; o tipo sem linha usa o de fábrica.
  - from: users
    fromField: id
    to: notifications
    toField: user_id
    kind: one-to-many
    note: Os avisos de uma pessoa. Só ela os lê.
  - from: users
    fromField: id
    to: notifications
    toField: actor_user_id
    kind: one-to-many
    note: Quem mencionou, ou quem escolheu o responsável.
  - from: reports
    fromField: id
    to: notifications
    toField: report_id
    kind: one-to-many
    note: O card de que o aviso fala. Opcional desde os avisos do projeto, que não têm card.
  - from: report_internal_comments
    fromField: id
    to: notifications
    toField: report_internal_comment_id
    kind: one-to-many
    note: Um comentário menciona várias pessoas; cada uma ganha o seu aviso.
  - from: projects
    fromField: id
    to: notifications
    toField: project_id
    kind: one-to-many
    note: O projeto do card, para o filtro de acesso.
  - from: projects
    fromField: id
    to: project_priorities
    toField: project_id
    kind: one-to-many
    note: Cada projeto tem as próprias prioridades, nascidas com as quatro de fábrica.
  - from: project_priorities
    fromField: id
    to: reports
    toField: priority_id
    kind: one-to-many
    note: Restrict, como o estado — prioridade não se apaga, se desativa, porque card antigo aponta para ela.
  - from: projects
    fromField: id
    to: project_labels
    toField: project_id
    kind: one-to-many
    note: Cada projeto tem as próprias etiquetas, criadas pelo time ao etiquetar.
  - from: reports
    fromField: id
    to: report_labels
    toField: report_id
    kind: one-to-many
    note: Um card leva até dez etiquetas.
  - from: project_labels
    fromField: id
    to: report_labels
    toField: project_label_id
    kind: one-to-many
    note: Uma etiqueta está em vários cards; apagá-la tira de todos.
  - from: projects
    fromField: id
    to: project_report_types
    toField: project_id
    kind: one-to-many
    note: Cada projeto tem os próprios tipos, nascidos com os três de fábrica — e o projeto que já existia ganhou os mesmos três na migração.
  - from: project_states
    fromField: id
    to: project_report_types
    toField: initial_state_id
    kind: one-to-many
    note: "A coluna em que o tipo entra. Vários tipos podem entrar na mesma, e é isso que permite as duas formas de trabalhar: tudo no backlog, ou cada tipo no seu lugar. Restrict — a coluna não some debaixo do tipo, e o serviço recusa aposentá-la antes."
  - from: project_report_types
    fromField: id
    to: reports
    toField: report_type_id
    kind: one-to-many
    note: Restrict, como a prioridade — tipo não se apaga, se desativa, porque relato antigo aponta para ele. O desativado continua no relato, marcado.
  - from: project_report_types
    fromField: id
    to: project_widget_settings
    toField: default_report_type_id
    kind: one-to-many
    note: O tipo pré-marcado na ferramenta. Restrict pelo mesmo motivo; e o escolhido que é desativado não precisa ser trocado, porque a leitura cai no primeiro ativo.
notes:
  - text: |-
      Dois títulos, e só um volta para fora

      reporter_title é o que a pessoa escreveu na ferramenta, e nunca muda; title é o do time, interno. O painel mostra o do time, senão o dela, senão o começo do texto. O acompanhamento e a lista pessoal devolvem só reporter_title — e a lista pública, nenhum dos dois.
    anchor: reports
    anchorField: reporter_title
    position: { x: 3950, y: 1800 }
    width: 380
    inherited: true
  - text: |-
      Toda tabela repete as colunas padrão

      Não vira tabela no banco. É id, created_at, updated_at e deleted_at, e tabela nova começa por elas.
    anchor: base_columns
    position: { x: -2, y: 231 }
    width: 320
    inherited: true
  - text: |-
      Evento primeiro, cache depois

      A verdade é a sequência de eventos; reports.project_state_id é cache dela. Nunca gravar o cache sem o evento ter entrado antes, na mesma transação — se o evento falhar e o cache passar, o dado se perde para sempre, e é justamente ele que alimenta a linha do tempo pública, o histórico e as métricas da pesquisa.
    anchor: reports
    anchorField: project_state_id
    position: { x: 700, y: 1900 }
    width: 380
    inherited: true
  - text: |-
      O evento nunca carrega o texto de um comentário

      O payload guarda de-onde, para-onde e o nome que o estado tinha na época. Nunca o corpo do comentário. A linha do tempo que o relator vai ler é montada a partir de events — se o texto interno estivesse ali, vazar seria uma junção distraída, e não um erro difícil.
    anchor: events
    anchorField: payload
    position: { x: 2105, y: 1526 }
    width: 380
    inherited: true
  - text: |-
      Duas tabelas, e não um campo de visibilidade

      O desenho óbvio é uma tabela de comentários com um campo "é público?". Ele é o que mais dá vontade de fazer e o que mais não se pode: com sinalizador, vazar é esquecer um filtro numa consulta; com tabelas separadas, vazar exige escrever uma consulta que não existe. E sem teste automático vigiando, a estrutura precisa carregar essa garantia sozinha.
    anchor: report_internal_comments
    position: { x: 566, y: 1688 }
    width: 380
    inherited: true
  - text: |-
      O evento passa a ter autor

      A mesma tabela guarda ação de quem é do time e ação de quem vem de fora, e por isso a coluna é anulável: o relato criado pelo widget e a visualização feita por quem relatou não têm usuário por trás. Autor vira coluna, e não campo dentro do payload, porque "quem moveu mais cards" não pode virar varredura de texto numa tabela que só cresce.
    anchor: events
    anchorField: user_id
    position: { x: 2364, y: 1120 }
    width: 380
    inherited: true
  - text: |-
      Estado desativado não some

      Desativar deixa de aceitar card novo; apagar quebraria o histórico de todo card que já passou por ele. Por isso deactivated_at é coluna própria, separada de deleted_at. E o estado que é porta de entrada de algum tipo de relato (project_report_types.initial_state_id) não pode ser desativado enquanto o tipo apontar para ele — nem o de um tipo desativado, que, reativado, traria o problema de volta.
    anchor: project_states
    anchorField: deactivated_at
    position: { x: 67, y: 820 }
    width: 340
    inherited: true
  - text: |-
      Renomear não reescreve o passado

      O histórico mostra o nome que o estado tinha quando o card passou por ele, e é por isso que o nome vai no payload do evento além do id. Sem isso, renomear "Análise" para "Triagem" mudaria a história de todos os cards antigos de uma vez.
    anchor: project_states
    anchorField: name
    position: { x: 70, y: 669 }
    width: 340
    inherited: true
  - text: |-
      N para 1, e nunca o contrário

      Vários estados internos caem numa mesma etapa pública — "Code Review", "QA" e "Aguardando merge" viram "Em correção". O caminho inverso não existe, e não por falta de espaço no modelo: um estado apontando para duas etapas tornaria a tradução ambígua, e qual delas valeria dependeria da ordem da consulta.
    anchor: project_status_mappings
    position: { x: 900, y: 2480 }
    width: 380
    inherited: true
  - text: |-
      Versão é retrato do conjunto, não a diferença

      Alterar o mapeamento não toca em linha nenhuma das versões anteriores: são elas que explicam por onde um relato de três meses atrás passou. Guardar só o que mudou economizaria linhas e cobraria o preço na leitura — reconstruir o mapa de uma época viraria somar alterações desde o começo, e um erro no meio dessa soma devolveria um mapa errado com cara de certo.
    anchor: project_status_mappings
    anchorField: version
    position: { x: 1430, y: 2260 }
    width: 400
    inherited: true
  - text: |-
      Por que o número da versão mora em projects

      Parece que bastaria o maior valor desta tabela, e não basta: o cliente que desfaz todos os mapeamentos grava uma versão sem nenhuma linha. Calculada pelo maior valor, essa versão seria invisível, e a anterior voltaria a valer sozinha, sem ninguém ter pedido.
    anchor: projects
    anchorField: mapping_version
    position: { x: 1700, y: 450 }
    width: 380
    inherited: true
  - text: |-
      Terminal não quer dizer encerrado

      is_terminal marca onde o trabalho do time acaba. Depois dela ainda vem a confirmação de quem relatou, que é ação da pessoa e não estado do time — e é por isso que terminal é uma marca, e não "a última posição da lista": o passo seguinte cabe sem mexer nesta tabela. Mais de uma etapa pode ser terminal, e é assim que uma jornada acomoda finais diferentes.
    anchor: project_public_stages
    anchorField: is_terminal
    position: { x: -220, y: 2380 }
    width: 380
    inherited: true
  - text: |-
      O desfecho é nosso, o texto é do cliente

      O rótulo e a frase são escritos por quem conhece o próprio usuário. O desfecho não: é uma lista curta e fixa, porque cada equipe inventando o próprio vocabulário de encerramento traria de volta o jargão que esta camada existe para esconder. São quatro porque são os quatro finais que um relato tem — sem os três últimos, o relato que não vai ser feito fica pendurado esperando um fim que nunca chega.
    anchor: project_public_stages
    anchorField: outcome
    position: { x: -220, y: 2700 }
    width: 380
    inherited: true
  - text: |-
      Aqui se remove, nos estados internos só se desativa

      Não é descuido. O estado interno desativado precisa continuar visível porque a tela do time mostra a fila inteira; a etapa pública removida não tem esse papel — o que já passou por ela é contado pelos eventos, que guardam o rótulo que valia na época. A remoção é lógica, então a linha continua no banco.
    anchor: project_public_stages
    anchorField: deleted_at
    position: { x: 240, y: 2700 }
    width: 380
    inherited: true
  - text: |-
      Duas linhas do tempo, e não uma com um campo dizendo qual é

      events ganha dois tipos: report_public_stage_changed, que conta o que quem relatou viu, e report_public_stage_unmapped, que registra que a jornada não andou porque o estado está fora do mapa. Elas não andam no mesmo ritmo que a mudança interna — um movimento do time costuma não mover a jornada pública. Juntá-las num registro só obrigaria a análise a adivinhar qual das duas cada linha conta, e essa é exatamente a pergunta de pesquisa.
    anchor: events
    anchorField: type
    position: { x: 2625, y: 1312 }
    width: 400
    inherited: true
  - text: |-
      O evento de tradução carrega a versão do mapa

      Além dos rótulos que valiam na época, o payload guarda qual versão do mapeamento decidiu aquele movimento. Sem ela, recontar um movimento antigo usaria o mapa de hoje e devolveria outra história — e não haveria como perceber, porque o dado necessário para perceber seria justamente o que faltou.
    anchor: events
    anchorField: payload
    position: { x: 2570, y: 1539 }
    width: 400
    inherited: true
  - text: |-
      Encerramento não é comentário

      Ele acontece uma vez por fechamento, carrega um dos quatro desfechos e tem resposta de quem relatou. Comentario e conversa: muitos por relato, sem desfecho e sem consequencia.

      Se morasse na tabela de comentários, a pergunta "quantos fecharam como não será feito, e o relator aceitou?" viraria "procure o comentário que por acaso é um encerramento" — o sinalizador dentro da tabela que este projeto já recusou duas vezes.
    anchor: report_closures
    position: { x: 1097, y: 2309 }
    width: 400
    inherited: true
  - text: |-
      Recusar opinar não é ausência de opinião

      São três estados, e não dois: respondeu de 1 a 5, recusou clicando em "prefiro não responder", ou nunca respondeu.

      Por isso a nota é anulável e existe a marca de recusa ao lado. Guardar só "nota nula" juntaria os dois últimos, e um é escolha enquanto o outro é ausência — a métrica pareceria precisa sem ser.

      Na tela vale a mesma separação: a recusa fica fora da escala, nunca como sexta estrela ou zero, senão ela vira a nota mais baixa para quem lê depressa.
    anchor: report_closures
    anchorField: satisfaction_declined
    position: { x: 1838, y: 2563 }
    width: 400
    inherited: true
  - text: |-
      A espera é o que torna o desfazer possível

      O time move às 14h com espera de 30 minutos, e a página pública só muda às 14h30. Se alguém moveu sem querer, há janela para voltar atrás antes de a pessoa lá fora ver.

      Sem espera, a jornada pública anda na mesma transação do movimento interno. Com espera, o movimento interno grava na hora e o lado público é agendado.
    anchor: reports
    anchorField: public_stage_due_at
    position: { x: 1926, y: 980 }
    width: 380
    inherited: true
  - text: |-
      O projeto dita as regras, e o padrão já funciona

      Quase tudo do ciclo é configuração, e não regra fixa. Mas projeto novo precisa andar sem ninguém abrir esta tela: os padrões vivem no código, e a linha só nasce quando alguém salva.

      É a mesma escolha da jornada pública — o cliente desenha, e o conjunto de fábrica existe para ninguém encarar tela em branco.
    anchor: project_cycle_settings
    position: { x: 2559, y: 2239 }
    width: 400
    inherited: true
  - text: |-
      A escolha de responder e de quem relata

      Não é configuração do projeto: o projeto só decide como a opção vem marcada. Quem relatou um defeito às pressas pode não querer virar parte da investigação.

      Desmarcado, o time não consegue abrir pedido de informação naquele relato — e encerrar por falta de resposta não se aplica a quem nunca aceitou responder.
    anchor: reports
    anchorField: accepts_questions
    position: { x: 595, y: 1424 }
    width: 380
    inherited: true
  - text: |-
      Identidade e visibilidade na mesma tabela

      Parecem dois assuntos vizinhos e não são: o modo de identificação decide o que a visibilidade pode ser. Sem identidade não existe "o meu relato", então não existe "só os meus" para escolher, e público identificado não tem nome nenhum a mostrar.

      Em duas tabelas a regra teria de ser conferida lendo as duas, e a tela ofereceria uma combinação que a regra não permite — o erro apareceria só na hora de salvar.
    anchor: project_identity_settings
    position: { x: 3400, y: 300 }
    width: 400
    inherited: true
  - text: |-
      Gravar público ainda não publica nada

      Marcar o projeto como público não torna relato nenhum visível: a lista pública só devolve o que passou pela fila de moderação.

      A ordem é deliberada. Se o campo sozinho publicasse, mudar esta configuração jogaria na rua todo o texto livre já escrito — e texto livre é onde aparece documento, número de pedido e print com dado de terceiro.
    anchor: project_identity_settings
    anchorField: visibility
    position: { x: 3400, y: 640 }
    width: 400
    inherited: true
  - text: |-
      Todo relato nasce pending, inclusive em projeto privado

      Tenta-se economizar: projeto privado não publica, logo não precisaria de fila. E é exatamente aí que mora o acidente — no dia em que alguém marca o projeto como público, o backlog inteiro passaria a estar aprovado por nunca ter sido perguntado.

      Nascer pending custa uma coluna e evita uma publicação em massa que ninguém autorizou.
    anchor: reports
    anchorField: moderation_state
    position: { x: 1780, y: 760 }
    width: 400
    inherited: true
  - text: |-
      Perguntar o nome não é publicar o nome

      São três travas em série, e todas precisam estar abertas: o projeto pergunta o nome, o projeto está em público identificado, e a pessoa marcou que quer assinar aquele relato.

      Qualquer uma fechada, o nome fica interno — o time vê, o lado de fora não. É por isso que "anônimo com campo de nome" não existe aqui: o modo se chama sem login, porque coletar nome já é tratar dado pessoal.
    anchor: reports
    anchorField: reporter_name
    position: { x: 1780, y: 1120 }
    width: 400
    inherited: true
  - text: |-
      Nunca se pergunta se um código existe

      Sugerir outro código só quando o primeiro está ocupado é dizer que ele está ocupado, e qualquer diferença entre livre e ocupado vira uma forma de enumerar o código alheio.

      Por isso o código é sorteado inteiro, nunca escolhido, e código desconhecido na rota pública não é recusado: vira um código novo.

      Na geração existe uma consulta, e ela não conta nada: o candidato é sorteado por nós, e a colisão é conferida antes de gravar. A diferença que importa é quem escolheu o valor consultado.
    anchor: reporter_codes
    anchorField: code
    position: { x: 3400, y: 1000 }
    width: 400
    inherited: true
  - text: |-
      A configuração vem antes do widget

      É ela que diz o que existe. Ligar anexo, as duas categorias — imagem e arquivo —, os limites de cada uma, os formatos do arquivo, se o botão de capturar aparece e se dá para anexar ao responder e ao reabrir: tudo é do dono do projeto. Projeto que nunca abrir esta tela continua funcionando, com os padrões que moram no código.
    anchor: project_media_settings
    position: { x: 3480, y: 1300 }
    width: 340
    inherited: true
  - text: |-
      Um tipo por linha, e não uma coluna por tipo

      Com colunas, acrescentar áudio custaria migração, e toda linha carregaria campos de tipos que aquele projeto nunca ligou. Com linhas, o tipo novo é um INSERT — e cada um leva os limites que fazem sentido para ele, sem obrigar os outros a ter os mesmos.
    anchor: project_media_kinds
    position: { x: 3480, y: 1820 }
    width: 340
    inherited: true
  - text: |-
      O arquivo não está aqui, e nunca vai estar

      O que a linha guarda é o nome dele no armazenamento. Os bytes vão do navegador direto para lá, sem passar pela API — passar custaria carregar megabytes na memória do servidor duas vezes, sem ganhar nada.

      Tudo que não são os bytes passa pela API: pedir a permissão, aplicar o limite do projeto, contar tentativa e confirmar que o anexo existe.
    anchor: report_attachments
    position: { x: 1870, y: 1180 }
    width: 380
    inherited: true
  - text: |-
      O vídeo saiu, e as linhas ficaram

      Pesava demais no armazenamento e na entrega. Nenhum projeto configura vídeo, e a API recusa pedir um. O valor video continua no tipo, e as linhas antigas — limite e anexo — continuam carregando: os vídeos já confirmados seguem listados e tocando.
    anchor: project_media_kinds
    anchorField: kind
    position: { x: 3480, y: 2200 }
    width: 340
    inherited: true
  - text: |-
      O arquivo é uma categoria, e só baixa

      O que não é imagem sai de um catálogo fechado — PDF, texto e log, planilha, documento, JSON; zip não —, reconhecido pela extensão, com os bytes conferidos onde o formato deixa. Nasce desligado. A leitura é sempre download, com um nome genérico do lado de fora e o original no painel: o que há dentro não roda em lugar nenhum.
    anchor: project_media_kinds
    anchorField: formats
    position: { x: 3480, y: 2520 }
    width: 340
    inherited: true
  - text: |-
      O tamanho de exibição é uma fração, e não pixels

      Quem relata monta o relato como quer que ele seja lido: a imagem logo abaixo do texto, num terço, na metade, em três quartos ou na linha inteira. Fração da largura do texto, para caber igual no quadro, no acompanhamento e no painel.
    anchor: report_attachments
    anchorField: display_size
    position: { x: 1870, y: 1900 }
    width: 340
    inherited: true
  - text: |-
      Pendente é a regra, não a exceção

      Gente anexa e desiste de escrever o tempo todo, e o arquivo já está no armazenamento quando isso acontece. Por isso a linha nasce pending e só vira confirmed quando a API prende o anexo ao relato — sem esse estado, não haveria como saber depois o que pertence a alguém e o que é lixo.
    anchor: report_attachments
    anchorField: status
    position: { x: 2409, y: 1900 }
    width: 340
    inherited: true
  - text: |-
      Quem enxerga o quê

      A cada requisição, o acesso é montado assim: todos os projetos da conta própria, como dono — que é administrador —, e os projetos em que a pessoa tem linha aqui, com o papel. O filtro global de todas as tabelas de dado olha essa lista de projetos, e não mais a conta. Sair do projeto vale na requisição seguinte, sem esperar o login vencer.
    anchor: project_members
    position: { x: 1180, y: -300 }
    width: 360
    inherited: true
  - text: |-
      O link do convite nunca é guardado

      Ele nasce na hora de montar o e-mail, e o banco fica só com o hash — o mesmo cuidado da chave secreta do projeto. Quem lê o banco não aceita convite de ninguém, reenviar troca o hash e invalida o link anterior, e aceitar ainda exige o Google do mesmo endereço, confirmado: encaminhado, o link não serve para outra pessoa.
    anchor: project_invitations
    anchorField: token_hash
    position: { x: -60, y: -560 }
    width: 360
    inherited: true
  - text: |-
      O card do time nunca tem lado de fora

      Ele mora em reports junto do relato, e duas travas no banco separam os dois: o relato continua obrigado a ter protocolo, token, tipo e texto; o card do time não pode ter protocolo, token, código pessoal, etapa pública nem espera, e só fica pendente na moderação. As portas públicas acham relato pelo protocolo, pelo código pessoal ou por estar liberado — o card do time não tem nenhum dos três.
    anchor: reports
    anchorField: kind
    position: { x: 1700, y: 760 }
    width: 360
    inherited: true
  - text: |-
      A pergunta vem copiada, e não apontada

      O time muda as perguntas do tipo quando quiser, e o relato de ontem precisa continuar dizendo o que foi perguntado ontem — a resposta "no celular" só faz sentido ao lado da pergunta que a pediu. Por isso answers guarda o par inteiro, pergunta e resposta, e não o lugar da pergunta na lista do tipo. É o mesmo cuidado do nome do estado no evento: o que valia na época fica junto do que aconteceu na época.
    anchor: reports
    anchorField: answers
    position: { x: 880, y: 960 }
    width: 330
    inherited: true
  - text: |-
      O texto continua sendo o relato inteiro

      Com perguntas, o relato chega em pedaços, e quase tudo que o lê não precisa saber disso: a busca, o título que sai do começo do texto, o trecho da lista pública e a varredura de dado sensível continuam lendo text, que junta as respostas que vieram, e a caixa livre no fim. answers serve a quem mostra cada resposta debaixo da sua pergunta — o card aberto no painel e a página de acompanhamento.
    anchor: reports
    anchorField: text
    position: { x: 880, y: 1195 }
    width: 330
    inherited: true
  - text: |-
      O tipo sempre pede alguma coisa

      Sem pergunta e sem caixa, o formulário não teria onde a pessoa escrever — e o banco recusa esse tipo, numa trava, como recusa a caixa que aparece sem o texto dela e a quinta pergunta: quatro respostas curtas ainda cabem no quadro sem rolar, a quinta vira questionário. O serviço confere o resto: ao menos um tipo ativo, porque todo relato precisa de um, e no máximo dez, porque eles viram botões lado a lado — passando disso, deixa de ser escolha e vira lista para ler.
    anchor: project_report_types
    anchorField: shows_text_box
    position: { x: -60, y: 1460 }
    width: 360
    inherited: true
  - text: |-
      A coluna de entrada mora no tipo

      A escolha de onde cada tipo entra era uma tabela à parte, project_initial_states, uma linha por valor da lista fixa. Com o tipo sendo do projeto, ela virou um campo dele, e a tabela saiu — a migração copiou a escolha de cada projeto para o seu tipo. Nulo continua querendo dizer "não configurei": o relato entra na primeira coluna ativa. E aposentar a coluna que é entrada de algum tipo é recusado, contando os desativados.
    anchor: project_report_types
    anchorField: initial_state_id
    position: { x: -60, y: 1720 }
    width: 360
    inherited: true
  - text: |-
      Variável só depois de enviar

      É na confirmação e no topo do acompanhamento que existem o nome, o protocolo, o tipo e a etapa; num botão ou numa pergunta, a variável nunca teria valor. A gravação recusa variável fora desses dois, nome que não existe e {{etapa}} na confirmação. O banco guarda o texto como foi escrito, e quem troca é a tela que o mostra, como texto puro — o valor é o que a pessoa digitou no nome. O nome do projeto, que é interno, só sai quando o texto usa {{projeto}}.
    anchor: project_widget_settings
    anchorField: tracking_intro
    position: { x: 2409, y: -300 }
    width: 360
    inherited: true
  - text: |-
      Botão só de ícone precisa de ícone

      Sem o texto, o ícone é tudo o que diz o que o botão faz — um botão vazio no canto do site não diz nada. O banco recusa a linha com só o ícone, no computador ou só no celular, e nenhum ícone escolhido; o serviço recusa antes, com a mensagem, e a tela escolhe o balão quando a pessoa marca "só o ícone" sem ícone. O texto não some: vira a dica e o nome que o leitor de tela anuncia.
    anchor: project_widget_settings
    anchorField: launcher_icon_only
    position: { x: 2830, y: 180 }
    width: 360
    inherited: true
  - text: |-
      A ferramenta compara a página, o banco só guarda a lista

      O caminho da página só existe no navegador de quem visita. A lista sai na leitura pública, e a ferramenta compara — sem diferença de maiúscula nem da barra do fim —, e numa página da lista o quadro nunca pede para aparecer, como a ferramenta desligada. A regra mora num lugar só, que o carregador também alcança. O banco guarda a lista conferida: começo com barra, sem ? nem #, e o * só no fim.
    anchor: project_widget_settings
    anchorField: hidden_paths
    position: { x: 2830, y: 520 }
    width: 360
    inherited: true
  - text: |-
      O bloqueio vale sozinho, e vence

      A lista de autorizados diz o que entra direto; a de bloqueados, o que é recusado. Fora das duas, o relato espera liberação. A de bloqueados é a reação a um estranho que apareceu em "Aguardando liberação" ou na lista de quem mandou relatos. As rotas da ferramenta leem os bloqueados primeiro, do banco e sem cache, a cada pedido — bloquear vale no próximo relato. O domínio conferido vem do navegador sempre que dá; fora dele continua declarado, e por isso o bloqueio é grade, e não muro.
    anchor: project_blocked_origins
    position: { x: 1906, y: -300 }
    width: 360
    inherited: true
  - text: |-
      A marca não é coluna, a decisão é

      Bloquear marca na hora todos os relatos que já vieram do domínio, e desbloquear desmarca, sem reescrever linha nenhuma: a marca sai de comparar origin com a lista de agora. O que se guarda é só a decisão de manter (blocked_origin_kept_at), que vale para sempre. A outra decisão, apagar de vez, é exclusão real — sai o relato, as subtarefas e tudo que identifica quem relatou, com os anexos no armazenamento —, e não deixa linha; os eventos ficam, sem o relato e sem o caminho da página.
    anchor: reports
    anchorField: blocked_origin_kept_at
    position: { x: -520, y: 1000 }
    width: 360
    inherited: true
  - text: |-
      Fora da lista, retido — e não recusado

      O relato de um domínio que a lista de autorizados não cobre chega como qualquer outro: protocolo, acompanhamento, etapa pública. Só o time não o vê, porque o filtro global esconde held_for_origin_at preenchido de toda leitura do painel — nenhuma consulta precisa lembrar. Recusar faria o domínio novo nunca aparecer; aceitar direto, como a lista vazia fazia, deixava entrar o relato de quem copiou a chave. O sino pergunta uma vez por domínio, e o domínio do próprio painel nunca espera.
    anchor: reports
    anchorField: held_for_origin_at
    position: { x: -520, y: 1400 }
    width: 360
    inherited: true
  - text: |-
      Os números moram aqui, as contagens não

      Contar por IP exigiria guardar IP, e o sistema não guarda IP em tabela nenhuma. As janelas — 10 minutos para a pessoa, uma hora para IP, domínio e projeto, 24 horas para o dia — contam o relato aceito na memória do processo: certas com uma instância da API, zeradas quando ela reinicia. O desafio é uma conta de SHA-256 que o navegador resolve em um ou dois segundos, com bilhete assinado, de dois minutos e uso único; nenhum serviço de fora.
    anchor: project_report_limits
    position: { x: 3400, y: -340 }
    width: 360
    inherited: true
  - text: |-
      Assimétrica de propósito

      O cliente guarda a chave privada, e o projeto só a pública: o servidor dele assina quem é a pessoa num crachá curto — um JWT ES256 dedicado, nunca o login dela —, o site o põe no script, e a API confere a assinatura sem chamar o sistema dele. Assinar com a chave secreta do projeto era inviável, porque o banco guarda só o hash dela, e seria pior: com a pública, um vazamento do nosso banco não permite forjar identidade nenhuma, nem por nós. O alg é fixo em ES256, o aud é a chave pública do projeto e o exp fica dentro do teto; iss e jti não são conferidos.
    anchor: project_identity_settings
    anchorField: identity_public_key
    position: { x: 3850, y: -340 }
    width: 400
    inherited: true
  - text: |-
      Sem crachá, o projeto decide; fora do modo, o crachá é ignorado

      Quem não está na conta fica sem o atributo no script. Com a exigência desligada, o relato entra como protocolo, sem identidade, e a resposta diz que não reconheceu a pessoa; ligada, é recusado — e o quadro avisa antes de a pessoa escrever. Já o crachá num projeto que não usa o modo é ignorado, e não recusado como o código pessoal é: o código é digitado pela pessoa, e o atributo pode ter ficado na página depois de o projeto trocar de modo — recusar derrubaria todo relato daquele site por uma configuração antiga.
    anchor: project_identity_settings
    anchorField: identity_required
    position: { x: 4300, y: -340 }
    width: 400
    inherited: true
  - text: |-
      A mesma linha, e só um hash da pessoa

      A pessoa do sistema do cliente mora na tabela do código pessoal, e não numa tabela nova: a lista e a porta de leitura funcionam pelo mesmo vínculo, reporter_code_id em reports; o limite por pessoa usa o mesmo hash, na memória do processo, antes mesmo de a linha existir. O código da linha é sorteado como sempre e ninguém o vê; o que a liga à pessoa é o hash do sub com o sal do projeto. Quem abre o banco não descobre quem ela é no sistema do cliente — e o sal não muda nunca, porque trocá-lo faria toda pessoa virar outra.
    anchor: reporter_codes
    anchorField: subject_hash
    position: { x: 4750, y: -340 }
    width: 400
    inherited: true
  - text: |-
      A busca compara, e não calcula

      O card guarda o texto já dobrado — sem acento e em minúsculas — numa coluna que o banco gera a cada gravação. Antes, cada busca refazia essa conta em cada card do projeto; agora só compara. A tabela de letras é a mesma da busca: mudar uma letra lá muda a coluna, e a migração que a refaz sai sozinha.
    anchor: reports
    anchorField: searchable_text
    position: { x: 700, y: 1500 }
    width: 380
  - text: |-
      Os eventos sem as chaves da conta e do projeto

      Com a chave, cada evento gravado travava a linha da conta e a do projeto para conferir que elas existem — e, com o time inteiro gravando, essas duas linhas eram as mais disputadas do banco. Nada apaga conta ou projeto (a exclusão é lógica), então a chave nunca agia. account_id e project_id ficam, com os índices da pesquisa; as chaves do relato e do autor ficam também.
    anchor: events
    position: { x: 2300, y: 1650 }
    width: 400
