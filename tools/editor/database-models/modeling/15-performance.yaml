  - name: project_identity_settings
    label: Identidade e visibilidade
    description: "Tem as quatro colunas do modo inherited_identity: a chave pública do sistema do cliente, o sal com que o sub do crachá vira o hash da pessoa, a validade máxima do crachá e a exigência dele. Como quem abre um relato é reconhecido neste projeto, e o que isso permite na visibilidade. Uma linha por projeto, criada só quando alguém salva — os padrões vivem no código, e projeto sem linha é projeto que nunca precisou mudar nada. Os dois assuntos moram juntos de propósito: o modo de identificação decide o que a visibilidade pode ser."
    inherited: true
    position: { x: 2950, y: 300 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da configuração, único entre os não apagados, e é o que faz o 1:1
      - name: mode
        type: enum
        required: true
        note: protocol | personal_code | inherited_identity — excludentes, porque cada um responde de um jeito diferente à pergunta "quem é você". Trocar de modo não reescreve o passado
      - name: visibility
        type: enum
        required: true
        note: private | public_anonymous | public_identified — o padrão é private, e public_identified só vale onde o modo identifica, porque sem identidade não há nome nenhum a mostrar
      - name: asks_for_name
        type: bool
        required: true
        note: se a ferramenta pergunta o nome de quem relata; desligado de fábrica, porque coletar dado pessoal precisa ser um ato de quem configura, e não o que acontece por omissão
      - name: identity_public_key
        type: text
        note: "a chave pública do sistema do cliente (ECDSA P-256, SPKI em base64 numa linha, até 512; a tela aceita o PEM colado, e a API o limpa), lida só no modo inherited_identity: o servidor dele assina quem é a pessoa com a chave privada, e a API confere a assinatura sem nunca chamar o sistema dele. Nula até o cliente colar a dele, e obrigatória para salvar o modo herdado; fica guardada nos outros modos, para a volta. É pública — nunca segredo"
      - name: identity_subject_salt
        type: text
        note: o sal (32 bytes em base64) com que o sub do crachá vira o subject_hash de reporter_codes; nasce junto da primeira chave, nunca sai na leitura e não muda, porque mudar faria toda pessoa virar outra
      - name: identity_token_max_minutes
        type: int
        required: true
        note: por quantos minutos, no máximo, um crachá do sistema do cliente pode valer, de 1 a 60 (padrão 15); crachá de vida maior é recusado, porque seria um token de login disfarçado
      - name: identity_required
        type: bool
        required: true
        note: "no modo inherited_identity, o que fazer com o relato sem crachá, ou com crachá que não confere: ligado, recusa e pede para entrar na conta; desligado (padrão), aceita como protocolo, sem identidade — relato perdido é pior que relato sem lista"
      - name: created_at
        type: datetime
        note: quando a configuração foi salva a primeira vez, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a configuração vale, preenchido no lugar de apagar
  - name: project_report_limits
    label: Limites de relato
