        note: nulo enquanto a autorização vale, preenchido no lugar de apagar
  - name: project_blocked_origins
    label: Domínios bloqueados
    description: "Existe para o cliente fechar a porta para um domínio que não é dele — quem copiou a chave pública para outro site — sem precisar declarar antes todos os próprios. Recusa na hora, nas rotas da ferramenta, e bloquear apaga de vez os relatos retidos do domínio. O bloqueio vence a autorização, e as duas listas nunca se contradizem: bloquear tira o domínio da de autorizados, e autorizar tira daqui. Até cem por projeto."
    inherited: true
    position: { x: 1906, y: 60 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto que bloqueia este domínio
      - name: domain
        type: text
        required: true
        note: normalizado como em project_origins — minúsculo, sem esquema e sem barra final, com a porta quando informada —, único no projeto entre os não desbloqueados
      - name: includes_subdomains
        type: bool
        required: true
        note: quando verdadeiro barra também app. e loja. na frente; nasce desligado, porque barrar os vizinhos sem pedir pode tirar do ar um site do próprio cliente
      - name: blocked_by_user_id
        type: long
        fk: true
        note: quem bloqueou; nulo quando a conta da pessoa for esvaziada, e o bloqueio continua valendo sem ela
      - name: created_at
        type: datetime
        note: quando o domínio foi bloqueado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
