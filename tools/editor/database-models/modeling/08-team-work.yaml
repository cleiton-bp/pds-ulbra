meta:
  title: O time
  description: "Quem do time entra em cada projeto, e com que papel. A entrada é por projeto, e não pela conta: a mesma pessoa pode estar em projetos de várias contas, e o dono da conta manda em todos os projetos dela sem linha nova. Quem entra chega por convite: o administrador convida por e-mail, e a pessoa aceita entrando com o Google do mesmo endereço. E o card do time entra na tabela do relato: todo card ganha um número curto no projeto, e se arquiva. E o card ganha o título de quem relatou, responsável, prioridade, etiquetas e prazo, com as prioridades e as etiquetas do projeto. E o quadro: a ordem de cada coluna, que é do time inteiro, e quando o card entrou na coluna em que está. Montado sobre o que já existe, que aparece sem alteração, menos: accounts, que deixa de ser a fronteira de isolamento; users e projects, cujo account_id muda de sentido — e projects ganha o contador do número do card e o topo do quadro; reports, que passa a guardar os dois tipos de card; e as regras do ciclo e da ferramenta, que ganham o arquivar relato, a pergunta do título e as duas regras do quadro."
entities:
  - name: base_columns
    label: Colunas padrão
    description: Não é tabela, é o conjunto de colunas que toda tabela do sistema repete, desenhado aqui uma vez para não precisar explicar em cada uma delas.
    inherited: true
    position: { x: 556, y: 162 }
    fields:
      - name: id
