        note: nulo enquanto a autorização vale, preenchido no lugar de apagar
  - name: project_widget_settings
    label: Configuração da ferramenta
    description: Existe para a aparência e os textos do quadro serem escolha do cliente sem ninguém editar o HTML do site dele. É 1:1 com o projeto, e projeto sem linha responde com os padrões em vez de erro. Já existe no banco e não estava em modelagem nenhuma, e aparece aqui para o desenho bater com o que está no ar. Nesta modelagem ganha a pergunta do título (report_title_mode).
    inherited: true
    position: { x: 2409, y: 180 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da configuração, único entre os não apagados, e é o que faz o 1:1
      - name: is_enabled
        type: bool
        required: true
        note: tira a ferramenta do site do cliente sem ninguém mexer no HTML dele
      - name: accent_color
        type: text
        note: "#rrggbb minúsculo, e nulo é um valor: quer dizer o acento do produto"
      - name: position
        type: enum
        required: true
        note: bottom_right | bottom_left, o canto onde o gatilho fica parado
      - name: theme
        type: enum
        required: true
        note: auto | light | dark, e auto segue quem visita o site, não quem o configurou
      - name: launcher_label
        type: text
        required: true
        note: o texto do botão parado na página
      - name: title
        type: text
        required: true
        note: o título do formulário aberto
      - name: placeholder
        type: text
        required: true
        note: o texto da caixa vazia, que é onde se faz a pergunta certa
      - name: success_message
        type: text
        required: true
        note: a mensagem da tela de confirmação
      - name: shows_type_field
        type: bool
        required: true
        note: se o seletor de tipo aparece para quem relata
      - name: default_report_type
        type: enum
        required: true
        note: o tipo pré-marcado, e o único quando o seletor está escondido
      - name: report_title_mode
        type: enum
        required: true
        note: coluna nova — optional | required | hidden, como a ferramenta pergunta "em poucas palavras, o que aconteceu?". Opcional de fábrica; obrigatória, a API recusa o relato sem resposta
      - name: created_at
        type: datetime
        note: quando a configuração foi salva pela primeira vez, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a configuração vale, preenchido no lugar de apagar
  - name: project_states
    label: Estados do projeto
    description: A tabela que não pode ser cortada. Existe porque os estados precisam ser criados pelo cliente, como as colunas de um quadro Kanban — se fossem fixos, definidos por nós, o motor de tradução viraria mapear os nossos estados nas nossas próprias etapas públicas, e o trabalho perderia justamente o peso técnico que o README aponta.
    inherited: true
    position: { x: 560, y: 700 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono do estado, porque a fila de trabalho é de cada sistema e não da conta
      - name: name
        type: text
        required: true
        note: o nome que o time deu, como Análise ou Corrigindo, único no projeto entre os não apagados, e renomear não reescreve o passado porque o evento guarda o nome que valia na época
      - name: position
        type: int
        required: true
        note: a ordem na tela, escolhida pelo cliente, e é coluna em vez de ordem alfabética porque fila de trabalho tem sequência
      - name: deactivated_at
        type: datetime
        note: nulo enquanto o estado aceita card novo, preenchido para aposentá-lo sem apagar, porque card antigo continua apontando para ele e o histórico precisa continuar legível
      - name: created_at
        type: datetime
        note: quando o estado foi criado, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o estado vale, preenchido no lugar de apagar
  - name: project_initial_states
    label: Onde cada tipo entra
    description: Existe porque o lugar onde o relato cai é escolha do cliente, e pode ser diferente por tipo. O time que quer tudo no backlog aponta os três tipos para o mesmo estado; o que separa defeito de melhoria aponta cada um para o seu. É tabela em vez de três colunas em projects para tipo novo não pedir migração.
    inherited: true
    position: { x: 446, y: 1129 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto a que esta regra pertence
      - name: report_type
        type: enum
        required: true
        note: bug | improvement | question, único por projeto entre os não apagados, e é a chave da escolha
      - name: project_state_id
        type: long
        fk: true
        required: true
        note: o estado onde um relato deste tipo cai ao entrar, e ele precisa ser do mesmo projeto
      - name: created_at
        type: datetime
        note: quando a regra foi definida, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a regra vale, preenchido no lugar de apagar
  - name: reports
    label: Relatos e cards
    description: Já existia, e passa a guardar todo card do trabalho do time — o relato, que chegou de fora, e o card do time, que nasceu no painel (kind). Ganha o número curto do projeto, o título e a descrição do card do time, quem o criou e o arquivamento; protocolo, token, tipo e texto ficam nulos no card do time, e duas travas no banco separam os dois tipos. E ganha o título que quem relatou escreveu, o responsável, a prioridade e o prazo — tudo interno, menos o título dela, que volta só para ela. E o lugar no quadro e quando entrou na coluna. E o pai, quando o card é subtarefa.
    inherited: true
    position: { x: 1237, y: 893 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador usado na URL do painel
      - name: kind
        type: enum
        required: true
        note: coluna nova — report | team. O relato veio de fora, pela ferramenta; o card do time nasceu no painel e nunca tem lado de fora
      - name: number
        type: int
        required: true
        note: coluna nova — o número curto do card no projeto (#42), interno, separado do protocolo. Único por projeto, inclusive entre os apagados; vem de projects.last_card_number, pode pular e nunca repete
      - name: title
        type: text
        note: coluna nova — o título do time, uma linha. Obrigatório no card do time; no relato, o que o time reescreveu, nulo até alguém reescrever. Interno
      - name: reporter_title
        type: text
        note: coluna nova — o título que a pessoa escreveu na ferramenta, respondendo "em poucas palavras, o que aconteceu?". Nunca muda, e é o único título que volta para ela. Nulo quando ela não respondeu, e sempre no card do time
      - name: description
        type: text
        note: coluna nova — a descrição do card do time, em Markdown, desenhada pelo painel sem HTML. Sempre nula no relato, cujo texto é de quem relatou
      - name: archived_at
        type: datetime
        note: coluna nova — quando o card saiu da tela de Trabalho; arquivado se le e se comenta, e mover ou editar pedem desarquivar
      - name: created_by_user_id
        type: long
        fk: true
        note: coluna nova — quem do time criou o card. Nulo no relato, porque quem escreveu não tem usuário aqui
      - name: assignee_user_id
        type: long
        fk: true
        note: coluna nova — quem do time está com o card, um só. Quem sai do time continua aqui como registro, e o painel o marca como fora do time
      - name: priority_id
        type: long
        fk: true
        note: coluna nova — a prioridade do projeto que o time escolheu. Nula é sem prioridade, e é como o card nasce
      - name: due_date
        type: date
        note: coluna nova — o prazo, só a data, sem hora. Nulo é sem prazo
      - name: parent_report_id
        type: long
        fk: true
        note: coluna nova — o card de que este é subtarefa; nulo no card que não é. Só o card do time é subtarefa, e ninguém é pai de si mesmo (duas travas no banco); um nível só, e o pai do mesmo projeto, o serviço confere. Arquivar o pai leva as subtarefas, com o mesmo instante em archived_at
      - name: sprint_id
        type: long
        fk: true
        note: coluna nova — a sprint do card; nula é o backlog. A subtarefa acompanha o pai (o serviço confere). Interno
      - name: story_points
        type: decimal
        note: coluna nova — a estimativa em pontos, de 0 a 999 com meio ponto (trava no banco); a subtarefa não leva. Interno
      - name: backlog_rank
        type: long
        required: true
        note: coluna nova — o lugar no backlog e nas listas das sprints, o menor em cima, com a folga do quadro; nasce com o número vezes a folga, e o card novo entra no fim
      - name: board_rank
        type: long
        required: true
        note: coluna nova — o lugar do card na coluna do quadro, o menor em cima. Só se compara dentro da mesma coluna, e tem folga entre vizinhos — pôr um card entre dois escolhe o meio, e só quando a folga acaba a coluna é renumerada. A ordem é do time inteiro, e arrumá-la não é evento
      - name: state_changed_at
        type: datetime
        required: true
        note: coluna nova — quando o card entrou na coluna em que está, ou voltou a ela (reaberto, ou tirado do arquivo pela resposta de quem relatou). É o que a última coluna do quadro usa para mostrar só o que entrou nela há pouco
      - name: account_id
        type: long
        fk: true
        required: true
        note: conta dona do relato, repetido de propósito em vez de chegar pelo projeto
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto de onde o relato veio, resolvido pela chave pública da requisição
      - name: project_state_id
        type: long
        fk: true
        note: onde o card está agora, e é cache, porque a verdade é a sequência de eventos e esta coluna existe só para a lista filtrar e contar sem reconstruir o histórico a cada consulta
      - name: project_public_stage_id
        type: long
        fk: true
        note: em que passo da jornada quem relatou vê este relato, nulo enquanto ele não aparece em nenhum, e é cache como o anterior porque a verdade é a sequência de eventos
      - name: tracking_code
        type: text
        unique: true
        note: o protocolo que a pessoa lê e repete, alfabeto sem 0, O, 1 e I, colisão tratada na geração. Passa a anulável — nulo no card do time, e o banco exige no relato
      - name: access_token_hash
        type: text
        note: hash do token que vai no link de acompanhamento, o valor original só existe na URL entregue. Nulo no card do time
      - name: type
        type: enum
        note: bug | improvement | question, e é ele que decide em qual estado o relato cai ao entrar. Nulo no card do time
      - name: text
        type: text
        note: o relato como a pessoa escreveu, com tamanho limitado no servidor. Nulo no card do time, que tem título e descrição
      - name: route
        type: text
        note: só o caminho da página de onde o relato foi aberto, sem query e sem fragmento
      - name: origin
        type: text
        note: domínio da página que embutiu o widget, declarado por ela e conferido contra a lista do projeto
      - name: accepts_questions
        type: bool
        note: 'quem relatou marcou se aceita responder dúvidas da equipe; desmarcado, o time nao consegue abrir pedido de informacao neste relato, e a tela diz o motivo. Anulável, e nulo é um terceiro estado: o relato que entrou antes de a pergunta existir, a quem ninguém perguntou nada — gravá-lo como "não aceita" seria pôr na boca da pessoa uma resposta que ela nunca deu'
      - name: public_stage_due_at
        type: datetime
        note: a partir de quando a mudanca de etapa publica vale para quem relatou; e a janela em que o time ainda pode desfazer, e nula quando nao ha espera configurada
      - name: reporter_code_id
        type: long
        fk: true
        note: o codigo pessoal de quem escreveu, quando o projeto usa esse modo. Nula no modo protocolo e em todo relato anterior ao modo existir, e esses continuam valendo pelo link de sempre
      - name: reporter_name
        type: text
