        required: true
        note: projeto dono da chave
      - name: type
        type: enum
        required: true
        note: public | secret, a pública identifica o projeto, a secreta autentica uma integração
      - name: value
        type: text
        note: só a pública fica em claro, porque ela viaja no HTML do site do cliente e precisa ser lida
      - name: hash
