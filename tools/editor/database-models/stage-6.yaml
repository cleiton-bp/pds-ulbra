    description: Existe para a aparência e os textos do quadro serem escolha do cliente sem ninguém editar o HTML do site dele. É 1:1 com o projeto, e projeto sem linha responde com os padrões em vez de erro. Já existe no banco e não estava em modelagem nenhuma, e aparece aqui para o desenho bater com o que está no ar.
