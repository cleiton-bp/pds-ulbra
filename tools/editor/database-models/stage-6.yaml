      - name: asks_for_name
        type: bool
        required: true
        note: se a ferramenta pergunta o nome de quem relata; desligado de fabrica, porque coletar dado pessoal precisa ser um ato de quem configura, e nao o que acontece por omissao
      - name: created_at
        type: datetime
        note: quando a configuracao foi salva a primeira vez, em UTC
      - name: updated_at
        type: datetime
        note: ultima alteracao, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a configuracao vale, preenchido no lugar de apagar
  - name: reporter_codes
    label: Codigo pessoal
    description: "O codigo que quem relata guarda para reencontrar os proprios relatos, no modo sem login. E tabela, e nao coluna em reports: o mesmo codigo vale para varios relatos, entao a unicidade dentro do projeto precisa de uma linha propria — como coluna repetida, o banco nao teria como exigi-la. Nao guarda nada de pessoa: sem nome, sem contato, sem dispositivo, e um identificador sorteado e nada mais."
