        note: quando o registro foi criado, em UTC
      - name: updated_at
        type: datetime
        note: ultima alteracao, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a configuracao vale, preenchida no lugar de apagar
  - name: project_identity_settings
    label: Identidade e visibilidade
    description: "Como quem abre um relato e reconhecido neste projeto, e o que isso permite na visibilidade. Uma linha por projeto, criada so quando alguem salva — os padroes vivem no codigo, e projeto sem linha e projeto que nunca precisou mudar nada. Os dois assuntos moram juntos de proposito: o modo de identificacao decide o que a visibilidade pode ser."
    position: { x: 2950, y: 300 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da configuracao, unico entre os nao apagados, e e o que faz o 1:1
      - name: mode
        type: enum
        required: true
        note: protocol | personal_code | inherited_identity — excludentes, porque cada um responde de um jeito diferente a pergunta "quem e voce". Trocar de modo nao reescreve o passado
      - name: visibility
        type: enum
        required: true
