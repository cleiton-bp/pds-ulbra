        note: nulo enquanto o projeto vale, preenchido no lugar de apagar
  - name: project_keys
    label: Chaves do projeto
    description: Existe para separar quem só aponta o projeto de quem prova ser o servidor do cliente, e guarda o histórico das revogadas porque saber quando cada chave valeu é o que permite investigar um incidente depois.
