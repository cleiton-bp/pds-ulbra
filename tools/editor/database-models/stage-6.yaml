        note: stars | number — como a escala de 1 a 5 aparece para quem relatou
      - name: satisfaction_required
        type: bool
        required: true
        note: se confirmar exige responder; mesmo exigindo, "prefiro nao responder" continua existindo, fora da escala
      - name: info_request_enabled
