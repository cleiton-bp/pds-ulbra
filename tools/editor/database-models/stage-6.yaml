      - name: code
        type: text
        required: true
        unique: true
        note: o codigo no formato do protocolo, sorteado inteiro pelo sistema, unico dentro do projeto entre os nao apagados; codigo apresentado de fora nunca e consultado para dizer se existe, porque qualquer diferenca entre livre e ocupado vira enumeracao
      - name: created_at
