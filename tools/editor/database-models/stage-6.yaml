relations:
  - from: reports
    fromField: id
    to: report_info_requests
    toField: report_id
    kind: one-to-many
    note: Um relato pode ser devolvido mais de uma vez, e cada devolução tem prazo próprio. A pergunta em si não mora aqui — mora num comentário público, porque a conversa acontece pelo próprio relato.
  - from: users
    fromField: id
    to: report_info_requests
    toField: asked_by_user_id
    kind: one-to-many
    note: "Obrigatório, ao contrário de closed_by_user_id: o sistema encerra sozinho no fim do prazo, mas nunca pergunta nada por conta própria."
  - from: accounts
    fromField: id
    to: users
    toField: account_id
    kind: one-to-many
    note: "Todo usuário pertence a uma conta, e é por esta ligação que o isolamento funciona: a sessão diz quem é o usuário, o usuário diz qual é a conta, e a conta filtra todo o resto."
  - from: accounts
    fromField: id
    to: projects
    toField: account_id
    kind: one-to-many
    note: Uma conta tem vários projetos, normalmente um por sistema, e projeto nunca é órfão.
  - from: projects
    fromField: id
    to: project_keys
    toField: project_id
    kind: one-to-many
    note: Um projeto tem uma chave pública e uma secreta válidas por vez, mais o histórico das revogadas.
  - from: projects
    fromField: id
    to: project_origins
    toField: project_id
    kind: one-to-many
    note: Um projeto autoriza vários domínios, porque o mesmo sistema vive em produção, em homologação e no domínio antigo que ainda redireciona.
  - from: projects
    fromField: id
    to: project_widget_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no máximo uma configuração de ferramenta, e projeto sem linha responde com os padrões — que moram em C#, e não como valor padrão de coluna, para existirem num lugar só.
  - from: projects
    fromField: id
    to: project_states
    toField: project_id
    kind: one-to-many
    note: Um projeto tem a própria fila de estados, e não a da conta, porque times diferentes dentro da mesma empresa trabalham sistemas diferentes de formas diferentes.
  - from: projects
    fromField: id
    to: project_initial_states
    toField: project_id
    kind: one-to-many
    note: São no máximo três linhas por projeto, uma por tipo de relato, e elas nascem preenchidas apontando para a área de análise porque cliente que encara tela em branco desiste.
  - from: project_states
    fromField: id
    to: project_initial_states
    toField: project_state_id
    kind: one-to-many
    note: "O mesmo estado pode ser a porta de entrada de vários tipos, e é isso que permite as duas formas de trabalhar com uma configuração só: tudo no backlog, ou cada tipo no seu lugar."
  - from: project_states
    fromField: id
    to: reports
    toField: project_state_id
    kind: one-to-many
    note: Vários cards param no mesmo estado, e esta é a ligação que a lista do painel filtra e conta. Estado desativado continua apontado por cards antigos, e é por isso que desativar não é apagar.
  - from: accounts
    fromField: id
    to: reports
    toField: account_id
    kind: one-to-many
    note: A conta aparece direto no relato em vez de ser alcançada pelo projeto, porque esta é a tabela que mais cresce e a que o painel lista o tempo todo.
  - from: projects
    fromField: id
    to: reports
    toField: project_id
    kind: one-to-many
    note: O relato nasce de um projeto, e quem diz qual é a chave pública da requisição.
  - from: reports
    fromField: id
    to: report_contexts
    toField: report_id
    kind: one-to-many
    note: Cada relato traz de zero a muitos pares de contexto, para o formulário mandar um dado a mais amanhã sem alterar reports.
  - from: reports
    fromField: id
    to: report_internal_comments
    toField: report_id
    kind: one-to-many
    note: O time comenta quantas vezes precisar, e nada aqui tem caminho para a camada pública — não há rota, consulta nem campo que leve esta tabela para fora.
  - from: reports
    fromField: id
    to: report_public_comments
    toField: report_id
    kind: one-to-many
    note: O que o time escolhe dizer ao relator, escrito numa tabela própria, e promover um interno a público não é editar um campo — é escrever de novo, de propósito.
  - from: users
    fromField: id
    to: report_internal_comments
    toField: user_id
    kind: one-to-many
    note: Comentário interno sem autor não serve para decidir nada depois, então o autor é obrigatório.
  - from: users
    fromField: id
    to: report_public_comments
    toField: user_id
    kind: one-to-many
    note: O autor fica gravado do lado de dentro mesmo que a camada pública escolha não mostrar o nome de ninguém — e passa a ser nulo quando quem escreveu foi o relator, que não tem usuário aqui. É o mesmo desenho de closed_by_user_id, onde nulo quer dizer que foi o sistema.
  - from: users
    fromField: id
    to: events
    toField: user_id
    kind: one-to-many
    note: Nulo quando a ação veio de fora — o relato criado pelo widget e a visualização feita por quem relatou não têm usuário do time por trás.
  - from: accounts
    fromField: id
    to: events
    toField: account_id
    kind: one-to-many
    note: O evento guarda a conta para a análise separar por cliente, e a ligação sobrevive à exclusão porque a conta é anonimizada, não apagada.
  - from: projects
    fromField: id
    to: events
    toField: project_id
    kind: one-to-many
    note: A comparação que interessa à pesquisa é entre projetos com acompanhamento e projetos sem.
  - from: reports
    fromField: id
    to: events
    toField: report_id
    kind: one-to-many
    note: Um relato acumula vários eventos ao longo da vida, e a partir daqui também um por mudança de estado e um por comentário.
  - from: projects
    fromField: id
    to: project_public_stages
    toField: project_id
    kind: one-to-many
    note: Um projeto desenha a própria jornada pública, entre três e sete etapas — abaixo de três ela não conta uma história, acima de sete volta a ser o organograma interno com palavras mais bonitas.
  - from: projects
    fromField: id
    to: project_status_mappings
    toField: project_id
    kind: one-to-many
    note: O mapa é do projeto, e cada gravação dele cria uma versão inteira nova em vez de alterar as linhas que já existem.
  - from: project_states
    fromField: id
    to: project_status_mappings
    toField: project_state_id
    kind: one-to-many
    note: Um estado interno aparece uma vez por versão do mapa. Estado sem linha nenhuma é estado não mapeado — a ausência é a resposta, e não uma linha apontando para nada.
  - from: project_public_stages
    fromField: id
    to: project_status_mappings
    toField: project_public_stage_id
    kind: one-to-many
    note: "Vários estados internos caem na mesma etapa pública, e é o caminho normal: o time precisa de granularidade que quem está de fora não precisa."
  - from: project_public_stages
    fromField: id
    to: reports
    toField: project_public_stage_id
    kind: one-to-many
    note: "O passo em que o relato aparece para quem o escreveu. É cache: a verdade é a sequência de eventos de mudança de etapa pública."
  - from: reports
    fromField: id
    to: report_closures
    toField: report_id
    kind: one-to-many
    note: "Um relato pode ser encerrado mais de uma vez, porque entre um encerramento e outro ele pode ter sido reaberto. Guardar so o ultimo apagaria a historia que a metrica quer contar: quantas vezes o time achou que tinha acabado antes de acabar de verdade."
  - from: users
    fromField: id
    to: report_closures
    toField: closed_by_user_id
    kind: one-to-many
    note: Quem do time encerrou. Fica nulo quando quem encerrou foi o proprio sistema, no fim do prazo do pedido de informacao — e essa diferenca importa, porque encerramento automatico e o unico que ninguem leu antes de acontecer.
  - from: projects
    fromField: id
    to: project_cycle_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no maximo uma configuracao de ciclo, e projeto sem linha responde com os padroes — que moram em C#, e nao como valor padrao de coluna, para existirem num lugar so. Mesmo desenho da configuracao da ferramenta.
  - from: project_states
    fromField: id
    to: project_cycle_settings
    toField: reopen_state_id
    kind: one-to-many
    note: A coluna para onde o relato reaberto volta. E escolha do cliente, e a sugestao escrita na tela e apontar para uma coluna diferente da de entrada, para o time separar o que voltou do que chegou agora.
  - from: projects
    fromField: id
    to: project_identity_settings
    toField: project_id
    kind: one-to-one
    note: Um projeto tem no maximo uma configuracao de identidade, e projeto sem linha responde com os padroes — que moram em C#, e nao como valor padrao de coluna. Mesmo desenho da configuracao da ferramenta e das regras do ciclo.
  - from: projects
    fromField: id
    to: reporter_codes
    toField: project_id
    kind: one-to-many
    note: O codigo nao atravessa projetos, e isso e proposital — o mesmo texto em dois projetos sao duas pessoas diferentes, e aceitar um codigo de fora transformaria o codigo numa credencial universal que ninguem escolheu criar.
  - from: reporter_codes
    fromField: id
    to: reports
    toField: reporter_code_id
    kind: one-to-many
    note: "E o que junta os relatos da mesma pessoa sem login nenhum. A ligacao e opcional, e precisa ser: relato do modo protocolo, e relato anterior ao modo existir, nao tem codigo nenhum e continua abrindo pelo link de sempre."
  - from: users
    fromField: id
    to: reports
    toField: moderated_by_user_id
    kind: one-to-many
    note: "Quem do time decidiu se o relato vira publico. Ao contrario de closed_by_user_id, aqui ninguem decide sozinho: nao existe moderacao automatica, e a coluna so fica nula enquanto ninguem olhou."
notes:
  - text: |-
      Toda tabela repete as colunas padrão

      Não vira tabela no banco. É id, created_at, updated_at e deleted_at, e tabela nova começa por elas.
    anchor: base_columns
    position: { x: -2, y: 231 }
    width: 320
    inherited: true
  - text: |-
      Evento primeiro, cache depois

      A verdade é a sequência de eventos; reports.project_state_id é cache dela. Nunca gravar o cache sem o evento ter entrado antes, na mesma transação — se o evento falhar e o cache passar, o dado se perde para sempre, e é justamente ele que alimenta a linha do tempo pública, o histórico e as métricas da pesquisa.
    anchor: reports
    anchorField: project_state_id
    position: { x: 700, y: 1900 }
    width: 380
    inherited: true
  - text: |-
      O evento nunca carrega o texto de um comentário

      O payload guarda de-onde, para-onde e o nome que o estado tinha na época. Nunca o corpo do comentário. A linha do tempo que o relator vai ler é montada a partir de events — se o texto interno estivesse ali, vazar seria uma junção distraída, e não um erro difícil.
    anchor: events
    anchorField: payload
    position: { x: 2105, y: 1526 }
    width: 380
    inherited: true
  - text: |-
      Duas tabelas, e não um campo de visibilidade

      O desenho óbvio é uma tabela de comentários com um campo "é público?". Ele é o que mais dá vontade de fazer e o que mais não se pode: com sinalizador, vazar é esquecer um filtro numa consulta; com tabelas separadas, vazar exige escrever uma consulta que não existe. E sem teste automático vigiando, a estrutura precisa carregar essa garantia sozinha.
    anchor: report_internal_comments
    position: { x: 566, y: 1688 }
    width: 380
    inherited: true
  - text: |-
      O evento passa a ter autor

      A mesma tabela guarda ação de quem é do time e ação de quem vem de fora, e por isso a coluna é anulável: o relato criado pelo widget e a visualização feita por quem relatou não têm usuário por trás. Autor vira coluna, e não campo dentro do payload, porque "quem moveu mais cards" não pode virar varredura de texto numa tabela que só cresce.
    anchor: events
    anchorField: user_id
    position: { x: 2364, y: 1120 }
    width: 380
    inherited: true
  - text: |-
      Estado desativado não some

      Desativar deixa de aceitar card novo; apagar quebraria o histórico de todo card que já passou por ele. Por isso deactivated_at é coluna própria, separada de deleted_at. E o estado que é porta de entrada de algum tipo não pode ser desativado sem que outro assuma o lugar.
    anchor: project_states
    anchorField: deactivated_at
    position: { x: 67, y: 820 }
    width: 340
    inherited: true
  - text: |-
      Renomear não reescreve o passado

      O histórico mostra o nome que o estado tinha quando o card passou por ele, e é por isso que o nome vai no payload do evento além do id. Sem isso, renomear "Análise" para "Triagem" mudaria a história de todos os cards antigos de uma vez.
    anchor: project_states
    anchorField: name
    position: { x: 70, y: 669 }
    width: 340
    inherited: true
  - text: |-
      N para 1, e nunca o contrário

      Vários estados internos caem numa mesma etapa pública — "Code Review", "QA" e "Aguardando merge" viram "Em correção". O caminho inverso não existe, e não por falta de espaço no modelo: um estado apontando para duas etapas tornaria a tradução ambígua, e qual delas valeria dependeria da ordem da consulta.
    anchor: project_status_mappings
    position: { x: 900, y: 2480 }
    width: 380
    inherited: true
  - text: |-
      Versão é retrato do conjunto, não a diferença

      Alterar o mapeamento não toca em linha nenhuma das versões anteriores: são elas que explicam por onde um relato de três meses atrás passou. Guardar só o que mudou economizaria linhas e cobraria o preço na leitura — reconstruir o mapa de uma época viraria somar alterações desde o começo, e um erro no meio dessa soma devolveria um mapa errado com cara de certo.
    anchor: project_status_mappings
    anchorField: version
    position: { x: 1430, y: 2260 }
    width: 400
    inherited: true
  - text: |-
      Por que o número da versão mora em projects

      Parece que bastaria o maior valor desta tabela, e não basta: o cliente que desfaz todos os mapeamentos grava uma versão sem nenhuma linha. Calculada pelo maior valor, essa versão seria invisível, e a anterior voltaria a valer sozinha, sem ninguém ter pedido.
    anchor: projects
    anchorField: mapping_version
    position: { x: 1700, y: 450 }
    width: 380
    inherited: true
  - text: |-
      Terminal não quer dizer encerrado

      is_terminal marca onde o trabalho do time acaba. Depois dela ainda vem a confirmação de quem relatou, que é ação da pessoa e não estado do time — e é por isso que terminal é uma marca, e não "a última posição da lista": o passo seguinte cabe sem mexer nesta tabela. Mais de uma etapa pode ser terminal, e é assim que uma jornada acomoda finais diferentes.
    anchor: project_public_stages
    anchorField: is_terminal
    position: { x: -220, y: 2380 }
    width: 380
    inherited: true
  - text: |-
      O desfecho é nosso, o texto é do cliente

      O rótulo e a frase são escritos por quem conhece o próprio usuário. O desfecho não: é uma lista curta e fixa, porque cada equipe inventando o próprio vocabulário de encerramento traria de volta o jargão que esta camada existe para esconder. São quatro porque são os quatro finais que um relato tem — sem os três últimos, o relato que não vai ser feito fica pendurado esperando um fim que nunca chega.
    anchor: project_public_stages
    anchorField: outcome
    position: { x: -220, y: 2700 }
    width: 380
    inherited: true
  - text: |-
      Aqui se remove, nos estados internos só se aposenta

      Não é descuido. O estado interno aposentado precisa continuar visível porque a tela do time mostra a fila inteira; a etapa pública removida não tem esse papel — o que já passou por ela é contado pelos eventos, que guardam o rótulo que valia na época. A remoção é lógica, então a linha continua no banco.
    anchor: project_public_stages
    anchorField: deleted_at
    position: { x: 240, y: 2700 }
    width: 380
    inherited: true
  - text: |-
      Duas linhas do tempo, e não uma com um campo dizendo qual é

      events ganha dois tipos: report_public_stage_changed, que conta o que quem relatou viu, e report_public_stage_unmapped, que registra que a jornada não andou porque o estado está fora do mapa. Elas não andam no mesmo ritmo que a mudança interna — um movimento do time costuma não mover a jornada pública. Juntá-las num registro só obrigaria a análise a adivinhar qual das duas cada linha conta, e essa é exatamente a pergunta de pesquisa.
    anchor: events
    anchorField: type
    position: { x: 2625, y: 1312 }
    width: 400
    inherited: true
  - text: |-
      O evento de tradução carrega a versão do mapa

      Além dos rótulos que valiam na época, o payload guarda qual versão do mapeamento decidiu aquele movimento. Sem ela, recontar um movimento antigo usaria o mapa de hoje e devolveria outra história — e não haveria como perceber, porque o dado necessário para perceber seria justamente o que faltou.
    anchor: events
    anchorField: payload
    position: { x: 2570, y: 1539 }
    width: 400
    inherited: true
  - text: |-
      Encerramento nao e comentario

      Ele acontece uma vez por fechamento, carrega um dos quatro desfechos e tem resposta de quem relatou. Comentario e conversa: muitos por relato, sem desfecho e sem consequencia.

      Se morasse na tabela de comentarios, a pergunta "quantos fecharam como nao sera feito, e o relator aceitou?" viraria "procure o comentario que por acaso e um encerramento" — o sinalizador dentro da tabela que este projeto ja recusou duas vezes.
    anchor: report_closures
    position: { x: 1097, y: 2309 }
    width: 400
    inherited: true
  - text: |-
      Recusar opinar nao e ausencia de opiniao

      Sao tres estados, e nao dois: respondeu de 1 a 5, recusou clicando em "prefiro nao responder", ou nunca respondeu.

      Por isso a nota e anulavel e existe a marca de recusa ao lado. Guardar so "nota nula" juntaria os dois ultimos, e um e escolha enquanto o outro e ausencia — a metrica pareceria precisa sem ser.

      Na tela vale a mesma separacao: a recusa fica fora da escala, nunca como sexta estrela ou zero, senao ela vira a nota mais baixa para quem le depressa.
    anchor: report_closures
    anchorField: satisfaction_declined
    position: { x: 1838, y: 2513 }
    width: 400
    inherited: true
  - text: |-
      A espera e o que torna o desfazer possivel

      O time move as 14h com espera de 30 minutos, e a pagina publica so muda as 14h30. Se alguem moveu sem querer, ha janela para voltar atras antes de a pessoa la fora ver.

      Isso muda a etapa 4: la a jornada publica andava na mesma transacao do movimento interno. Agora o movimento interno grava na hora e o lado publico e agendado. Espera zero volta ao comportamento anterior.
    anchor: reports
    anchorField: public_stage_due_at
    position: { x: 1926, y: 980 }
    width: 380
    inherited: true
  - text: |-
      O projeto dita as regras, e o padrao ja funciona

      Quase tudo desta etapa e configuracao, e nao regra fixa. Mas projeto novo precisa andar sem ninguem abrir esta tela: os padroes vivem no codigo, e a linha so nasce quando alguem salva.

      E a mesma escolha da jornada publica da etapa 4 — o cliente desenha, e o conjunto de fabrica existe para ninguem encarar tela em branco.
    anchor: project_cycle_settings
    position: { x: 2559, y: 2239 }
    width: 400
    inherited: true
  - text: |-
      A escolha de responder e de quem relata

      Nao e configuracao do projeto: o projeto so decide como a opcao vem marcada. Quem relatou um defeito as pressas pode nao querer virar parte da investigacao.

      Desmarcado, o time nao consegue abrir pedido de informacao naquele relato — e encerrar por falta de resposta nao se aplica a quem nunca aceitou responder.
    anchor: reports
    anchorField: accepts_questions
    position: { x: 595, y: 1424 }
    width: 380
    inherited: true
  - text: |-
      Identidade e visibilidade na mesma tabela

      Parecem dois assuntos vizinhos e nao sao: o modo de identificacao decide o que a visibilidade pode ser. Sem identidade nao existe "o meu relato", entao nao existe "so os meus" para escolher, e publico identificado nao tem nome nenhum a mostrar.

      Em duas tabelas a regra teria de ser conferida lendo as duas, e a tela ofereceria uma combinacao que a regra nao permite — o erro apareceria so na hora de salvar.
    anchor: project_identity_settings
    position: { x: 3400, y: 300 }
    width: 400
  - text: |-
      Gravar publico ainda nao publica nada

      Marcar o projeto como publico nao torna relato nenhum visivel: a lista publica so devolve o que passou pela fila de moderacao.

      A ordem e deliberada. Se o campo sozinho publicasse, mudar esta configuracao jogaria na rua todo o texto livre ja escrito — e texto livre e onde aparece documento, numero de pedido e print com dado de terceiro.
    anchor: project_identity_settings
    anchorField: visibility
    position: { x: 3400, y: 640 }
    width: 400
  - text: |-
      Todo relato nasce pending, inclusive em projeto privado

      Tenta-se economizar: projeto privado nao publica, logo nao precisaria de fila. E e exatamente ai que mora o acidente — no dia em que alguem marca o projeto como publico, o backlog inteiro passaria a estar aprovado por nunca ter sido perguntado.

      Nascer pending custa uma coluna e evita uma publicacao em massa que ninguem autorizou.
    anchor: reports
    anchorField: moderation_state
    position: { x: 1780, y: 760 }
    width: 400
  - text: |-
      Perguntar o nome nao e publicar o nome

      Sao tres travas em serie, e todas precisam estar abertas: o projeto pergunta o nome, o projeto esta em publico identificado, e a pessoa marcou que quer assinar aquele relato.

      Qualquer uma fechada, o nome fica interno — o time ve, o lado de fora nao. E por isso que "anonimo com campo de nome" nao existe aqui: o modo se chama sem login, porque coletar nome ja e tratar dado pessoal.
    anchor: reports
    anchorField: reporter_name
    position: { x: 1780, y: 1120 }
    width: 400
  - text: |-
      Nunca se pergunta se um codigo existe

      Sugerir outro codigo so quando o primeiro esta ocupado e dizer que ele esta ocupado, e qualquer diferenca entre livre e ocupado vira uma forma de enumerar o codigo alheio.

      Por isso o codigo e sorteado inteiro, nunca escolhido, e codigo desconhecido na rota publica nao e recusado: vira um codigo novo.

      Na geracao existe uma consulta, e ela nao conta nada: o candidato e sorteado por nos, e a colisao e conferida antes de gravar. A diferenca que importa e quem escolheu o valor consultado.
    anchor: reporter_codes
    anchorField: code
    position: { x: 3400, y: 1000 }
    width: 400
