        note: "report_created | report_viewed | report_state_changed | report_internal_commented | report_public_commented | report_public_stage_changed | report_public_stage_unmapped | report_closed | report_confirmed | report_reopened | report_info_requested | report_replied | report_closure_cancelled, e os dois novos desta etapa: report_published, gravado quando o relato e liberado para o publico, e report_moderation_rejected, quando e recusado"
      - name: source
        type: enum
        required: true
        note: widget | panel | api | public_page, separado do tipo para a pesquisa distinguir quem voltou de quem foi olhar
      - name: payload
        type: json
        note: o resto do evento, em chave e valor, e é o que guarda de-onde, para-onde e o nome que o estado tinha na época — nunca o texto de um comentário
      - name: occurred_at
        type: datetime
        required: true
        note: quando aconteceu, em UTC, e é esta a data que a análise usa
      - name: created_at
        type: datetime
        note: quando a linha foi gravada, em UTC, e diverge de occurred_at quando houve retentativa
  - name: project_public_stages
    label: Etapas públicas
    description: "A jornada que quem relatou acompanha. Existe separada dos estados do projeto porque o time precisa de detalhe que quem está de fora não precisa: vários estados caem numa etapa só, e é essa perda de detalhe que é o produto. Como coluna nos estados, a relação seria 1:1 e a tradução não teria onde acontecer."
    inherited: true
    position: { x: 240, y: 1980 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da etapa, porque a jornada é de cada sistema e não da conta, como a fila de trabalho
      - name: label
        type: text
        required: true
        note: o nome do passo como quem relatou lê, único no projeto entre os não apagados, porque dois rótulos iguais na mesma linha do tempo não teriam como ser distinguidos
      - name: description
        type: text
        required: true
        note: a frase que explica o passo, obrigatória porque rótulo sozinho é exatamente o que a ferramenta de dentro já dava
      - name: next_step
        type: text
        note: o que vem depois, quando o cliente quer dizer, e nulo na última etapa porque ela não tem depois
      - name: position
        type: int
        required: true
        note: "a ordem da jornada, não única pelo mesmo motivo dos estados: reordenar reescreve a lista inteira de uma vez"
      - name: is_terminal
        type: bool
        required: true
        note: "a etapa em que o trabalho do time acaba, e não quer dizer encerrado: a confirmação de quem relatou vem depois dela"
      - name: allows_return
        type: bool
        required: true
        note: a jornada pode voltar para esta etapa, e é a exceção combinada porque por padrão ela não anda para trás
      - name: awaits_reporter
        type: bool
        required: true
        note: a etapa espera quem relatou e não o time, ainda sem leitor nenhum, e nasceu com a tabela porque guardar a decisão agora custa nada e custaria migração depois
      - name: outcome
        type: text
        note: done, wont_do, no_answer ou duplicate, nulo fora da etapa terminal e obrigatório nela, porque um fim sem desfecho é um fim sem explicação
      - name: created_at
        type: datetime
        note: quando a etapa foi criada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a etapa vale, preenchido no lugar de apagar, e aqui existe remoção de verdade diferente do estado interno, que só se aposenta
  - name: project_status_mappings
    label: Mapeamento de estados
    description: "Liga N estados internos a 1 etapa pública, nunca o contrário — um estado apontando para duas etapas deixaria sem resposta a única pergunta que esta tabela responde, que é onde o relato está agora. Versionada: alterar grava o conjunto inteiro de novo, um número acima, porque reescrever o mapa apagaria o sentido de tudo que já aconteceu."
    inherited: true
    position: { x: 900, y: 1980 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono, repetido aqui em vez de alcançado pelo estado porque toda consulta começa por projeto e versão
      - name: project_state_id
        type: long
        fk: true
        required: true
        note: o estado de dentro, de onde o relato sai
      - name: project_public_stage_id
        type: long
        fk: true
        required: true
        note: a etapa de fora, onde quem relatou passa a ver o relato
      - name: version
        type: int
        required: true
        note: a versão a que esta linha pertence, única com projeto e estado entre as não apagadas, e a que vale agora é a gravada em projects
      - name: created_at
        type: datetime
        note: quando a ligação foi criada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto a ligação vale, preenchido no lugar de apagar
  - name: report_info_requests
    label: Pedidos de informação
    description: 'Quando o time devolve o relato pedindo contexto, em vez de encerrar. Tabela nova desta etapa, e existe pelo mesmo motivo de report_closures: acontece mais de uma vez por relato, espera resposta de quem está do outro lado, e tem prazo próprio. "Não reproduzi" e "não vamos fazer" chegando iguais ao relator fazem ele entender que acabou e parar de responder — e o relato morre por ruído, que é o problema que o produto existe para resolver.'
    inherited: true
    position: { x: 1889, y: 1695 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: report_id
        type: long
        fk: true
        required: true
        note: relato devolvido
      - name: asked_by_user_id
        type: long
        fk: true
        required: true
        note: quem do time pediu; obrigatório, ao contrário do encerramento, porque pedir informação é sempre ato de uma pessoa — o sistema nunca pergunta nada
      - name: asked_at
        type: datetime
        required: true
        note: quando o pedido foi aberto, em UTC
      - name: warn_at
        type: datetime
        required: true
        note: a partir de quando a página pública avisa que o relato vai encerrar por falta de resposta; gravado aqui e não lido da configuração, porque mudar o prazo do projeto não pode mover o prazo de um pedido que já está correndo
      - name: close_at
        type: datetime
        required: true
        note: quando o relato encerra como sem retorno, se ninguém responder; é este o momento agendado na fila
      - name: answered_at
        type: datetime
        note: quando quem relatou respondeu; preenchido, o pedido deixou de esperar e o prazo não vale mais
      - name: expired_at
        type: datetime
        note: quando o prazo venceu e o relato foi encerrado sem resposta; com answered_at nulo, é o registro de que o silêncio acabou o assunto
      - name: created_at
        type: datetime
        note: quando a linha foi gravada, em UTC
      - name: updated_at
        type: datetime
        note: última alteração, em UTC
      - name: deleted_at
        type: datetime
        note: exclusão lógica; nulo enquanto o registro vale
  - name: report_closures
    label: Encerramentos
    description: "O encerramento de um relato e a resposta de quem o escreveu, numa linha so. Nao e comentario: acontece uma vez por fechamento, carrega um desfecho e tem resposta. Reabrir e fechar de novo cria uma linha nova, e e dai que saem as metricas — quantos precisaram fechar duas vezes, qual a nota media, quantos encerramentos o relator recusou."
    inherited: true
    position: { x: 1560, y: 1980 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: report_id
        type: long
        fk: true
        required: true
        note: o relato encerrado
      - name: outcome
        type: enum
        required: true
        note: done | wont_do | no_answer | duplicate — a lista e nossa e fixa, independente de quantos estados internos o time tenha
      - name: reason
        type: text
        required: true
        note: o motivo, escrito pelo time e lido por quem relatou; encerrar sem ele e impossivel, e nao desencorajado
      - name: closed_by_user_id
        type: long
        fk: true
        note: quem do time encerrou; nulo quando foi o proprio sistema, no fim do prazo do pedido de informacao
      - name: closed_at
        type: datetime
        required: true
        note: quando o encerramento foi gravado
      - name: public_at
        type: datetime
        required: true
        note: "quando este fechamento passa a valer para quem relatou; igual a closed_at quando não há espera configurada, e adiante dele durante a janela de desfazer. Coluna própria, e não conta feita na leitura: calculá-la a partir da espera do projeto faria mexer na configuração reescrever o passado de um fechamento que já aconteceu — o mesmo motivo de warn_at e close_at serem gravados"
      - name: confirmed_at
        type: datetime
        note: quando quem relatou disse que resolveu; nulo enquanto ele nao respondeu
      - name: satisfaction
        type: int
        note: a nota de 1 a 5; nula quando ele nao respondeu e tambem quando recusou responder
      - name: satisfaction_declined
        type: bool
        required: true
        note: marcado quando ele escolheu "prefiro nao responder"; e o que separa recusa de ausencia, e as duas contam diferente
      - name: reopened_at
        type: datetime
        note: quando ele reabriu em vez de confirmar
      - name: reopen_comment
        type: text
        note: por que ele reabriu, quando o projeto pede o comentario; fica ao lado do motivo do time, que e o par que a metrica le junto
      - name: created_at
        type: datetime
        note: quando o registro foi criado, em UTC
      - name: updated_at
        type: datetime
        note: ultima alteracao, em UTC
      - name: deleted_at
        type: datetime
        note: nulo enquanto o encerramento vale, preenchido no lugar de apagar
  - name: project_cycle_settings
    label: Regras do ciclo
    description: "Como o ciclo fecha neste projeto: quando encerra, quanto espera antes de quem relatou ver, se da para reabrir e como, e o que a pessoa responde no fim. Uma linha por projeto, criada so quando alguem salva — os padroes vivem no codigo, e projeto sem linha e projeto que nunca precisou mudar nada."
    inherited: true
    position: { x: 2220, y: 1980 }
    fields:
      - name: id
        type: long
        pk: true
        note: chave interna, nunca exposta
      - name: public_id
        type: guid
        unique: true
        note: identificador que aparece em URL e API
      - name: project_id
        type: long
        fk: true
        required: true
        note: projeto dono da configuracao, unico entre os nao apagados, e e o que faz o 1:1
      - name: closure_trigger
        type: enum
        required: true
        note: last_column | button — se o relato encerra ao cair na ultima coluna ou por um botao proprio
      - name: public_delay_minutes
        type: int
