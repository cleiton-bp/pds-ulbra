meta:
  title: Etapa 6 — Identidade e visibilidade
  description: Quem e quem num projeto, quem pode ver o que, e a fila que segura todo relato antes de ele virar publico. Montado sobre o que ja existe, que aparece aqui sem alteracao, menos reports, que ganha seis colunas, e events, que ganha dois tipos.
entities:
  - name: base_columns
    label: Colunas padrão
    description: Não é tabela, é o conjunto de colunas que toda tabela do sistema repete, desenhado aqui uma vez para não precisar explicar em cada uma delas.
