        type: long
        fk: true
        required: true
        note: projeto que autoriza este endereço
      - name: domain
        type: text
        required: true
        note: minúsculo, sem esquema e sem barra final, com a porta quando informada, único no projeto entre os não apagados
      - name: allows_subdomains
        type: bool
        required: true
        note: quando verdadeiro vale também para app. e loja. na frente, e nasce desligado porque autorizar demais é o erro que não aparece
