<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Seu sistema (teste)</title>
    <!--
      Uma pagina de mentira, servida pelo proprio painel, que faz o papel do sistema do
      cliente no "Relato de teste": carrega o mesmo carregador que o cliente cola, com a
      chave do projeto, e o botao aparece e abre como abriria la.

      Seguranca: a pagina mora na origem do painel, entao so carrega o carregador do
      proprio painel (`/v1/pds.js`, caminho fixo) e so aceita uma chave publica bem
      formada — nada da URL vira script nem HTML.
    -->
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #6b7280; }
      @media (prefers-color-scheme: dark) { body { background: #16181d; color: #9ca3af; } }
      header { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: rgba(127, 127, 127, 0.12); }
      .bar { height: 10px; border-radius: 999px; background: rgba(127, 127, 127, 0.22); }
      main { max-width: 760px; margin: 32px auto; padding: 0 20px; display: grid; gap: 14px; }
      .card { height: 120px; border-radius: 14px; background: rgba(127, 127, 127, 0.12); }
      .aviso { font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <div class="bar" style="width: 90px"></div>
      <div class="bar" style="width: 56px"></div>
      <div class="bar" style="width: 56px"></div>
    </header>
    <main>
      <p class="aviso">Uma página de exemplo do seu sistema. Clique no botão para relatar.</p>
      <div class="bar" style="width: 60%"></div>
      <div class="bar" style="width: 85%"></div>
      <div class="card"></div>
      <div class="bar" style="width: 70%"></div>
      <div class="card"></div>
    </main>
    <script src="/teste-do-botao.js"></script>
  </body>
</html>
