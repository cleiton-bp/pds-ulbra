<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDS · Painel</title>
    <meta name="description" content="Painel do PDS: seus projetos, chaves e integração." />

    <!-- SVG: troca de cor conforme o tema do navegador (ver o <style> dentro). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      O tema é escrito ANTES de qualquer pintura. `themeStore.ts` só resolve depois
      que o bundle roda, e entre o parse deste HTML e o bundle quem usa tema escuro
      leva um flash branco. Síncrono e sem `defer` de propósito.

      Chave e precedência são as mesmas do `themeStore.ts`, e precisam continuar iguais.
    -->
    <script>
      try {
        var stored = localStorage.getItem('pds.web.theme.v1')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        // Armazenamento bloqueado: cai no claro, e o bundle corrige em seguida.
      }
    </script>

    <!-- `preconnect` reduz a espera do primeiro texto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
