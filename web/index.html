<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Relato Fácil</title>
    <meta name="description" content="Painel do Relato Fácil: seus projetos, chaves e integração." />

    <!--
      O ícone da aba. O SVG troca de cor conforme o tema do navegador (ver o <style>
      dentro) e vem por último, porque no empate vale o último; o ICO, com sizes, fica
      para quem não lê SVG. O apple-touch-icon é o da tela inicial do celular.
      Nome exclusivo no SVG: o navegador guarda o ícone pelo endereço, e um
      favicon.svg em outra porta igual a esta mostrava o ícone de outro projeto.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/marca.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      O tema é escrito ANTES de qualquer pintura. `themeStore.ts` só resolve depois
      que o bundle roda, e entre o parse deste HTML e o bundle quem usa tema escuro
      leva um flash branco. Síncrono e sem `defer` de propósito.

      Chave e precedência são as mesmas do `themeStore.ts`, e precisam continuar iguais.
      Sem sessão guardada a página é a entrada pública, que sai sempre clara.
    -->
    <script src="/tema.js"></script>

    <!--
      A Inter vem do proprio painel (styles/fonts.css). O `preload` busca o arquivo junto
      com o resto da pagina, e o texto ja abre na fonte certa, sem trocar depois.
    -->
    <link
      rel="preload"
      href="/src/styles/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
